<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play – MathAdvice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">MathAdvice</a>
    <a class="back" href="/">← All games</a>
  </header>

  <main class="play">
    <h1 id="title">Loading…</h1>
    <div id="frame" class="frame"></div>
    <div class="controls">
      <button id="fs" type="button">⛶ Fullscreen</button>
      <span id="mobile" class="tag"></span>
    </div>
    <section class="info">
      <h2>About this game</h2>
      <p id="desc"></p>
      <h2>How to play</h2>
      <p id="howto"></p>
      <p class="credit">Made by <span id="source"></span>.<span id="lic"></span></p>
    </section>
    <h2>More games</h2>
    <div id="more" class="grid small"></div>
  </main>

  <footer class="foot">
    <a href="about.html">About</a> · <a href="about.html#teachers">For teachers</a> · <a href="privacy.html">Privacy</a>
  </footer>

  <script src="js/game.js"></script>

</html>

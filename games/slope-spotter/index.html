<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Slope Spotter</title>
</head>
<body>
<script src="../../js/mathquiz.js"></script>
<script>
// Slope Spotter — a MathAdvice original.
MathQuiz({ key: 'slopespotter', title: 'Slope Spotter',
  intro: ['A line is drawn through two points on the grid.', 'Find its slope: rise over run.'],
  gen(level) {
    const { rnd, pick, choices, frac, gcd } = MQ;
    let x1, y1, x2, y2;
    do { x1 = rnd(-5, 1); x2 = rnd(x1 + 1, 5); y1 = rnd(-5, 5); y2 = rnd(-5, 5); }
    while ((level < 1 && (y2 - y1) % (x2 - x1) !== 0) || (y1 === y2 && Math.random() < .7));
    const rise = y2 - y1, run = x2 - x1;
    const fmt = (n, d) => { if (n === 0) return '0'; const g = gcd(n, d); n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : `${n}/${d}`; };
    const label = s => s.includes('/') ? (s[0] === '-' ? '−' : '') + frac(s.replace('-', '').split('/')[0], s.split('/')[1]) : s.replace('-', '−');
    const ans = fmt(rise, run);
    const wrong = [rise === 0 ? 'undefined' : fmt(run, rise), fmt(-rise, run), rise === 0 ? '1' : fmt(rise + (rise > 0 ? 1 : -1), run)];
    const S = 20, O = 130, P = (x, y) => [O + x * S, O - y * S];
    let g = '';
    for (let i = -6; i <= 6; i++) { g += `<line x1="${O + i * S}" y1="10" x2="${O + i * S}" y2="250" stroke="#d6e4f0"/><line x1="10" y1="${O - i * S}" x2="250" y2="${O - i * S}" stroke="#d6e4f0"/>`; }
    g += `<line x1="10" y1="${O}" x2="250" y2="${O}" stroke="#6b6f85" stroke-width="1.5"/><line x1="${O}" y1="10" x2="${O}" y2="250" stroke="#6b6f85" stroke-width="1.5"/>`;
    // Extend the line across the grid.
    const m = rise / run, ext = x => [x, y1 + m * (x - x1)];
    const a = P(...ext(-6)), b = P(...ext(6));
    g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#2f6fd6" stroke-width="3"/>`;
    const p1 = P(x1, y1), p2 = P(x2, y2);
    g += `<circle cx="${p1[0]}" cy="${p1[1]}" r="6" fill="#e8505b"/><circle cx="${p2[0]}" cy="${p2[1]}" r="6" fill="#e8505b"/>`;
    g += `<text x="${p1[0] + 8}" y="${p1[1] + 18}" font-size="13" font-weight="800" fill="#2b2d3a">(${x1}, ${y1})</text><text x="${p2[0] + 8}" y="${p2[1] - 8}" font-size="13" font-weight="800" fill="#2b2d3a">(${x2}, ${y2})</text>`.replace(/-/g, '−');
    return { board: `<svg viewBox="0 0 260 260" style="max-width:300px">${g}</svg>`, q: 'What is the <em>slope</em> of the line?', answer: ans,
      options: choices(ans, wrong, () => fmt(rnd(-6, 6), rnd(1, 4))).map(v => ({ value: v, label: v === 'undefined' ? 'undefined' : label(v) })),
      hint: `Slope = rise ÷ run = (change in y) ÷ (change in x). Lines going down to the right have negative slope.` };
  } });
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Data Detective</title>
<style>
  :root { --bg: #12131a; --panel: #1c1e29; --line: #2c2f3e; --text: #ecedf3; --muted: #9a9db0; --accent: #ffcc33; --good: #3ecf8e; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: manipulation; }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; user-select: none; -webkit-user-select: none; }
  .app { width: 100%; max-width: 460px; text-align: center; }
  .hud { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); }
  .hud b { color: var(--text); }
  .bar { height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; margin: 8px 0 10px; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--accent); }
  .board { background: #f7f5ee; border-radius: 16px; padding: 8px 6px 2px; }
  .board.good { box-shadow: 0 0 0 4px var(--good); } .board.bad { box-shadow: 0 0 0 4px var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .board h2 { margin: 0; color: #2b2d3a; font-size: 1rem; }
  .board .list { margin: 2px 0 0; color: #6b6f85; font-weight: 700; font-size: .95rem; }
  svg { width: 100%; height: auto; display: block; }
  .q { font-weight: 800; font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 12px 0; }
  .q em { color: var(--accent); font-style: normal; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answers button { font: inherit; font-size: 1.45rem; font-weight: 800; padding: 13px 0; border-radius: 12px; cursor: pointer; background: var(--panel); color: var(--text); border: 2px solid var(--line); position: relative; }
  .answers button:hover { border-color: var(--accent); }
  .answers button small { position: absolute; top: 4px; left: 9px; font-size: .7rem; color: var(--muted); }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; min-height: 1.2em; }
  .screen h1 { color: var(--accent); font-size: 2.3rem; margin: 0 0 8px; }
  .screen p { color: var(--muted); margin: 6px 0; }
  .screen .big { font-size: 3rem; font-weight: 800; color: var(--text); }
  .go { margin-top: 16px; font: inherit; font-weight: 800; font-size: 1.2rem; padding: 14px 34px; border: 0; border-radius: 12px; background: var(--accent); color: #111; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <section class="screen" id="start">
    <h1>Data Detective</h1>
    <p>Read the dot plot and crack the case: mean, median, mode, or range.</p>
    <p>90 seconds. Wrong answers cost 5 seconds and show a hint.</p>
    <p>Click the answer or press 1–4.</p>
    <p id="bestStart"></p>
    <button class="go" id="play">Start</button>
  </section>
  <section id="game" hidden>
    <div class="hud"><span>Solved <b id="score">0</b></span><span><b id="time">90</b>s</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="board" id="board">
      <h2 id="title"></h2>
      <svg id="plot" viewBox="0 0 420 210"></svg>
    </div>
    <p class="q" id="q"></p>
    <div class="answers" id="answers"></div>
    <p class="hint" id="hint"></p>
  </section>
  <section class="screen" id="end" hidden>
    <h1>Case closed!</h1>
    <p>Questions solved</p>
    <div class="big" id="final">0</div>
    <p id="bestEnd"></p>
    <button class="go" id="again">Play again</button>
  </section>
</div>
<script>
// Data Detective — a MathAdvice original.
const KEY = 'ma-datadetective-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];

const STORIES = [
  ['Goals scored per game', 'goals'], ['Books read this month', 'books'], ['Pets per household', 'pets'],
  ['Hours of sleep', 'hours'], ['Siblings per student', 'siblings'], ['Texts sent before school', 'texts'],
  ['Push-ups in a row', 'push-ups'], ['Minutes late to class', 'minutes']
];
const HINTS = {
  mean: 'Mean: add up every value, then divide by how many values there are.',
  median: 'Median: put the values in order and take the middle one.',
  mode: 'Mode: the value that shows up most often (the tallest stack of dots).',
  range: 'Range: the biggest value minus the smallest value.'
};
const TOTAL = 90;
let score, timeLeft, running = false, last, answer, locked = false, stat;

function makeData(kind) {
  while (true) {
    const lo = rnd(0, 4), hi = lo + rnd(6, 9);
    let n = pick([5, 7, 9]);
    const data = Array.from({ length: n }, () => rnd(lo, hi));
    const sorted = [...data].sort((a, b) => a - b);
    const sum = data.reduce((a, b) => a + b, 0);
    const counts = {}; data.forEach(v => counts[v] = (counts[v] || 0) + 1);
    const top = Math.max(...Object.values(counts));
    const modes = Object.keys(counts).filter(k => counts[k] === top);
    if (top > 7) continue;                                     // keep dot stacks on the board
    if (kind === 'mean' && sum % n !== 0) continue;           // keep the mean a whole number
    if (kind === 'mode' && (modes.length !== 1 || top < 2)) continue; // one clear mode
    return { data, sorted, lo, hi, mean: sum / n, median: sorted[(n - 1) / 2], mode: +modes[0], range: sorted[n - 1] - sorted[0] };
  }
}

function drawPlot(d) {
  const lo = Math.max(0, d.lo - 1), hi = d.hi + 1, x0 = 30, x1 = 390, y = 170;
  const X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
  let s = `<line x1="${x0 - 10}" y1="${y}" x2="${x1 + 10}" y2="${y}" stroke="#2b2d3a" stroke-width="3"/>`;
  for (let v = lo; v <= hi; v++) {
    s += `<line x1="${X(v)}" y1="${y - 6}" x2="${X(v)}" y2="${y + 6}" stroke="#2b2d3a" stroke-width="2"/>`;
    s += `<text x="${X(v)}" y="${y + 26}" fill="#2b2d3a" font-size="16" font-weight="700" font-family="Lexend,system-ui,sans-serif" text-anchor="middle">${v}</text>`;
  }
  const stack = {};
  d.sorted.forEach(v => {
    stack[v] = (stack[v] || 0) + 1;
    s += `<circle cx="${X(v)}" cy="${y - 4 - stack[v] * 22}" r="9" fill="#2f6fd6"/>`;
  });
  return s;
}

function next() {
  stat = score < 3 ? pick(['mode', 'range', 'median']) : pick(['mean', 'median', 'mode', 'range']);
  const d = makeData(stat), [title, unit] = pick(STORIES);
  $('title').textContent = title; $('plot').innerHTML = drawPlot(d);
  answer = d[stat];
  const names = { mean: 'mean', median: 'median', mode: 'mode', range: 'range' };
  $('q').innerHTML = `What is the <em>${names[stat]}</em> number of ${unit}?`;
  // Wrong answers: the other statistics first (classic mix-ups), then nearby numbers.
  const set = new Set([answer]);
  ['mean', 'median', 'mode', 'range'].forEach(k => { if (set.size < 4 && Number.isInteger(d[k]) && d[k] !== answer) set.add(d[k]); });
  while (set.size < 4) { const v = answer + rnd(-3, 3); if (v >= 0) set.add(v); }
  $('answers').innerHTML = [...set].sort(() => Math.random() - .5).map((v, i) => `<button data-v="${v}"><small>${i + 1}</small>${v}</button>`).join('');
  $('hint').textContent = '';
}
function choose(v) {
  if (!running || locked) return;
  const b = $('board'); b.classList.remove('good', 'bad'); void b.offsetWidth;
  if (v === answer) { score++; $('score').textContent = score; b.classList.add('good'); next(); }
  else { timeLeft -= 5; b.classList.add('bad'); $('hint').textContent = HINTS[stat]; locked = true; setTimeout(() => locked = false, 300); }
}
$('answers').addEventListener('click', e => { const b = e.target.closest('button'); if (b) choose(+b.dataset.v); });
addEventListener('keydown', e => {
  if (running && /^[1-4]$/.test(e.key)) { const b = $('answers').children[+e.key - 1]; if (b) choose(+b.dataset.v); }
  else if (!running && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); start(); }
});
function start() {
  score = 0; timeLeft = TOTAL; running = true; last = performance.now(); $('score').textContent = 0;
  $('start').hidden = true; $('end').hidden = true; $('game').hidden = false;
  next(); requestAnimationFrame(tick);
}
function tick(t) {
  if (!running) return;
  if (window.MA_WAIT) { last = t; requestAnimationFrame(tick); return; } // clock waits for the first answer
  timeLeft -= (t - last) / 1000; last = t;
  if (timeLeft <= 0) return end();
  $('time').textContent = Math.ceil(timeLeft); $('bar').style.width = (timeLeft / TOTAL * 100) + '%';
  requestAnimationFrame(tick);
}
function end() {
  running = false;
  const best = Math.max(getBest(), score); setBest(best);
  $('final').textContent = score; $('bestEnd').textContent = score >= best && score > 0 ? 'New best!' : 'Best: ' + best;
  $('game').hidden = true; $('end').hidden = false;
}
$('play').onclick = start; $('again').onclick = start;
$('bestStart').textContent = getBest() ? 'Best: ' + getBest() : '';
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

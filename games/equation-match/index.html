<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Equation Match</title>
<style>
  :root { --bg: #12131a; --panel: #1c1e29; --line: #2c2f3e; --text: #ecedf3; --muted: #9a9db0; --accent: #ffcc33; --good: #3ecf8e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 14px; user-select: none; -webkit-user-select: none; }
  .app { width: 100%; max-width: 440px; }
  .hud { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .hud b { color: var(--text); }
  .hud button { font: inherit; font-weight: 700; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; perspective: 800px; }
  .card { aspect-ratio: 3 / 4; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .35s; border: 0; padding: 0; background: none; }
  .card.up, .card.done { transform: rotateY(180deg); cursor: default; }
  .face { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .back {
    background: #f7f5ee; border: 2px solid #d6e4f0;
    background-image: linear-gradient(#d6e4f0 1px, transparent 1px), linear-gradient(90deg, #d6e4f0 1px, transparent 1px);
    background-size: 14px 14px; color: #3d6fb6; font-weight: 800; font-size: 1.5rem;
  }
  .front { background: var(--panel); border: 2px solid var(--line); transform: rotateY(180deg); font-weight: 800; color: var(--text); font-size: clamp(1rem, 5vw, 1.4rem); text-align: center; padding: 4px; }
  .front.a { font-size: clamp(1.5rem, 8vw, 2.2rem); color: var(--accent); }
  .card.done .front { border-color: var(--good); }
  .win { text-align: center; margin-top: 16px; }
  .win h2 { color: var(--accent); margin: 0 0 4px; font-size: 1.8rem; }
  .win p { color: var(--muted); margin: 4px 0; }
  .win button { margin-top: 10px; font: inherit; font-weight: 800; padding: 12px 28px; border: 0; border-radius: 12px; background: var(--accent); color: #111; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <span>Moves <b id="moves">0</b></span>
    <span>Time <b id="time">0:00</b></span>
    <button id="restart" type="button">New game</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="win" id="win" hidden>
    <h2>All solved!</h2>
    <p id="result"></p>
    <p id="best"></p>
    <button id="again" type="button">Play again</button>
  </div>
</div>
<script>
// Equation Match — a MathAdvice original.
const KEY = 'ma-equationmatch-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const $ = id => document.getElementById(id);
const PAIRS = 8;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
// Make 8 problems with 8 different answers. Each pair is a problem card + its answer card.
function makePairs() {
  const used = new Set(), pairs = [];
  while (pairs.length < PAIRS) {
    const op = ['+', '−', '×', '÷'][rnd(0, 3)];
    let a, b, ans;
    if (op === '+') { a = rnd(2, 30); b = rnd(2, 30); ans = a + b; }
    if (op === '−') { a = rnd(10, 50); b = rnd(1, a - 1); ans = a - b; }
    if (op === '×') { a = rnd(2, 12); b = rnd(2, 12); ans = a * b; }
    if (op === '÷') { b = rnd(2, 10); ans = rnd(2, 12); a = b * ans; }
    if (used.has(ans)) continue;
    used.add(ans);
    pairs.push({ key: ans, problem: `${a} ${op} ${b}`, answer: String(ans) });
  }
  return pairs;
}

let open = [], matched = 0, moves = 0, startTime = 0, timerId = null, busy = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function newGame() {
  open = []; matched = 0; moves = 0; busy = false; startTime = 0;
  clearInterval(timerId); timerId = null;
  $('moves').textContent = 0; $('time').textContent = '0:00'; $('win').hidden = true;
  const deck = shuffle(makePairs().flatMap(p => [{ key: p.key, text: p.problem, cls: 'q' }, { key: p.key, text: p.answer, cls: 'a' }]));
  $('grid').innerHTML = deck.map((s, i) =>
    `<button class="card" data-s="${s.key}" aria-label="Card ${i + 1}"><span class="face back">?</span><span class="face front ${s.cls}">${s.text}</span></button>`
  ).join('');
}

function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card || busy || card.classList.contains('up') || card.classList.contains('done')) return;
  if (!timerId) { startTime = Date.now(); timerId = setInterval(() => { $('time').textContent = fmt(Date.now() - startTime); }, 250); }
  card.classList.add('up');
  open.push(card);
  if (open.length < 2) return;
  moves++; $('moves').textContent = moves;
  const [a, b] = open;
  if (a.dataset.s === b.dataset.s) {
    a.classList.add('done'); b.classList.add('done'); open = []; matched++;
    if (matched === PAIRS) win();
  } else {
    busy = true;
    setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); open = []; busy = false; }, 800);
  }
});

function win() {
  clearInterval(timerId);
  const best = getBest();
  $('result').textContent = `${moves} moves in ${fmt(Date.now() - startTime)}`;
  if (!best || moves < best) { setBest(moves); $('best').textContent = 'New best!'; }
  else $('best').textContent = `Best: ${best} moves`;
  $('win').hidden = false;
}

$('restart').onclick = newGame; $('again').onclick = newGame;
newGame();
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

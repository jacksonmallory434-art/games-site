<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Quick Maths</title>
<style>
  :root { --bg: #12131a; --panel: #1c1e29; --line: #2c2f3e; --text: #ecedf3; --muted: #9a9db0; --accent: #ffcc33; --good: #3ecf8e; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; user-select: none; -webkit-user-select: none; }
  .app { width: 100%; max-width: 440px; }
  .hud { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); }
  .hud b { color: var(--text); }
  .bar { height: 10px; background: var(--panel); border-radius: 999px; overflow: hidden; margin: 10px 0 24px; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .1s linear; }
  .problem {
    background: #f7f5ee; color: #2b2d3a; border-radius: 16px; text-align: center;
    font-size: clamp(2.4rem, 12vw, 3.6rem); font-weight: 800; padding: 28px 10px;
    background-image: linear-gradient(#d6e4f0 1px, transparent 1px), linear-gradient(90deg, #d6e4f0 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .problem.good { box-shadow: 0 0 0 4px var(--good); }
  .problem.bad { box-shadow: 0 0 0 4px var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .answers button {
    font: inherit; font-size: 1.7rem; font-weight: 800; padding: 18px 0; border-radius: 14px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 2px solid var(--line); position: relative;
  }
  .answers button:hover { border-color: var(--accent); }
  .answers button small { position: absolute; top: 6px; left: 10px; font-size: .75rem; color: var(--muted); }
  .screen { text-align: center; }
  .screen h1 { font-size: 2.6rem; margin: 0 0 6px; color: var(--accent); }
  .screen p { color: var(--muted); margin: 6px 0; }
  .screen .big { font-size: 3rem; font-weight: 800; color: var(--text); }
  .go { margin-top: 20px; font: inherit; font-weight: 800; font-size: 1.2rem; padding: 14px 34px; border: 0; border-radius: 12px; background: var(--accent); color: #111; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <section class="screen" id="start">
    <h1>Quick Maths</h1>
    <p>Answer as many problems as you can in 60 seconds.</p>
    <p>Wrong answers cost 3 seconds. Streaks earn bonus time.</p>
    <p>Click the answer, or press 1–4.</p>
    <p id="bestStart"></p>
    <button class="go" id="play">Start</button>
  </section>

  <section id="game" hidden>
    <div class="hud"><span>Score <b id="score">0</b></span><span>Streak <b id="streak">0</b></span><span><b id="time">60</b>s</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="problem" id="problem">2 + 2</div>
    <div class="answers" id="answers"></div>
  </section>

  <section class="screen" id="end" hidden>
    <h1>Time's up!</h1>
    <p>You solved</p>
    <div class="big" id="final">0</div>
    <p id="bestEnd"></p>
    <button class="go" id="again">Play again</button>
  </section>
</div>
<script>
// Quick Maths — a MathAdvice original.
const KEY = 'ma-quickmaths-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const TOTAL = 60;
let score, streak, timeLeft, answer, running = false, lastTick, locked = false;

function makeProblem() {
  // Gets harder as your score climbs.
  const lvl = Math.min(4, Math.floor(score / 6));
  const ops = ['+', '−', '×', '÷'].slice(0, Math.min(4, 2 + lvl));
  const op = ops[rnd(0, ops.length - 1)];
  const max = [10, 20, 30, 50, 99][lvl];
  let a, b;
  if (op === '+') { a = rnd(1, max); b = rnd(1, max); answer = a + b; }
  if (op === '−') { a = rnd(2, max); b = rnd(1, a); answer = a - b; }
  if (op === '×') { a = rnd(2, 5 + lvl * 2); b = rnd(2, 9 + lvl); answer = a * b; }
  if (op === '÷') { b = rnd(2, 9 + lvl); answer = rnd(2, 10 + lvl); a = b * answer; }
  $('problem').textContent = `${a} ${op} ${b}`;
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const off = rnd(1, Math.max(3, Math.ceil(answer * 0.2))) * (Math.random() < 0.5 ? -1 : 1);
    if (answer + off >= 0) opts.add(answer + off);
  }
  const list = [...opts].sort(() => Math.random() - 0.5);
  $('answers').innerHTML = list.map((v, i) => `<button data-v="${v}"><small>${i + 1}</small>${v}</button>`).join('');
}

function choose(v) {
  if (!running || locked) return;
  const p = $('problem');
  p.classList.remove('good', 'bad'); void p.offsetWidth;
  if (v === answer) {
    score++; streak++;
    if (streak % 5 === 0) timeLeft = Math.min(TOTAL, timeLeft + 2);
    p.classList.add('good');
    makeProblem();
  } else {
    streak = 0; timeLeft -= 3;
    p.classList.add('bad');
    locked = true; setTimeout(() => { locked = false; }, 250);
  }
  $('score').textContent = score; $('streak').textContent = streak;
}

$('answers').addEventListener('click', e => { const b = e.target.closest('button'); if (b) choose(+b.dataset.v); });
addEventListener('keydown', e => {
  if (running && /^[1-4]$/.test(e.key)) { const b = $('answers').children[+e.key - 1]; if (b) choose(+b.dataset.v); }
  else if (!running && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); start(); }
});

function start() {
  score = 0; streak = 0; timeLeft = TOTAL; running = true; lastTick = performance.now();
  $('score').textContent = 0; $('streak').textContent = 0;
  $('start').hidden = true; $('end').hidden = true; $('game').hidden = false;
  makeProblem();
  requestAnimationFrame(tick);
}
function tick(t) {
  if (!running) return;
  if (window.MA_WAIT) { lastTick = t; requestAnimationFrame(tick); return; } // clock waits for the first answer
  timeLeft -= (t - lastTick) / 1000; lastTick = t;
  if (timeLeft <= 0) return end();
  $('time').textContent = Math.ceil(timeLeft);
  $('bar').style.width = (timeLeft / TOTAL * 100) + '%';
  requestAnimationFrame(tick);
}
function end() {
  running = false;
  const best = Math.max(getBest(), score); setBest(best);
  $('final').textContent = score;
  $('bestEnd').textContent = score >= best && score > 0 ? 'New best!' : 'Best: ' + best;
  $('game').hidden = true; $('end').hidden = false;
}
$('play').onclick = start; $('again').onclick = start;
$('bestStart').textContent = getBest() ? 'Best: ' + getBest() : '';
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

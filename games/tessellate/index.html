<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessellate</title>
<script src="../_kit/kit.js"></script>
</head>
<body>
<script>
(() => {
  // Each letter is one piece of the answer; '.' is outside the shape.
  const MAPS = [
    ['AAB', 'ACB', 'CCB'],
    ['AAAB', 'ACBB', 'CCDB', 'CDDD'],
    ['..A..', '.BAA.', 'BBCAD', '.BCDD', '..CCD'],
    ['AAABB', 'ACCBB', 'ACDDB', 'EEDFF', 'EEEFF'],
    ['AABBBC', 'ADDBCC', 'AEDFFC', 'AEEEFF'],
    ['AAABBC', 'ADABCC', 'DDDBCE', 'FDGBEE', 'FFGGGE'],
  ];
  const COLORS = ['#ff5d73', '#ffd34d', '#4fd1ff', '#7ee36b', '#a66bff', '#ff9f43', '#ff6bd6', '#2ee6c5'];
  let lv = 0, board, cols, rows, cell, bx, by, pieces, drag, selected, moves, saved, solved;
  const flipBtn = { x: 490, y: 530, w: 120, h: 48, label: '⇋ Flip', size: 18, color: '#a66bff' };
  const rotBtn = { x: 620, y: 530, w: 120, h: 48, label: '↻ Turn', size: 18, color: '#4fd1ff' };
  const resetBtn = { x: 690, y: 14, w: 88, h: 40, label: 'Reset', size: 15, color: '#39405a', textColor: '#e6eaf8' };

  const K = window.K = MA.game({
    slug: 'tessellate', title: 'Tessellate', accent: '#a66bff', accent2: '#ffd34d', bg: ['#140a2a', '#0a1828'],
    noMenu: true, update, draw,
    down(x, y) {
      if (K.state !== 'play') return;
      if (K.hit(resetBtn, x, y)) return load(lv);
      if (selected && K.hit(flipBtn, x, y)) return transform(selected, 'flip');
      if (selected && K.hit(rotBtn, x, y)) return transform(selected, 'rot');
      const p = pieceAt(x, y);
      if (!p) return;
      const s = scaleOf(p);
      if (p.placed) { setCells(p, 0); p.placed = null; }
      drag = { p, ox: (x - p.x) / s, oy: (y - p.y) / s, sx: x, sy: y, moved: false };
      selected = p;
      pieces.splice(pieces.indexOf(p), 1); pieces.push(p);
      K.sfx.tick();
    },
    move(x, y) {
      if (!drag) return;
      if (Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
      if (drag.moved) { drag.p.drag = true; drag.p.x = x - drag.ox * cell; drag.p.y = y - drag.oy * cell; }
    },
    up(x, y) {
      if (!drag) return;
      const p = drag.p; p.drag = false;
      if (!drag.moved) { drag = null; transform(p, 'rot', true); return; }
      drag = null;
      drop(p);
    },
    key(k) {
      if (K.state !== 'play' || !selected) return;
      if (k === 'r' || k === 'R' || k === ' ') transform(selected, 'rot');
      if (k === 'f' || k === 'F') transform(selected, 'flip');
    },
  });

  saved = K.load('stars', []);
  function menu() {
    K.state = 'menu';
    K.overlay({
      kicker: 'MathAdvice', title: 'Tessellate',
      sub: 'Turn, flip, and slide the pieces until they fill the shape with no gaps and no overlaps.',
      how: ['Drag a piece onto the board.', 'Tap a piece to <b>rotate</b> it 90°. Use Flip to <b>reflect</b> it (or press R and F).', 'Fill every square to finish the puzzle.'],
      html: `<p class="ma-best">${saved.filter(Boolean).length} / ${MAPS.length} solved</p>`,
      levels: { n: MAPS.length, unlocked: Math.min(MAPS.length - 1, saved.filter(Boolean).length), stars: saved, on: i => { K.state = 'play'; load(i); } },
      buttons: [],
    });
  }
  const ready = () => menu();
  document.fonts ? document.fonts.load('700 16px Lexend').then(ready, ready) : ready();

  const norm = cs => { const mx = Math.min(...cs.map(c => c[0])), my = Math.min(...cs.map(c => c[1])); return cs.map(([x, y]) => [x - mx, y - my]); };
  const rot = cs => norm(cs.map(([x, y]) => [-y, x]));
  const flip = cs => norm(cs.map(([x, y]) => [-x, y]));
  const size = cs => [Math.max(...cs.map(c => c[0])) + 1, Math.max(...cs.map(c => c[1])) + 1];

  function load(i) {
    lv = i;
    const m = MAPS[i];
    rows = m.length; cols = m[0].length;
    cell = Math.floor(Math.min(56, 400 / cols, 400 / rows));
    bx = 250 - cols * cell / 2; by = 300 - rows * cell / 2 + 10;
    board = m.map(row => [...row].map(ch => (ch === '.' ? -1 : 0)));
    const groups = {};
    m.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') (groups[ch] = groups[ch] || []).push([c, r]); }));
    pieces = Object.keys(groups).sort().map((k, j) => {
      let cs = norm(groups[k]);
      // scramble the starting orientation
      for (let t = 0; t < (j % 3) + 1; t++) cs = rot(cs);
      if (j % 2) cs = flip(cs);
      return { id: j + 1, cells: cs, color: COLORS[j % COLORS.length], placed: null, x: 0, y: 0, slot: j };
    });
    pieces.forEach(goHome);
    selected = null; drag = null; moves = 0; solved = false;
  }
  const traySlot = j => {
    const n = pieces.length, perCol = Math.ceil(n / 2), h = 420 / perCol;
    return { x: 490 + (j % 2) * 145, y: 84 + Math.floor(j / 2) * h, w: 140, h: h - 8 };
  };
  const trayScale = p => { const [w, h] = size(p.cells), s = traySlot(p.slot); return Math.min(0.62, (s.w - 16) / (w * cell), (s.h - 16) / (h * cell)); };
  const scaleOf = p => (p.placed || p.drag ? 1 : trayScale(p)) * cell;
  function goHome(p) {
    const s = traySlot(p.slot), [w, h] = size(p.cells), sc = trayScale(p) * cell;
    p.tx = s.x + (s.w - w * sc) / 2; p.ty = s.y + (s.h - h * sc) / 2;
    if (!p.x && !p.y) { p.x = p.tx; p.y = p.ty; }
  }
  function pieceAt(x, y) {
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i], s = scaleOf(p);
      if (p.cells.some(([cx, cy]) => x >= p.x + cx * s && x <= p.x + (cx + 1) * s && y >= p.y + cy * s && y <= p.y + (cy + 1) * s)) return p;
    }
    return null;
  }
  function fits(p, c0, r0) {
    return p.cells.every(([cx, cy]) => { const c = c0 + cx, r = r0 + cy; return r >= 0 && r < rows && c >= 0 && c < cols && board[r][c] === 0; });
  }
  function setCells(p, v) { for (const [cx, cy] of p.cells) board[p.placed.r + cy][p.placed.c + cx] = v; }
  function place(p, c, r) { p.placed = { c, r }; setCells(p, p.id); p.tx = bx + c * cell; p.ty = by + r * cell; }

  function drop(p) {
    const c = Math.round((p.x - bx) / cell), r = Math.round((p.y - by) / cell);
    if (fits(p, c, r)) {
      place(p, c, r); moves++;
      K.sfx.note(440 + pieces.filter(q => q.placed).length * 70, 0.12);
      K.burst(p.tx + size(p.cells)[0] * cell / 2, p.ty + size(p.cells)[1] * cell / 2, p.color, 10, 140, 3);
      check();
    } else { goHome(p); K.sfx.whoosh(); }
  }

  function transform(p, kind, tapped) {
    const was = p.placed;
    if (was) setCells(p, 0);
    p.cells = kind === 'rot' ? rot(p.cells) : flip(p.cells);
    moves++;
    K.sfx.note(kind === 'rot' ? 660 : 560, 0.07);
    K.float(p.x + 20, p.y - 10, kind === 'rot' ? 'rotate 90°' : 'reflect', kind === 'rot' ? '#4fd1ff' : '#a66bff', 16);
    if (was) {
      if (fits(p, was.c, was.r)) { place(p, was.c, was.r); check(); }
      else { p.placed = null; goHome(p); }
    } else goHome(p);
  }

  function check() {
    if (solved) return;
    if (!board.every(row => row.every(v => v !== 0))) return;
    solved = true; K.state = 'over';
    saved[lv] = 3; K.save('stars', saved);
    K.flash('#fff', 0.2); K.burst(250, 300, '#ffd34d', 50, 420, 5); K.burst(250, 300, '#a66bff', 40, 320);
    K.sfx.win();
    setTimeout(() => {
      const btns = [];
      if (lv < MAPS.length - 1) btns.push({ label: 'Next puzzle', on: () => { K.state = 'play'; load(lv + 1); } });
      btns.push({ label: 'Puzzles', ghost: true, on: menu });
      K.overlay({ kicker: `Puzzle ${lv + 1}`, title: 'Perfect fit!', sub: `Solved with ${moves} moves. No gaps, no overlaps.`, buttons: btns });
    }, 900);
  }
  window.solveLevel = () => {
    // rebuild the answer from the map
    board.forEach(row => row.forEach((v, i) => { if (v > 0) row[i] = 0; }));
    const m = MAPS[lv], groups = {};
    m.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') (groups[ch] = groups[ch] || []).push([c, r]); }));
    Object.keys(groups).sort().forEach((k, j) => {
      const p = pieces.find(q => q.id === j + 1), cs = groups[k];
      p.cells = norm(cs);
      const c0 = Math.min(...cs.map(c => c[0])), r0 = Math.min(...cs.map(c => c[1]));
      place(p, c0, r0);
    });
    check();
  };

  function update(dt) {
    for (const p of pieces || []) if (!p.drag) { p.x += (p.tx - p.x) * Math.min(1, dt * 16); p.y += (p.ty - p.y) * Math.min(1, dt * 16); }
  }

  function drawPiece(c, p, x, y, s, glow) {
    for (const [cx, cy] of p.cells) K.tile(c, x + cx * s + 1.5, y + cy * s + 1.5, s - 3, s - 3, p.color, { r: Math.max(4, s * 0.18), depth: Math.max(2, s * 0.08), glow });
  }

  function draw(c, t) {
    if (!board) {
      const demo = [[0, 0, '#ff5d73'], [1, 0, '#ff5d73'], [0, 1, '#ff5d73'], [2, 0, '#ffd34d'], [2, 1, '#ffd34d'], [2, 2, '#ffd34d'], [1, 1, '#4fd1ff'], [0, 2, '#4fd1ff'], [1, 2, '#4fd1ff']];
      for (const [x, y, col] of demo) K.tile(c, 310 + x * 60, 200 + y * 60 + Math.sin(t * 2 + x + y) * 3, 56, 56, col, { r: 10 });
      return;
    }
    // board
    K.panel(c, bx - 14, by - 14, cols * cell + 28, rows * cell + 28, { r: 18, fill: 'rgba(8,8,26,.55)', glow: 26, glowColor: 'rgba(166,107,255,.3)' });
    for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) if (board[r][cc] !== -1) {
      c.fillStyle = 'rgba(166,107,255,.14)'; c.strokeStyle = 'rgba(166,107,255,.35)'; c.lineWidth = 1;
      K.rr(c, bx + cc * cell + 2, by + r * cell + 2, cell - 4, cell - 4, 6); c.fill(); c.stroke();
    }
    // drop preview
    if (drag && drag.moved) {
      const p = drag.p, gc = Math.round((p.x - bx) / cell), gr = Math.round((p.y - by) / cell);
      if (fits(p, gc, gr)) for (const [cx, cy] of p.cells) { c.fillStyle = K.alpha(p.color, 0.3); K.rr(c, bx + (gc + cx) * cell + 2, by + (gr + cy) * cell + 2, cell - 4, cell - 4, 6); c.fill(); }
    }
    // tray
    K.panel(c, 480, 76, 300, 436, { r: 18, fill: 'rgba(8,8,26,.35)' });
    for (const p of pieces) {
      if (p.drag) continue;
      const s = scaleOf(p);
      drawPiece(c, p, p.x, p.y, s, p === selected ? 16 : 0);
    }
    if (drag && drag.moved) drawPiece(c, drag.p, drag.p.x, drag.p.y, cell, 24);
    // HUD
    K.chip(22, 14, 'Puzzle', `${lv + 1} / ${MAPS.length}`, '#fff', { w: 100, h: 50 });
    K.chip(132, 14, 'Moves', moves, '#4fd1ff', { w: 90, h: 50 });
    const filled = board.flat().filter(v => v > 0).length, total = board.flat().filter(v => v !== -1).length;
    K.chip(232, 14, 'Filled', `${filled} / ${total}`, '#ffd34d', { w: 110, h: 50 });
    K.button(resetBtn);
    flipBtn.disabled = rotBtn.disabled = !selected;
    K.button(flipBtn); K.button(rotBtn);
    K.text('Tap a piece to turn it', 250, 572, 12, 'rgba(220,228,250,.55)');
  }
})();
</script>
</body>
</html>

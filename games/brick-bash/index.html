<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Bash</title>
<style>
  html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Brick Bash — a MathAdvice original.
const W = 480, H = 640;
const c = document.getElementById('c'), ctx = c.getContext('2d');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H); const d = devicePixelRatio || 1;
  c.style.width = W * scale + 'px'; c.style.height = H * scale + 'px';
  c.width = W * scale * d; c.height = H * scale * d;
  ctx.setTransform(scale * d, 0, 0, scale * d, 0, 0);
}
addEventListener('resize', fit); fit();

const KEY = 'ma-brickbash-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };

const COLS = 8, BW = 52, BH = 20, GAP = 4, TOP = 80;
const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
const COLORS = ['#e8505b', '#f5a04a', '#ffcc33', '#3ecf8e', '#4a8cf0', '#9b6cf0', '#e86bb8'];

let paddle, ball, bricks, lives, score, level, state, best = getBest(), keys = {};

function buildLevel() {
  bricks = [];
  const rows = Math.min(7, 4 + level);
  for (let r = 0; r < rows; r++) for (let col = 0; col < COLS; col++) {
    // Later levels add tougher 2-hit bricks.
    const tough = level >= 2 && (r + col + level) % 5 === 0;
    bricks.push({ x: LEFT + col * (BW + GAP), y: TOP + r * (BH + GAP), hp: tough ? 2 : 1, color: COLORS[r % COLORS.length] });
  }
}
function resetBall() {
  ball = { x: paddle.x, y: paddle.y - 12, vx: 0, vy: 0, r: 8, stuck: true };
}
function newGame() {
  lives = 3; score = 0; level = 1; state = 'ready';
  paddle = { x: W / 2, y: H - 50, w: 92, h: 14 };
  buildLevel(); resetBall();
}
newGame();

function launch() {
  if (state === 'over' || state === 'won') { newGame(); return; }
  state = 'play';
  if (ball.stuck) {
    const sp = 5 + level * 0.4;
    const ang = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(ang) * sp; ball.vy = Math.sin(ang) * sp; ball.stuck = false;
  }
}
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); launch(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
function pointerX(e) { const rect = c.getBoundingClientRect(); return (e.clientX - rect.left) / scale; }
c.addEventListener('pointermove', e => { paddle.x = pointerX(e); });
c.addEventListener('pointerdown', e => { e.preventDefault(); paddle.x = pointerX(e); launch(); });

function update(dt) {
  if (keys.ArrowLeft || keys.KeyA) paddle.x -= 8 * dt;
  if (keys.ArrowRight || keys.KeyD) paddle.x += 8 * dt;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
  if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - 12; return; }
  if (state !== 'play') return;

  // Move in small steps so the ball never skips through a brick.
  const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 4);
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx * dt / steps; ball.y += ball.vy * dt / steps;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < 52 + ball.r) { ball.y = 52 + ball.r; ball.vy = Math.abs(ball.vy); }
    // Paddle: where it hits decides the bounce angle.
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y - paddle.h / 2 && ball.y < paddle.y + paddle.h / 2 &&
        Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
      const hit = (ball.x - paddle.x) / (paddle.w / 2);
      const sp = Math.hypot(ball.vx, ball.vy);
      const ang = -Math.PI / 2 + Math.max(-1, Math.min(1, hit)) * 1.05;
      ball.vx = Math.cos(ang) * sp; ball.vy = Math.sin(ang) * sp;
      ball.y = paddle.y - paddle.h / 2 - ball.r;
    }
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const nx = Math.max(b.x, Math.min(ball.x, b.x + BW)), ny = Math.max(b.y, Math.min(ball.y, b.y + BH));
      if (Math.hypot(ball.x - nx, ball.y - ny) <= ball.r) {
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
        if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        b.hp--; score += b.hp === 0 ? 10 : 5;
        // Speed up a little with each brick.
        ball.vx *= 1.008; ball.vy *= 1.008;
        break;
      }
    }
  }
  if (ball.y > H + 20) {
    lives--;
    if (lives <= 0) { state = 'over'; if (score > best) { best = score; setBest(best); } }
    else { state = 'ready'; resetBall(); }
  }
  if (bricks.every(b => b.hp <= 0)) {
    level++; score += 100;
    if (score > best) { best = score; setBest(best); }
    buildLevel(); state = 'ready'; resetBall();
  }
}

function text(s, x, y, size, color, align = 'center', weight = 800) {
  ctx.fillStyle = color; ctx.font = `${weight} ${size}px system-ui, sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
}
function draw() {
  ctx.fillStyle = '#1c1e29'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#242737'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, 52); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 52; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // HUD
  ctx.fillStyle = '#12131a'; ctx.fillRect(0, 0, W, 52);
  text('Score ' + score, 14, 34, 22, '#ecedf3', 'left');
  text('Level ' + level, W / 2, 34, 22, '#ffcc33');
  text('♥'.repeat(Math.max(0, lives)), W - 14, 34, 22, '#e8505b', 'right');
  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.color; ctx.globalAlpha = b.hp === 2 ? 1 : 0.88;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, BW, BH, 5); ctx.fill();
    if (b.hp === 2) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // Paddle and ball
  ctx.fillStyle = '#ecedf3'; ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 7); ctx.fill();
  ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

  if (state === 'ready') {
    if (level === 1 && lives === 3 && score === 0) text('Brick Bash', W / 2, H / 2 - 10, 42, '#ffcc33');
    else text('Level ' + level, W / 2, H / 2 - 10, 34, '#ffcc33');
    text('Move with mouse, finger or arrow keys', W / 2, H / 2 + 28, 17, '#c8cad6', 'center', 500);
    text('Click, tap or press Space to launch', W / 2, H / 2 + 54, 17, '#c8cad6', 'center', 500);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(18,19,26,.75)'; ctx.fillRect(0, 52, W, H - 52);
    text('Game over', W / 2, H / 2 - 20, 42, '#ffcc33');
    text('Score ' + score + '   Best ' + best, W / 2, H / 2 + 20, 21, '#ffffff', 'center', 600);
    text('Click, tap or press Space to play again', W / 2, H / 2 + 56, 17, '#c8cad6', 'center', 500);
  }
}

let last = performance.now();
function loop(t) { const dt = Math.min((t - last) / 16.67, 3); last = t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>

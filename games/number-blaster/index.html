<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Number Blaster</title>
<script src="../_kit/kit.js"></script>
</head>
<body>
<script>
// Number Blaster — a MathAdvice original.
// Numbers fall from space. Zap the ones that fit the rule; let the rest fall.
(() => {
  const W = 460, H = 700, GROUND = H - 92, SHIP = [W / 2, H - 50], TOP = 118, PER_WAVE = 10;
  const GOLD = '#ffd34d', GOOD = '#4fd1ff', BAD = '#ff5d73';

  const K = window.K = MA.game({
    slug: 'number-blaster', title: 'Number Blaster', w: W, h: H, accent: GOLD, accent2: '#ff6bd6', bg: ['#070b22', '#170a2e'],
    tagline: 'Numbers are falling from space. Zap the ones that fit the rule.',
    how: [
      'Each wave has a rule, like <b>Multiples of 6</b>.',
      'Tap or click numbers that fit to zap them.',
      'Let the others fall past the shield.',
      'A wrong zap or a missed fit costs a heart.',
      'Zap in a row for a combo bonus.',
    ],
    start, update, draw, idle,
    down(x, y) { if (K.state === 'play') zap(x, y); },
    move(x, y) { if (K.state === 'play') aim = Math.atan2(Math.min(y, SHIP[1] - 20) - SHIP[1], x - SHIP[0]); },
  });
  // Pick up a best score saved before the kit.
  if (!K.best()) { try { const old = +localStorage.getItem('ma-numberblaster-best') || 0; if (old) K.save('best', old); } catch (e) {} }

  const rnd = K.ri, pick = K.pick;
  const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };

  // ---- Rules. Each makes a number that fits (yes) or doesn't (no), plus a short reason for mistakes.
  function makeRule(wave) {
    const pool = ['mult', 'prime', 'square', 'factor', 'equals', 'even'];
    if (wave >= 3) pool.push('frac', 'neg', 'equals', 'prime');
    if (wave >= 5) pool.push('dec', 'frac', 'mult');
    const kind = pick(wave === 1 ? ['mult', 'even', 'equals'] : pool);
    if (kind === 'mult') {
      const k = pick(wave < 4 ? [2, 3, 5, 10] : [3, 4, 6, 7, 8, 9]);
      return { name: `Multiples of ${k}`, make(yes) { if (yes) return { t: String(k * rnd(1, 12)) }; let n; do n = rnd(2, k * 12); while (n % k === 0); return { t: String(n) }; },
        why: t => `${t} ÷ ${k} isn't a whole number` };
    }
    if (kind === 'even') {
      const even = Math.random() < .5;
      return { name: even ? 'Even numbers' : 'Odd numbers', make(yes) { let n; do n = rnd(1, 99); while ((n % 2 === 0) !== (yes === even)); return { t: String(n) }; },
        why: t => `${t} is ${+t % 2 ? 'odd' : 'even'}` };
    }
    if (kind === 'prime') {
      const tricky = [9, 15, 21, 25, 27, 33, 35, 39, 45, 49, 51, 55, 57, 63, 65, 69, 77, 81, 85, 87, 91, 93, 95, 1];
      return { name: 'Prime numbers', make(yes) { let n; if (yes) do n = rnd(2, 97); while (!isPrime(n)); else n = Math.random() < .7 ? pick(tricky) : rnd(2, 49) * 2; return { t: String(n) }; },
        why: t => { const n = +t; if (n === 1) return '1 is not prime'; for (let i = 2; i < n; i++) if (n % i === 0) return `${n} = ${i} × ${n / i}`; return ''; } };
    }
    if (kind === 'square') {
      return { name: 'Perfect squares', make(yes) { if (yes) return { t: String(rnd(1, 15) ** 2) }; let n; do n = rnd(2, 200); while (Number.isInteger(Math.sqrt(n))); return { t: String(n) }; },
        why: t => `${t} isn't a whole number squared` };
    }
    if (kind === 'factor') {
      const N = pick([24, 36, 48, 60, 72, 30, 40]);
      const fs = []; for (let i = 1; i <= N; i++) if (N % i === 0) fs.push(i);
      return { name: `Factors of ${N}`, make(yes) { if (yes) return { t: String(pick(fs)) }; let n; do n = rnd(2, N - 1); while (N % n === 0); return { t: String(n) }; },
        why: t => `${N} ÷ ${t} isn't a whole number` };
    }
    if (kind === 'equals') {
      const T = pick(wave < 3 ? [10, 12, 15, 20] : [18, 24, 30, 36, 42, 48]);
      const expr = v => {
        const opts = [];
        for (let a = 2; a <= 12; a++) if (v % a === 0 && v / a <= 12 && v / a >= 2) opts.push(`${a}×${v / a}`);
        for (let i = 0; i < 3; i++) { const a = rnd(1, v - 1); opts.push(`${a}+${v - a}`); }
        const b = rnd(2, 15); opts.push(`${v + b}−${b}`);
        const d = pick([2, 3, 4]); if (v * d <= 150) opts.push(`${v * d}÷${d}`);
        return pick(opts);
      };
      return { name: `Equal to ${T}`, make(yes) { const v = yes ? T : T + pick([-3, -2, -1, 1, 2, 3, 6, -6]); return { t: expr(v), v }; },
        why: (t, o) => `${t.replace(/([×+−÷])/, ' $1 ')} = ${o.v}` };
    }
    if (kind === 'frac') {
      // fracWhy below gives the explanation
      return { name: 'Bigger than ½', make(yes) { let a, b; do { b = rnd(3, 12); a = rnd(1, b - 1); } while ((a / b > .5) !== yes); return { t: `${a}/${b}`, v: a / b }; },
        why: (t, o) => fracWhy(o) };
    }
    if (kind === 'neg') {
      const L = pick([-3, -5, 0, -1]);
      return { name: `Less than ${String(L).replace('-', '−')}`, make(yes) { let n; do n = rnd(-15, 10); while ((n < L) !== yes); return { t: String(n).replace('-', '−'), v: n }; },
        why: (t, o) => `${t} is ${o.v === L ? 'equal to' : 'greater than'} ${String(L).replace('-', '−')}` };
    }
    // decimals
    return { name: 'Less than 0.5', make(yes) { let n; do n = pick([rnd(1, 99) / 100, rnd(1, 9) / 10, rnd(1, 999) / 1000]); while ((n < .5) !== yes || n === .5); return { t: String(n), v: n }; },
      why: t => `${t} is more than 0.5` };
  }
  function fracWhy(o) { const [a, b] = o.t.split('/').map(Number); return a * 2 === b ? `${o.t} equals ½` : `${o.t} is ${a * 2 < b ? 'less' : 'more'} than ½ because ${a} is ${a * 2 < b ? 'less' : 'more'} than half of ${b}`; }

  // ---- State
  let score = 0, lives = 3, combo = 0, wave = 1, hits = 0, rule = null, banner = 0, clearT = 0, lastWhy = '';
  let rocks = [], lasers = [], notes = [], spawnT = 0, aim = -Math.PI / 2, shieldHit = 0, recoil = 0;
  const stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + .3, v: 8 + Math.random() * 30 });
  const HUES = ['#6b8cff', '#a66bff', '#2ee6c5', '#ff6bd6', '#ff9f43'];
  const mult = () => Math.min(1 + Math.floor(combo / 3), 5);

  function start() {
    score = 0; lives = 3; combo = 0; wave = 1; hits = 0; rocks = []; lasers = []; notes = []; lastWhy = '';
    rule = makeRule(1); banner = 2.2; spawnT = 1.2; clearT = 0; aim = -Math.PI / 2;
    K.sfx.whoosh();
  }
  function nextWave() {
    wave++; hits = 0;
    for (const r of rocks) K.burst(r.x, r.y, '#8a90b8', 8, 160, 3, false);
    rocks = []; let r; do r = makeRule(wave); while (r.name === rule.name); rule = r; banner = 2.2; spawnT = 1.6;
    if (wave % 3 === 0 && lives < 5) { lives++; K.float(W / 2, H / 2 + 100, '+1 heart', BAD, 22); }
    K.sfx.whoosh();
  }
  function spawn() {
    const yes = Math.random() < .45;
    const o = rule.make(yes);
    const R = o.t.length > 4 ? 36 : 31;
    // try a few spots so new rocks don't land on top of each other
    let x = 0;
    for (let k = 0; k < 8; k++) { x = rnd(R + 6, W - R - 6); if (!rocks.some(q => q.y < TOP + 90 && Math.abs(q.x - x) < q.r + R + 6)) break; }
    const pts = []; for (let i = 0; i < 11; i++) pts.push(.84 + Math.random() * .2);
    rocks.push({ ...o, yes, x, y: TOP + 22, r: R, vy: 42 + wave * 7 + Math.random() * 18, vx: (Math.random() - .5) * 20, rot: Math.random() * 6, vr: (Math.random() - .5) * .8, pts, col: pick(HUES), born: 0 });
  }
  // A mistake explanation shown as a card near the bottom.
  function note(text) { notes = [{ text, t: 0 }]; }
  function lose(why) {
    lives--; combo = 0; lastWhy = why; note('✕ ' + why);
    K.shake(10); K.flash(BAD, .25); K.sfx.bad();
    if (lives <= 0) {
      K.sfx.boom(); K.burst(SHIP[0], SHIP[1], BAD, 40, 320, 5);
      K.gameOver(score, { msg: `You reached wave <b>${wave}</b>.<br><span style="opacity:.8">Last slip: ${lastWhy}</span>`, delay: 900 });
    }
  }

  function zap(px, py) {
    if (banner > 1.4) return;
    let hit = null, bd = 1e9;
    for (const r of rocks) { const d = Math.hypot(r.x - px, r.y - py); if (d < r.r + 14 && d < bd) { bd = d; hit = r; } }
    const tx = hit ? hit.x : px, ty = hit ? hit.y : py;
    aim = Math.atan2(Math.min(ty, SHIP[1] - 20) - SHIP[1], tx - SHIP[0]); recoil = 1;
    lasers.push({ x1: SHIP[0] + Math.cos(aim) * 28, y1: SHIP[1] + Math.sin(aim) * 28, x2: tx, y2: ty, t: .16, col: !hit || hit.yes ? GOOD : BAD });
    if (!hit) { K.sfx.tick(); return; }
    rocks.splice(rocks.indexOf(hit), 1);
    if (hit.yes) {
      combo++; const m = mult(), pts = 10 * m;
      score += pts; hits++;
      K.burst(hit.x, hit.y, GOLD, 18, 260, 4); K.burst(hit.x, hit.y, '#ff9f43', 10, 180, 3, false);
      K.float(K.clamp(hit.x, 60, W - 60), hit.y - 10, '+' + pts + (m > 1 ? ` ×${m}` : ''), GOLD, 22);
      K.sfx.pop(); if (combo % 3 === 0 && m > 1) K.sfx.coin();
      if (hits >= PER_WAVE && !clearT) {
        score += 50 * wave; clearT = .9;
        K.float(W / 2, H / 2, `Wave clear! +${50 * wave}`, '#7ee36b', 28); K.sfx.win();
      }
    } else {
      K.burst(hit.x, hit.y, BAD, 22, 260, 4);
      lose(rule.why(hit.t, hit));
    }
  }

  // ---- Loop
  function idle(dt) {
    for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    for (const l of lasers) l.t -= dt; lasers = lasers.filter(l => l.t > 0);
    for (const n of notes) n.t += dt; notes = notes.filter(n => n.t < 2.6);
  }
  function update(dt) {
    idle(dt);
    shieldHit = Math.max(0, shieldHit - dt); recoil = Math.max(0, recoil - dt * 6);
    if (lives <= 0) return;
    if (clearT) { clearT -= dt; if (clearT <= 0) { clearT = 0; nextWave(); } }
    if (banner > 0) { banner -= dt; if (banner > 1.4) return; }
    spawnT -= dt;
    if (spawnT <= 0 && !clearT) { spawn(); spawnT = Math.max(.55, 1.25 - wave * .07) * (.75 + Math.random() * .5); }
    for (const r of rocks) {
      r.y += r.vy * dt; r.x += r.vx * dt; r.rot += r.vr * dt; r.born += dt;
      if (r.x < r.r) { r.x = r.r; r.vx = Math.abs(r.vx); }
      if (r.x > W - r.r) { r.x = W - r.r; r.vx = -Math.abs(r.vx); }
    }
    const gone = rocks.filter(r => r.y > GROUND);
    rocks = rocks.filter(r => r.y <= GROUND);
    for (const r of gone) {
      if (r.yes && !clearT) { K.burst(r.x, GROUND, BAD, 16, 220, 4); shieldHit = .6; lose(`Missed ${r.t}: it fits the rule`); }
      else K.burst(r.x, GROUND, '#8a90b8', 8, 140, 3, false);
      if (lives <= 0) break;
    }
  }

  // ---- Drawing
  function rock(c, r) {
    const pop = Math.min(1, r.born / .25);
    c.save(); c.translate(r.x, r.y); c.scale(K.back(pop) || .01, K.back(pop) || .01);
    c.save(); c.rotate(r.rot);
    c.beginPath();
    r.pts.forEach((k, i) => { const a = i / r.pts.length * Math.PI * 2, x = Math.cos(a) * r.r * k, y = Math.sin(a) * r.r * k; i ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.closePath();
    const g = c.createRadialGradient(-r.r * .35, -r.r * .4, r.r * .1, 0, 0, r.r * 1.05);
    g.addColorStop(0, K.shade(r.col, .25)); g.addColorStop(.55, K.shade(r.col, -.35)); g.addColorStop(1, K.shade(r.col, -.7));
    c.shadowColor = r.col; c.shadowBlur = 16; c.fillStyle = g; c.fill();
    c.shadowBlur = 0; c.lineWidth = 2; c.strokeStyle = K.alpha(r.col, .9); c.stroke();
    c.fillStyle = 'rgba(0,0,0,.22)';
    c.beginPath(); c.arc(-r.r * .35, r.r * .3, r.r * .17, 0, 7); c.arc(r.r * .42, -r.r * .1, r.r * .12, 0, 7); c.fill();
    c.restore();
    const size = r.t.length > 5 ? 17 : r.t.length > 3 ? 20 : 25;
    K.text(r.t, 0, 1, size, '#fff', { weight: 800, stroke: 4, strokeColor: 'rgba(5,6,20,.7)', c });
    c.restore();
  }
  function heart(c, x, y, on) {
    c.save();
    if (on) { c.shadowColor = BAD; c.shadowBlur = 10; }
    const g = c.createLinearGradient(0, y - 10, 0, y + 6);
    g.addColorStop(0, on ? '#ff9fb0' : '#3a3f5c'); g.addColorStop(1, on ? BAD : '#262a42');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(x, y + 7); c.bezierCurveTo(x - 13, y - 2, x - 7, y - 14, x, y - 7); c.bezierCurveTo(x + 7, y - 14, x + 13, y - 2, x, y + 7); c.fill();
    c.restore();
  }
  function wrapLines(c, t, size, maxW) {
    c.font = K.font(size, 700); const lines = []; let line = '';
    for (const w of t.split(' ')) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
    lines.push(line); return lines;
  }
  function ship(c, t) {
    const [x, y] = SHIP;
    // engine glow
    const fl = 14 + Math.sin(t * 40) * 3;
    const eg = c.createRadialGradient(x, y + 18, 0, x, y + 18, 34);
    eg.addColorStop(0, 'rgba(255,190,90,.55)'); eg.addColorStop(1, 'rgba(255,120,60,0)');
    c.fillStyle = eg; c.beginPath(); c.arc(x, y + 18, 34, 0, 7); c.fill();
    c.save(); c.translate(x, y); c.rotate(aim + Math.PI / 2); c.translate(0, recoil * 4);
    c.fillStyle = '#ffb347'; c.beginPath(); c.moveTo(-6, 10); c.lineTo(0, 10 + fl); c.lineTo(6, 10); c.fill();
    const g = c.createLinearGradient(-18, 0, 18, 0);
    g.addColorStop(0, '#2a59c9'); g.addColorStop(.5, '#8fe3ff'); g.addColorStop(1, '#2a59c9');
    c.shadowColor = GOOD; c.shadowBlur = 18; c.fillStyle = g;
    c.beginPath(); c.moveTo(0, -32); c.lineTo(19, 14); c.lineTo(0, 6); c.lineTo(-19, 14); c.closePath(); c.fill();
    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.stroke();
    c.restore();
    K.orb(c, x, y - 2, 6, GOLD, { glow: 12 });
  }

  function draw(c, t) {
    for (const s of stars) { c.globalAlpha = .35 + s.s / 3; c.fillStyle = '#d6deff'; c.fillRect(s.x, s.y, s.s, s.s); }
    c.globalAlpha = 1;
    // shield line
    c.save();
    const sc = shieldHit > 0 ? BAD : GOOD;
    c.globalAlpha = .35 + .25 * Math.sin(t * 3) + shieldHit;
    c.setLineDash([10, 8]); c.lineDashOffset = -t * 20;
    K.glowLine(c, [[0, GROUND], [W, GROUND]], sc, 2, 12);
    c.restore();
    const sg = c.createLinearGradient(0, GROUND, 0, H);
    sg.addColorStop(0, K.alpha(sc, .1)); sg.addColorStop(1, K.alpha(sc, 0));
    c.fillStyle = sg; c.fillRect(0, GROUND, W, H - GROUND);

    for (const r of rocks) rock(c, r);
    for (const l of lasers) { c.save(); c.globalAlpha = l.t / .16; K.glowLine(c, [[l.x1, l.y1], [l.x2, l.y2]], l.col, 5, 18); c.restore(); }
    ship(c, t);

    // HUD
    if (rule) {
      K.chip(12, 10, 'Score', score, '#fff', { w: 104, h: 50 });
      K.chip(W / 2, 10, 'Wave', wave, GOLD, { w: 80, h: 50, align: 'center' });
      const hw = Math.max(3, lives) * 26 + 20;
      K.panel(c, W - 12 - hw, 10, hw, 50, { r: 12 });
      K.text('LIVES', W - 12 - hw / 2, 24, 10, 'rgba(210,218,245,.65)', { weight: 700 });
      for (let i = 0; i < Math.max(3, lives); i++) heart(c, W - 12 - hw + 23 + i * 26, 42, i < lives);
      // rule bar with wave progress
      K.panel(c, 12, 66, W - 24, 44, { r: 12, glow: 14, glowColor: K.alpha(GOLD, .35), stroke: K.alpha(GOLD, .35) });
      K.text(rule.name, W / 2, 85, 22, GOLD, { weight: 800, glow: 12 });
      const pw = W - 48, prog = Math.min(1, hits / PER_WAVE);
      c.fillStyle = 'rgba(255,255,255,.08)'; K.rr(c, 24, 101, pw, 4, 2); c.fill();
      if (prog > 0) { c.save(); c.shadowColor = '#7ee36b'; c.shadowBlur = 8; c.fillStyle = '#7ee36b'; K.rr(c, 24, 101, Math.max(4, pw * prog), 4, 2); c.fill(); c.restore(); }
      if (combo >= 3) K.text(`Combo ×${mult()}`, 16, H - 26, 16, '#7ee36b', { weight: 800, glow: 10, align: 'left' });
    }
    // mistake card
    for (const n of notes) {
      const a = Math.min(1, n.t * 6, (2.6 - n.t) * 2), lines = wrapLines(c, n.text, 16, W - 80), h = lines.length * 22 + 22, y = GROUND - 30 - h;
      c.save(); c.globalAlpha = a;
      K.panel(c, 24, y, W - 48, h, { r: 14, fill: 'rgba(40,10,24,.85)', stroke: K.alpha(BAD, .6), glow: 16, glowColor: K.alpha(BAD, .5) });
      lines.forEach((l, i) => K.text(l, W / 2, y + 22 + i * 22, 16, '#ffd0d6', { weight: 700 }));
      c.restore();
    }
    // wave banner
    if (K.state === 'play' && banner > 0) {
      const a = Math.min(1, banner * 2, (2.2 - banner) * 5);
      c.save(); c.globalAlpha = a;
      K.panel(c, 24, H / 2 - 86, W - 48, 150, { r: 18, fill: 'rgba(12,14,36,.88)', glow: 30, glowColor: K.alpha(GOLD, .4), stroke: K.alpha(GOLD, .4) });
      K.text(`WAVE ${wave}`, W / 2, H / 2 - 52, 13, GOLD, { weight: 800 });
      K.text('Zap: ' + rule.name, W / 2, H / 2 - 14, 28, '#fff', { weight: 800, glow: 16, glowColor: GOLD });
      K.text('Tap the numbers that fit.', W / 2, H / 2 + 24, 15, '#c9cde0', { weight: 600 });
      K.text('Let the others fall.', W / 2, H / 2 + 44, 15, '#c9cde0', { weight: 600 });
      c.restore();
    }
  }

  // For automated testing.
  window.__nb = { get state() { return K.state; }, get rocks() { return rocks; }, get rule() { return rule; }, get score() { return score; }, get lives() { return lives; }, get wave() { return wave; }, start: K.play, zap, makeRule, skip: () => { banner = 0; } };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gate Rush</title>
<script src="../_kit/kit.js"></script>
</head>
<body>
<script>
// Gate Rush — a MathAdvice original.
// Steer your crowd through math gates, dodge enemy squads, and be bigger than the boss at the end.
(() => {
  const W = 460, H = 700, ROAD_L = 40, ROAD_R = 420, MID = 230, PY = H - 160;
  const GOOD = '#4fd1ff', BAD = '#ff5d73', GOLD = '#ffd34d';

  const K = window.K = MA.game({
    slug: 'gate-rush', title: 'Gate Rush', w: W, h: H, accent: GOLD, accent2: GOOD, bg: ['#0a1630', '#120a2a'],
    tagline: 'Steer your crowd through math gates and be bigger than the boss.',
    how: [
      'Drag or use ← → to steer.',
      'Each gate changes your number: +, −, × or ÷.',
      'Pick the gate that leaves you with more.',
      'Dodge red squads when you can.',
      'Beat the boss by being bigger than its number.',
    ],
    update, draw, idle,
    down(x) { if (K.state === 'play') { dragging = true; targetX = x; } },
    move(x) { if (dragging) targetX = x; },
    up() { dragging = false; },
    key(k) { if (K.state === 'play' && ['ArrowLeft', 'ArrowRight', 'a', 'd', 'A', 'D'].includes(k)) dragging = false; },
    noMenu: true,
  });

  // Level progress (also picks up the old save key from before the kit).
  let saved = K.load('level', 0);
  if (!saved) { try { saved = Math.max(1, +localStorage.getItem('ma-gaterush-level') || 1); } catch (e) { saved = 1; } }
  const saveLevel = v => { saved = Math.max(saved, v); K.save('level', saved); };

  // ---- Gate math
  const rnd = K.ri, pick = K.pick;
  const apply = (op, n) => op.t === '+' ? n + op.v : op.t === '-' ? n - op.v : op.t === 'x' ? n * op.v : Math.floor(n / op.v);
  const label = op => ({ '+': '+', '-': '−', 'x': '×', '/': '÷' })[op.t] + op.v;
  const good = op => op.t === '+' || op.t === 'x';

  // Build a level. Every gate and squad is placed so the best path is known; the boss is a share of it.
  function buildLevel(L) {
    const rows = 5 + Math.min(L, 8);
    let n = 5 + Math.min(L, 5) * 2, sim = n;
    const items = [];
    let y = 520;
    const addMax = 6 + L * 3;
    // Keep numbers small enough for mental math: no multiplying past about 250.
    const mkGood = s => (s >= 6 && s * 2 <= 250 && Math.random() < .45) ? { t: 'x', v: L >= 3 && s * 3 <= 200 && Math.random() < .35 ? 3 : 2 } : { t: '+', v: rnd(4, addMax) };
    const mkBad = s => (L >= 2 && s >= 8 && Math.random() < .4) ? { t: '/', v: L >= 4 && Math.random() < .4 ? 3 : 2 } : { t: '-', v: rnd(2, Math.max(3, Math.min(Math.floor(s * .6), addMax))) };
    for (let i = 0; i < rows; i++) {
      const r = Math.random();
      let a, b;
      if (sim > 180 || (L >= 3 && r >= .8)) {                                          // both bad: pick the lesser loss
        a = { t: '/', v: sim > 180 && Math.random() < .5 ? 3 : 2 }; b = { t: '-', v: Math.max(1, Math.round(sim / 2) + rnd(-5, 5)) };
        if (sim < 8) { a = { t: '-', v: rnd(1, 3) }; b = { t: '-', v: a.v + rnd(1, 3) }; }
      } else if (L === 1 ? r < .6 : r < .35) { a = mkGood(sim); b = mkBad(sim); }      // one good, one bad
      else {                                                                           // both good: which is bigger?
        if (sim <= 120 && Math.random() < .7) { a = { t: 'x', v: 2 }; b = { t: '+', v: Math.max(2, sim + rnd(-6, 6)) }; }
        else { a = { t: '+', v: rnd(5, addMax) }; b = { t: '+', v: a.v + pick([-4, -3, 3, 4, 6]) }; if (b.v < 1) b.v = a.v + 3; }
      }
      if (Math.random() < .5) [a, b] = [b, a];
      items.push({ kind: 'gate', y, ops: [a, b], done: false });
      sim = Math.max(apply(a, sim), apply(b, sim));
      y += 300;
      // Enemy squads between some rows: in one lane (dodge it) or across the road (can't dodge).
      if (i > 0 && i < rows - 1 && Math.random() < .45 + L * .03) {
        const across = Math.random() < .4;
        const size = Math.max(1, Math.round(sim * (across ? .12 + Math.random() * .12 : .3 + Math.random() * .3)));
        items.push({ kind: 'squad', y: y - 150, lane: across ? -1 : rnd(0, 1), n: size, done: false });
        if (across) sim -= size;
      }
    }
    const ratio = Math.min(.88, .55 + L * .045);
    const boss = Math.max(2, Math.floor(sim * ratio));
    items.push({ kind: 'boss', y: y + 80, n: boss, done: false });
    return { items, start: n, best: sim, boss, end: y + 80 };
  }

  // ---- State
  let level = saved, lv = null, crowd = 0, shown = 0, dist = 0, speed = 190, px = MID, targetX = MID, dragging = false;
  let stripe = 0, bossFight = null, hitT = 0;

  function menu() {
    K.state = 'menu';
    const go = L => () => startLevel(L);
    K.menu({
      html: saved > 1 ? `<p class="ma-best">Reached level <b>${saved}</b></p>` : '',
      buttons: saved > 1 ? [{ label: `Continue: level ${saved}`, on: go(saved) }, { label: 'Level 1', ghost: true, on: go(1) }] : [{ label: 'Play', on: go(1) }],
    });
  }
  const ready = () => menu();
  document.fonts ? document.fonts.load('700 16px Lexend').then(ready, ready) : ready();

  function startLevel(L) {
    level = L; lv = buildLevel(L); crowd = shown = lv.start; dist = 0; speed = 185 + Math.min(L, 10) * 6;
    px = targetX = MID; bossFight = null; dragging = false; K.state = 'play';
  }

  function finish(won) {
    K.state = 'over';
    if (won) {
      saveLevel(level + 1);
      const most = Math.max(1, lv.best - lv.boss), stars = crowd / most >= .95 ? 3 : crowd / most >= .7 ? 2 : 1;
      K.burst(MID, PY - 140, GOLD, 50, 340, 5); K.flash(GOLD, .3); K.sfx.win();
      setTimeout(() => K.overlay({
        kicker: `Level ${level}`, title: 'Cleared!',
        html: `<div style="font-size:2.4em;letter-spacing:.15em;color:${GOLD};text-shadow:0 0 .4em rgba(255,211,77,.6)">${'★'.repeat(stars)}<span style="opacity:.2">${'★'.repeat(3 - stars)}</span></div>`
          + `<p class="ma-sub">You had <b>${crowd}</b> left after the boss.<br>The best path ends with <b>${most}</b>.</p>`,
        buttons: [{ label: `Level ${level + 1}`, on: () => startLevel(level + 1) }, { label: 'Menu', ghost: true, on: menu }],
      }), 900);
    } else {
      const reason = bossFight ? `The boss had <b>${lv.boss}</b>. You needed more than that.` : 'Your crowd ran out.';
      K.shake(12); K.sfx.lose();
      setTimeout(() => K.overlay({
        kicker: `Level ${level}`, title: 'Not enough!',
        sub: `${reason}<br>The best path had <b>${lv.best}</b> before the boss.`,
        buttons: [{ label: 'Try again', on: () => startLevel(level) }, { label: 'Menu', ghost: true, on: menu }],
      }), 800);
    }
  }

  function idle(dt) { stripe = (stripe + 60 * dt) % 60; shown += (crowd - shown) * Math.min(1, dt * 10); }

  function update(dt) {
    shown += (crowd - shown) * Math.min(1, dt * 10);
    hitT = Math.max(0, hitT - dt);
    const kx = (K.keys.ArrowLeft || K.keys.a || K.keys.A ? -1 : 0) + (K.keys.ArrowRight || K.keys.d || K.keys.D ? 1 : 0);
    if (kx) targetX += kx * 420 * dt;
    const edge = K.clamp(Math.sqrt(Math.min(crowd, 90)) * 8.2, 34, 70); // keep a big crowd on the road
    targetX = K.clamp(targetX, ROAD_L + edge, ROAD_R - edge);
    px += (targetX - px) * Math.min(1, dt * 12);

    if (bossFight) {
      // Crowd and boss trade units until one runs out.
      bossFight.t += dt;
      if (bossFight.t > .05) {
        bossFight.t = 0;
        const k = Math.min(Math.max(1, Math.ceil(Math.min(crowd, bossFight.n) / 25)), crowd, bossFight.n);
        crowd -= k; bossFight.n -= k;
        K.burst(K.lerp(px, MID, .5) + rnd(-30, 30), PY - 70 + rnd(-10, 10), K.pick([GOOD, BAD]), 4, 160, 3, false);
        if (Math.random() < .5) K.sfx.tick();
        K.shake(2);
        if (bossFight.n <= 0 && crowd > 0) { bossFight.dead = true; finish(true); }
        else if (crowd <= 0) finish(false);
      }
      return;
    }

    dist += speed * dt; stripe = (stripe + speed * dt) % 60;
    const lane = px < MID ? 0 : 1;
    for (const it of lv.items) {
      if (it.done || dist < it.y) continue;
      it.done = true;
      if (it.kind === 'gate') {
        const op = it.ops[lane], before = crowd;
        crowd = Math.max(0, apply(op, crowd));
        it.chosen = lane;
        const ok = crowd >= before, col = ok ? '#7ee36b' : BAD;
        K.float(K.clamp(px, 90, W - 90), PY - 100, `${label(op)} → ${crowd}`, col, 24);
        K.burst(px, PY - 30, good(op) ? GOOD : BAD, 18, 240, 4);
        if (ok) K.sfx.good(); else { K.sfx.bad(); K.shake(6); hitT = .3; }
      } else if (it.kind === 'squad') {
        const sx = it.lane < 0 ? MID : it.lane === 0 ? (ROAD_L + MID) / 2 : (MID + ROAD_R) / 2;
        if (it.lane < 0 || Math.abs(px - sx) < 80) {
          crowd = Math.max(0, crowd - it.n);
          K.float(K.clamp(px, 90, W - 90), PY - 100, `−${it.n} → ${crowd}`, BAD, 24); K.burst(px, PY - 40, BAD, 26, 280, 4);
          K.sfx.boom(); K.shake(9); K.flash(BAD, .2); hitT = .4;
        } else { it.dodged = true; K.float(sx, PY - 60, 'Dodged!', '#7ee36b', 20); K.sfx.whoosh(); }
      } else if (it.kind === 'boss') {
        bossFight = { n: it.n, t: 0 }; K.sfx.boom(); K.shake(8);
      }
      if (crowd <= 0 && !bossFight) return finish(false);
    }
  }

  // ---- Drawing
  const sy = wy => PY - (wy - dist);
  // Glossy little people, pre-rendered once per color so a big crowd stays cheap.
  const sprite = col => {
    const c = document.createElement('canvas'), s = 3, g = c.getContext('2d');
    c.width = c.height = 16 * s; g.scale(s, s);
    const rg = g.createRadialGradient(6, 5, 1, 8, 8, 6.5);
    rg.addColorStop(0, K.shade(col, .7)); rg.addColorStop(.5, col); rg.addColorStop(1, K.shade(col, -.4));
    g.fillStyle = rg; g.beginPath(); g.arc(8, 8, 6, 0, 7); g.fill();
    return c;
  };
  const SPR = { [GOOD]: sprite(GOOD), [BAD]: sprite(BAD) };
  function people(c, cx, cy, n, color, maxShown, t) {
    const m = Math.min(Math.round(n), maxShown), spread = Math.sqrt(m) * 8.2;
    // one soft glow under the whole group
    const rg = c.createRadialGradient(cx, cy, 0, cx, cy, spread + 26);
    rg.addColorStop(0, K.alpha(color, .32)); rg.addColorStop(1, K.alpha(color, 0));
    c.fillStyle = rg; c.beginPath(); c.ellipse(cx, cy, spread + 26, (spread + 26) * .75, 0, 0, 7); c.fill();
    for (let i = 0; i < m; i++) {
      const a = i * 2.39996, d = Math.sqrt(i) * 8.2;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .7 + Math.sin(t * 14 + i * 1.7) * 1.3;
      c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x, y + 6, 5, 2.2, 0, 0, 7); c.fill();
      c.drawImage(SPR[color], x - 8, y - 11, 16, 16);
    }
    return spread;
  }
  function pill(c, t, x, y, color, size = 20) {
    c.font = K.font(size, 800);
    const w = Math.max(46, c.measureText(t).width + 26), h = size + 14;
    K.tile(c, x - w / 2, y - h / 2, w, h, color, { r: h / 2, depth: 3, glow: 16 });
    K.text(t, x, y + 1, size, '#0b0e1c', { weight: 800, c });
  }

  function drawRoad(c, t) {
    // dark glass road with a scrolling grid
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(8,12,30,.55)'); g.addColorStop(1, 'rgba(14,20,46,.82)');
    c.fillStyle = g; c.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
    c.fillStyle = 'rgba(79,209,255,.07)';
    for (let y = -60 + stripe; y < H; y += 30) c.fillRect(ROAD_L, y, ROAD_R - ROAD_L, 1);
    for (let x = ROAD_L + 38; x < ROAD_R; x += 38) c.fillRect(x, 0, 1, H);
    // glowing edges and centre dashes
    K.glowLine(c, [[ROAD_L, -10], [ROAD_L, H + 10]], GOOD, 3, 14);
    K.glowLine(c, [[ROAD_R, -10], [ROAD_R, H + 10]], GOOD, 3, 14);
    c.save(); c.shadowColor = GOLD; c.shadowBlur = 10; c.fillStyle = K.alpha(GOLD, .75);
    for (let y = -60 + stripe; y < H; y += 60) { K.rr(c, MID - 3, y, 6, 28, 3); c.fill(); }
    c.restore();
    // roadside lights
    for (let y = -120 + (stripe * 2) % 120; y < H + 20; y += 120) {
      K.orb(c, ROAD_L / 2, y, 5, GOLD, { glow: 14 }); K.orb(c, W - ROAD_L / 2, y + 60, 5, GOLD, { glow: 14 });
    }
  }

  function drawGate(c, it, y) {
    it.ops.forEach((op, i) => {
      const x0 = i ? MID + 10 : ROAD_L + 12, w = MID - ROAD_L - 22, col = good(op) ? GOOD : BAD;
      const fade = it.done ? (it.chosen === i ? .35 : .15) : 1;
      c.save(); c.globalAlpha = fade;
      // glass panel
      const g = c.createLinearGradient(0, y - 34, 0, y + 26);
      g.addColorStop(0, K.alpha(col, .5)); g.addColorStop(1, K.alpha(col, .18));
      K.rr(c, x0, y - 34, w, 60, 12); c.fillStyle = g; c.fill();
      c.shadowColor = col; c.shadowBlur = 18; c.strokeStyle = K.shade(col, .35); c.lineWidth = 2.5; c.stroke();
      c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,.14)'; K.rr(c, x0 + 4, y - 30, w - 8, 20, 8); c.fill();
      // posts
      for (const xp of [x0, x0 + w]) {
        const pg = c.createLinearGradient(xp - 4, 0, xp + 4, 0);
        pg.addColorStop(0, '#8b93b8'); pg.addColorStop(.5, '#eef1fb'); pg.addColorStop(1, '#6a7196');
        c.fillStyle = pg; K.rr(c, xp - 4, y - 44, 8, 78, 4); c.fill();
        K.orb(c, xp, y - 46, 6, col, { glow: 12 });
      }
      if (!it.done) K.text(label(op), x0 + w / 2, y - 3, 34, '#fff', { weight: 800, glow: 14, glowColor: col, stroke: 4, strokeColor: 'rgba(0,0,0,.35)' });
      c.restore();
    });
  }

  function drawBoss(c, it, y, t) {
    const n = bossFight ? bossFight.n : it.n, dead = bossFight && bossFight.dead;
    if (dead) return;
    const by = y - 130 + Math.sin(t * 3) * 3, r = 52 + (bossFight ? Math.sin(t * 30) * 2 : 0);
    const halo = c.createRadialGradient(MID, by, r * .5, MID, by, r * 2.2);
    halo.addColorStop(0, K.alpha(BAD, .35)); halo.addColorStop(1, K.alpha(BAD, 0));
    c.fillStyle = halo; c.beginPath(); c.arc(MID, by, r * 2.2, 0, 7); c.fill();
    // horns
    c.fillStyle = '#ffb0bb';
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(MID + s * r * .45, by - r * .75); c.lineTo(MID + s * r * .95, by - r * 1.25); c.lineTo(MID + s * r * .8, by - r * .45); c.fill(); }
    K.orb(c, MID, by, r, BAD, { glow: 30 });
    for (const s of [-1, 1]) {
      K.orb(c, MID + s * 20, by - 8, 11, '#ffffff', { glow: 0 });
      c.fillStyle = '#1a0610'; c.beginPath(); c.arc(MID + s * 20 + (px - MID) * .03, by - 6, 5, 0, 7); c.fill();
    }
    c.strokeStyle = '#1a0610'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(MID - 34, by - 28); c.lineTo(MID - 10, by - 18); c.moveTo(MID + 34, by - 28); c.lineTo(MID + 10, by - 18); c.stroke();
    c.beginPath(); c.arc(MID, by + 24, 12, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    pill(c, 'BOSS ' + n, MID, by - r - 30, BAD, 18);
  }

  function draw(c, t) {
    drawRoad(c, t);
    if (lv) for (const it of lv.items) {
      const y = sy(it.y);
      if (y < -140 || y > H + 120) continue;
      if (it.kind === 'gate') drawGate(c, it, y);
      else if (it.kind === 'squad' && !it.done) {
        const x = it.lane < 0 ? MID : it.lane === 0 ? (ROAD_L + MID) / 2 : (MID + ROAD_R) / 2;
        if (it.lane < 0) {
          c.save(); c.fillStyle = K.alpha(BAD, .14); c.fillRect(ROAD_L + 4, y - 36, ROAD_R - ROAD_L - 8, 56);
          c.restore();
          K.glowLine(c, [[ROAD_L + 6, y - 36], [ROAD_R - 6, y - 36]], BAD, 2, 10);
          K.glowLine(c, [[ROAD_L + 6, y + 20], [ROAD_R - 6, y + 20]], BAD, 2, 10);
        }
        people(c, x, y, it.n, BAD, 40, t);
        pill(c, '−' + it.n, x, y - 56, BAD, 18);
      } else if (it.kind === 'boss') drawBoss(c, it, y, t);
    }
    // the player's crowd
    if (lv) {
      const r = people(c, px, PY, crowd, GOOD, 90, t);
      pill(c, String(Math.round(shown)), px, Math.min(H - 44, PY + Math.max(30, r * .7) + 26), hitT > 0 ? BAD : GOOD, 20);
    }
    // HUD
    if (lv) {
      K.chip(12, 12, 'Level', level, '#fff', { w: 80, h: 50 });
      K.chip(W - 12, 12, 'Boss', lv.boss, '#ff8a9a', { w: 92, h: 50, align: 'right' });
      const bx = 104, bw = W - 12 - 92 - 12 - bx;
      K.panel(c, bx, 12, bw, 50, { r: 12 });
      K.text('TO THE BOSS', bx + bw / 2, 26, 10, 'rgba(210,218,245,.65)', { weight: 700 });
      const prog = K.clamp(dist / lv.end, 0, 1);
      c.fillStyle = 'rgba(255,255,255,.08)'; K.rr(c, bx + 14, 38, bw - 28, 10, 5); c.fill();
      c.save(); c.shadowColor = GOLD; c.shadowBlur = 10;
      const pg = c.createLinearGradient(bx + 14, 0, bx + bw - 14, 0); pg.addColorStop(0, GOLD); pg.addColorStop(1, '#ff9f43');
      c.fillStyle = pg; K.rr(c, bx + 14, 38, Math.max(10, (bw - 28) * prog), 10, 5); c.fill(); c.restore();
    } else {
      // menu backdrop: a little demo crowd
      people(c, MID + Math.sin(t * .8) * 90, PY, 24, GOOD, 24, t);
    }
  }

  // For automated testing.
  window.__gr = { get state() { return K.state; }, get lv() { return lv; }, get crowd() { return crowd; }, get dist() { return dist; }, buildLevel, startLevel, steer: x => { targetX = x; }, apply };
})();
</script>
</body>
</html>

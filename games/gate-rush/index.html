<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gate Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1a12; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Gate Rush — a MathAdvice original.
// Steer your crowd through math gates, dodge enemy squads, and be bigger than the boss at the end.
(() => {
  const W = 460, H = 700, ROAD_L = 40, ROAD_R = 420, MID = 230, PY = H - 150;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let scale = 1;
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    scale = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', fit); fit();

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const KEY = 'ma-gaterush-level';
  const getLevel = () => { try { return Math.max(1, +localStorage.getItem(KEY) || 1); } catch (e) { return 1; } };
  const saveLevel = v => { try { localStorage.setItem(KEY, Math.max(v, getLevel())); } catch (e) {} };

  // ---- Gate math
  const apply = (op, n) => op.t === '+' ? n + op.v : op.t === '-' ? n - op.v : op.t === 'x' ? n * op.v : Math.floor(n / op.v);
  const label = op => ({ '+': '+', '-': '−', 'x': '×', '/': '÷' })[op.t] + op.v;
  const good = op => op.t === '+' || op.t === 'x';

  // Build a level. Every gate and squad is placed so the best path is known; the boss is a share of it.
  function buildLevel(L) {
    const rows = 5 + Math.min(L, 8);
    let n = 5 + Math.min(L, 5) * 2, sim = n;
    const items = [];
    let y = 520;
    const addMax = 6 + L * 3;
    // Keep numbers small enough for mental math: no multiplying past about 250.
    const mkGood = s => (s >= 6 && s * 2 <= 250 && Math.random() < .45) ? { t: 'x', v: L >= 3 && s * 3 <= 200 && Math.random() < .35 ? 3 : 2 } : { t: '+', v: rnd(4, addMax) };
    const mkBad = s => (L >= 2 && s >= 8 && Math.random() < .4) ? { t: '/', v: L >= 4 && Math.random() < .4 ? 3 : 2 } : { t: '-', v: rnd(2, Math.max(3, Math.min(Math.floor(s * .6), addMax))) };
    for (let i = 0; i < rows; i++) {
      const r = Math.random();
      let a, b;
      if (sim > 180 || (L >= 3 && r >= .8)) {                                          // both bad: pick the lesser loss
        a = { t: '/', v: sim > 180 && Math.random() < .5 ? 3 : 2 }; b = { t: '-', v: Math.max(1, Math.round(sim / 2) + rnd(-5, 5)) };
        if (sim < 8) { a = { t: '-', v: rnd(1, 3) }; b = { t: '-', v: a.v + rnd(1, 3) }; }
      } else if (L === 1 ? r < .6 : r < .35) { a = mkGood(sim); b = mkBad(sim); }      // one good, one bad
      else {                                                                           // both good: which is bigger?
        if (sim <= 120 && Math.random() < .7) { a = { t: 'x', v: 2 }; b = { t: '+', v: Math.max(2, sim + rnd(-6, 6)) }; }
        else { a = { t: '+', v: rnd(5, addMax) }; b = { t: '+', v: a.v + pick([-4, -3, 3, 4, 6]) }; if (b.v < 1) b.v = a.v + 3; }
      }
      if (Math.random() < .5) [a, b] = [b, a];
      items.push({ kind: 'gate', y, ops: [a, b], done: false });
      sim = Math.max(apply(a, sim), apply(b, sim));
      y += 300;
      // Enemy squads between some rows: in one lane (dodge it) or across the road (can't dodge).
      if (i > 0 && i < rows - 1 && Math.random() < .45 + L * .03) {
        const across = Math.random() < .4;
        const size = Math.max(1, Math.round(sim * (across ? .12 + Math.random() * .12 : .3 + Math.random() * .3)));
        items.push({ kind: 'squad', y: y - 150, lane: across ? -1 : rnd(0, 1), n: size, done: false });
        if (across) sim -= size;
      }
    }
    const ratio = Math.min(.88, .55 + L * .045);
    const boss = Math.max(2, Math.floor(sim * ratio));
    items.push({ kind: 'boss', y: y + 80, n: boss, done: false });
    return { items, start: n, best: sim, boss, end: y + 80 };
  }

  // ---- State
  let state = 'title', level = getLevel(), lv = null, crowd = 0, dist = 0, speed = 190, px = MID, targetX = MID, keys = {};
  let parts = [], toasts = [], shake = 0, stripe = 0, last = 0, endT = 0, bossFight = null, result = null;
  const dots = [];

  function startLevel(L) {
    level = L; lv = buildLevel(L); crowd = lv.start; dist = 0; speed = 185 + Math.min(L, 10) * 6;
    px = targetX = MID; parts = []; toasts = []; bossFight = null; result = null; state = 'play';
  }
  function burst(x, y, c, n = 16) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 200; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, c }); } }
  function toast(text, x, y, color, size = 22) { toasts.push({ text, x, y, color, size, t: 0 }); }

  // ---- Input: drag anywhere to steer, or use the arrow keys / A and D.
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  let dragging = false;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); const [x, y] = pt(e);
    if (state === 'title') {
      if (level > 1 && y > 522 && y < 572) startLevel(1);
      else if (y > 440) startLevel(level);
      return;
    }
    if (state === 'won' || state === 'lost') { if (y > 440) startLevel(state === 'won' ? level + 1 : level); return; }
    dragging = true; targetX = x;
  });
  cv.addEventListener('pointermove', e => { if (dragging) targetX = pt(e)[0]; });
  addEventListener('pointerup', () => dragging = false);
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'title') startLevel(level);
      else if (state === 'won') startLevel(level + 1);
      else if (state === 'lost') startLevel(level);
    }
  });
  addEventListener('keyup', e => keys[e.code] = false);

  function update(dt) {
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const t of toasts) t.t += dt; toasts = toasts.filter(t => t.t < 1.2);
    shake = Math.max(0, shake - dt);
    if (state !== 'play') return;

    const kx = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0);
    if (kx) { targetX += kx * 420 * dt; dragging = false; }
    targetX = Math.max(ROAD_L + 30, Math.min(ROAD_R - 30, targetX));
    px += (targetX - px) * Math.min(1, dt * 12);

    if (bossFight) {
      // Crowd and boss trade units until one runs out.
      bossFight.t += dt;
      const step = Math.max(1, Math.ceil(Math.min(crowd, bossFight.n) / 25));
      if (bossFight.t > .05) {
        bossFight.t = 0;
        const k = Math.min(step, crowd, bossFight.n);
        crowd -= k; bossFight.n -= k; burst(px + rnd(-20, 20), PY - 70, '#ff6b6b', 3);
        if (bossFight.n <= 0 && crowd > 0) { state = 'won'; saveLevel(level + 1); result = { left: crowd }; burst(W / 2, PY - 120, '#ffcc33', 50); }
        else if (crowd <= 0) { state = 'lost'; result = { reason: `The boss had ${lv.boss}. You needed more than that.` }; shake = .5; }
      }
      return;
    }

    dist += speed * dt; stripe = (stripe + speed * dt) % 60;
    const lane = px < MID ? 0 : 1;
    for (const it of lv.items) {
      if (it.done || dist < it.y) continue;
      it.done = true;
      if (it.kind === 'gate') {
        const op = it.ops[lane], before = crowd;
        crowd = Math.max(0, apply(op, crowd));
        it.chosen = lane;
        toast(`${label(op)} → ${crowd}`, px, PY - 90, good(op) ? '#7dffb0' : '#ff8a8a');
        burst(px, PY - 30, good(op) ? '#7dffb0' : '#ff8a8a', 14);
        if (crowd < before) shake = .2;
      } else if (it.kind === 'squad') {
        const sx = it.lane < 0 ? MID : it.lane === 0 ? (ROAD_L + MID) / 2 : (MID + ROAD_R) / 2;
        if (it.lane < 0 || Math.abs(px - sx) < 80) {
          crowd = Math.max(0, crowd - it.n); toast(`−${it.n} → ${crowd}`, px, PY - 90, '#ff8a8a'); burst(px, PY - 40, '#ff6b6b', 22); shake = .3;
        } else toast('Dodged!', sx, PY - 60, '#7dffb0', 18);
      } else if (it.kind === 'boss') {
        bossFight = { n: it.n, t: 0 };
      }
      if (crowd <= 0 && state === 'play' && !bossFight) { state = 'lost'; result = { reason: 'Your crowd ran out.' }; shake = .5; }
    }
  }

  // ---- Drawing
  function text(t, x, y, size, color, weight = 800, align = 'center') { ctx.font = `${weight} ${size}px system-ui, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const sy = wy => PY - (wy - dist);
  function people(cx, cy, n, color, maxShown = 90) {
    const m = Math.min(n, maxShown), R = 5.5;
    for (let i = 0; i < m; i++) {
      const a = i * 2.39996, d = Math.sqrt(i) * 8.2;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .7;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + 6, R, 2.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y - 3, R, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x - 1.5, y - 5, 1.8, 0, 7); ctx.fill();
    }
    return Math.sqrt(m) * 8.2;
  }
  function badge(t, x, y, bg) {
    ctx.font = '800 20px system-ui, sans-serif'; const w = Math.max(44, ctx.measureText(t).width + 22);
    ctx.fillStyle = bg; rr(x - w / 2, y - 16, w, 32, 16); ctx.fill(); text(t, x, y + 1, 20, '#fff');
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 16 * shake, (Math.random() - .5) * 16 * shake);
    // grass + road
    ctx.fillStyle = '#3f8f4a'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#367d40'; for (let y = -60 + (stripe * 2 % 120); y < H; y += 120) { ctx.fillRect(0, y, ROAD_L, 60); ctx.fillRect(ROAD_R, y + 60, W - ROAD_R, 60); }
    ctx.fillStyle = '#4b5068'; ctx.fillRect(ROAD_L, -20, ROAD_R - ROAD_L, H + 40);
    ctx.fillStyle = '#e6e8f0'; ctx.fillRect(ROAD_L, -20, 6, H + 40); ctx.fillRect(ROAD_R - 6, -20, 6, H + 40);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let y = -60 + stripe; y < H; y += 60) ctx.fillRect(MID - 3, y, 6, 30);

    if (lv) for (const it of lv.items) {
      const y = sy(it.y);
      if (y < -120 || y > H + 80) continue;
      if (it.kind === 'gate') {
        it.ops.forEach((op, i) => {
          const x0 = i ? MID + 8 : ROAD_L + 12, w = MID - ROAD_L - 20;
          const alpha = it.done ? (it.chosen === i ? .25 : .12) : .82;
          ctx.fillStyle = good(op) ? `rgba(47,111,214,${alpha})` : `rgba(220,60,70,${alpha})`;
          rr(x0, y - 34, w, 58, 10); ctx.fill();
          ctx.strokeStyle = good(op) ? '#9cc0ff' : '#ffb0b6'; ctx.lineWidth = 3; ctx.globalAlpha = it.done ? .3 : 1; ctx.stroke(); ctx.globalAlpha = 1;
          ctx.fillStyle = '#cfd6ea'; ctx.fillRect(x0 - 4, y - 44, 8, 74); ctx.fillRect(x0 + w - 4, y - 44, 8, 74);
          if (!it.done) text(label(op), x0 + w / 2, y - 4, 34, '#fff');
        });
      } else if (it.kind === 'squad' && !it.done) {
        const x = it.lane < 0 ? MID : it.lane === 0 ? (ROAD_L + MID) / 2 : (MID + ROAD_R) / 2;
        if (it.lane < 0) { ctx.fillStyle = 'rgba(220,60,70,.18)'; ctx.fillRect(ROAD_L + 6, y - 40, ROAD_R - ROAD_L - 12, 60); }
        people(x, y, it.n, '#e8505b', 40); badge(String(it.n), x, y - 52, '#c0303d');
      } else if (it.kind === 'boss') {
        const n = bossFight ? bossFight.n : it.n;
        ctx.fillStyle = '#7a1f2a'; rr(MID - 90, y - 140, 180, 120, 16); ctx.fill();
        ctx.fillStyle = '#e8505b'; rr(MID - 80, y - 130, 160, 100, 12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(MID - 32, y - 92, 14, 0, 7); ctx.arc(MID + 32, y - 92, 14, 0, 7); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(MID - 28, y - 89, 6, 0, 7); ctx.arc(MID + 36, y - 89, 6, 0, 7); ctx.fill();
        ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(MID - 52, y - 112); ctx.lineTo(MID - 18, y - 102); ctx.moveTo(MID + 52, y - 112); ctx.lineTo(MID + 18, y - 102); ctx.stroke();
        badge('BOSS ' + n, MID, y - 52, '#2b0d12');
      }
    }
    // the player's crowd
    if (state !== 'title') {
      const r = people(px, PY, crowd, '#3d8bff');
      badge(String(crowd), px, PY - Math.max(30, r * .7) - 26, '#1d4fb8');
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / .6); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of toasts) { ctx.globalAlpha = Math.max(0, 1 - t.t / 1.2); text(t.text, t.x, t.y - t.t * 40, t.size, t.color); }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD
    if (state !== 'title' && lv) {
      ctx.fillStyle = 'rgba(15,20,35,.75)'; rr(10, 10, W - 20, 44, 12); ctx.fill();
      text('Level ' + level, 26, 32, 18, '#fff', 800, 'left');
      const prog = Math.min(1, dist / lv.end);
      ctx.fillStyle = '#2a3048'; rr(130, 26, 200, 12, 6); ctx.fill(); ctx.fillStyle = '#ffcc33'; rr(130, 26, Math.max(12, 200 * prog), 12, 6); ctx.fill();
      text('Boss ' + lv.boss, W - 26, 32, 18, '#ff9aa2', 800, 'right');
    }
    if (state === 'title' || state === 'won' || state === 'lost') {
      ctx.fillStyle = 'rgba(12,18,30,.86)'; ctx.fillRect(0, 0, W, H);
      if (state === 'title') {
        text('Gate Rush', W / 2, 170, 48, '#ffcc33');
        const lines = ['Drag or use ← → to steer your crowd.', 'Each gate changes your number: +, −, ×, or ÷.', 'Pick the gate that leaves you with more.', 'Dodge red squads when you can.', 'Beat the boss by being bigger than its number.'];
        lines.forEach((l, i) => text(l, W / 2, 240 + i * 32, 17, '#d5daea', 600));
        button(level > 1 ? `Continue: level ${level}` : 'Start', W / 2, 470, 260);
        if (level > 1) { text('Start over at level 1', W / 2 - 0, 546, 15, '#8f9bb8', 700); }
      } else if (state === 'won') {
        const ratio = result.left / Math.max(1, lv.best - lv.boss);
        const stars = ratio >= .95 ? 3 : ratio >= .7 ? 2 : 1;
        text(`Level ${level} cleared!`, W / 2, 170, 38, '#ffcc33');
        text('★'.repeat(stars) + '☆'.repeat(3 - stars), W / 2, 235, 44, '#ffcc33');
        text(`You had ${result.left} left after the boss.`, W / 2, 300, 18, '#e6e9f5', 700);
        text(`The best possible path ends with ${lv.best - lv.boss}.`, W / 2, 332, 16, '#9aa4c0', 600);
        button(`Level ${level + 1}`, W / 2, 470, 220);
      } else {
        text('Not enough!', W / 2, 190, 42, '#ff8a8a');
        text(result.reason, W / 2, 260, 17, '#e6e9f5', 600);
        text(`The best path had ${lv.best} before the boss.`, W / 2, 295, 16, '#9aa4c0', 600);
        button('Try again', W / 2, 470, 220);
      }
    }
  }
  function button(t, x, y, w) { ctx.fillStyle = '#ffcc33'; rr(x - w / 2, y - 29, w, 58, 14); ctx.fill(); text(t, x, y + 1, 22, '#111'); }

  function frame(t) { const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; update(dt); draw(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  // For automated testing.
  window.__gr = { get state() { return state; }, get lv() { return lv; }, get crowd() { return crowd; }, get dist() { return dist; }, buildLevel, startLevel, steer: x => { targetX = x; }, apply };
})();
</script>
</body>
</html>

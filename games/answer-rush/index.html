<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Answer Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Answer Rush — a MathAdvice original.
const W = 640, H = 480, HUD = 96;
const c = document.getElementById('c'), ctx = c.getContext('2d');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H); const d = devicePixelRatio || 1;
  c.style.width = W * scale + 'px'; c.style.height = H * scale + 'px';
  c.width = W * scale * d; c.height = H * scale * d;
  ctx.setTransform(scale * d, 0, 0, scale * d, 0, 0);
}
addEventListener('resize', fit); fit();

const KEY = 'ma-answerrush-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const ROUND = 45;
let state = 'ready', bubbles = [], pops = [], score = 0, right = 0, wrong = 0, timeLeft = ROUND,
    best = getBest(), overAt = 0, problem = null, spawnIn = 0, flash = 0;

function newProblem() {
  const lvl = Math.min(3, Math.floor(right / 5));
  const ops = ['+', '−', '×', '÷'].slice(0, 2 + Math.min(2, lvl));
  const op = ops[rnd(0, ops.length - 1)];
  let a, b, ans;
  if (op === '+') { a = rnd(2, 10 + lvl * 10); b = rnd(2, 10 + lvl * 10); ans = a + b; }
  if (op === '−') { a = rnd(5, 15 + lvl * 10); b = rnd(1, a - 1); ans = a - b; }
  if (op === '×') { a = rnd(2, 6 + lvl * 2); b = rnd(2, 10); ans = a * b; }
  if (op === '÷') { b = rnd(2, 9); ans = rnd(2, 10); a = b * ans; }
  problem = { text: `${a} ${op} ${b} = ?`, ans };
  // Clear the board and fill it with a mix of right and wrong answers.
  bubbles = [];
  for (let i = 0; i < 5; i++) spawn(i < 2);
}
function wrongAnswer(ans) {
  let v;
  do { v = ans + rnd(-Math.max(3, Math.ceil(ans * 0.25)), Math.max(3, Math.ceil(ans * 0.25))); } while (v === ans || v < 0);
  return v;
}
function spawn(correct) {
  const r = 34;
  let x, y, tries = 0;
  do {
    x = r + 10 + Math.random() * (W - 2 * r - 20);
    y = HUD + r + 10 + Math.random() * (H - HUD - 2 * r - 20);
    tries++;
  } while (tries < 30 && bubbles.some(b => Math.hypot(b.x - x, b.y - y) < r * 2.3));
  const life = Math.max(2.2, 4 - right * 0.06);
  bubbles.push({ x, y, r, value: correct ? problem.ans : wrongAnswer(problem.ans), correct, age: 0, life });
}

function start() {
  state = 'play'; score = 0; right = 0; wrong = 0; timeLeft = ROUND; pops = []; spawnIn = 0.8;
  newProblem();
}

c.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = c.getBoundingClientRect();
  const x = (e.clientX - rect.left) / scale, y = (e.clientY - rect.top) / scale;
  if (state !== 'play') { if (state === 'ready' || performance.now() - overAt > 600) start(); return; }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(x - b.x, y - b.y) <= b.r) {
      if (b.correct) {
        right++; score += 10 + Math.max(0, Math.round((b.life - b.age) * 2));
        pops.push({ x: b.x, y: b.y, text: '✓', age: 0, good: true });
        newProblem();
      } else {
        wrong++; timeLeft = Math.max(0, timeLeft - 3); flash = 0.3;
        pops.push({ x: b.x, y: b.y, text: '−3s', age: 0 });
        bubbles.splice(i, 1);
      }
      return;
    }
  }
});
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') { e.preventDefault(); start(); } });

function update(dt) {
  pops.forEach(p => p.age += dt); pops = pops.filter(p => p.age < 0.7);
  flash = Math.max(0, flash - dt);
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; overAt = performance.now();
    if (score > best) { best = score; setBest(best); }
    return;
  }
  bubbles.forEach(b => b.age += dt);
  bubbles = bubbles.filter(b => b.age < b.life);
  // Always keep at least one right answer on the board.
  if (!bubbles.some(b => b.correct)) spawn(true);
  spawnIn -= dt;
  if (spawnIn <= 0 && bubbles.length < 7) { spawn(Math.random() < 0.3); spawnIn = 0.7; }
}

function drawBubble(b) {
  const fade = Math.min(1, (b.life - b.age) / 0.5);
  const grow = Math.min(1, b.age / 0.15);
  ctx.globalAlpha = fade;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2f6fd6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * grow, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b2d3a'; ctx.font = `800 ${b.value >= 100 ? 22 : 26}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(b.value, b.x, b.y + 9);
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = '#f7f5ee'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#d6e4f0'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, HUD); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = HUD; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,107,107,${flash})`; ctx.fillRect(0, HUD, W, H - HUD); }
  bubbles.forEach(drawBubble);
  pops.forEach(p => {
    ctx.globalAlpha = 1 - p.age / 0.7; ctx.fillStyle = p.good ? '#2ea36f' : '#e8505b';
    ctx.font = '800 28px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y - p.age * 50);
    ctx.globalAlpha = 1;
  });
  // HUD with the current problem
  ctx.fillStyle = '#1c1e29'; ctx.fillRect(0, 0, W, HUD);
  ctx.font = '700 18px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#9a9db0';
  ctx.fillText('Score ' + score, 16, 28);
  ctx.textAlign = 'right'; ctx.fillStyle = timeLeft < 8 && state === 'play' ? '#ff6b6b' : '#9a9db0';
  ctx.fillText(Math.ceil(timeLeft) + 's', W - 16, 28);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffcc33'; ctx.font = '800 38px system-ui, sans-serif';
  ctx.fillText(state === 'play' ? problem.text : 'Answer Rush', W / 2, 74);

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(18,19,26,.75)'; ctx.fillRect(0, HUD, W, H - HUD);
    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.fillStyle = '#fff'; ctx.font = '600 21px system-ui, sans-serif';
      ctx.fillText('Pop the bubble with the right answer.', W / 2, H / 2 + 10);
      ctx.fillText('Faster answers score more. Wrong ones cost 3 seconds.', W / 2, H / 2 + 42);
      ctx.fillStyle = '#c8cad6'; ctx.font = '500 17px system-ui, sans-serif';
      ctx.fillText('Click or tap to start', W / 2, H / 2 + 82);
    } else {
      ctx.fillStyle = '#ffcc33'; ctx.font = '800 40px system-ui, sans-serif'; ctx.fillText("Time's up!", W / 2, H / 2 + 4);
      ctx.fillStyle = '#fff'; ctx.font = '600 20px system-ui, sans-serif';
      ctx.fillText(`Score ${score}  ·  ${right} right, ${wrong} wrong  ·  Best ${best}`, W / 2, H / 2 + 42);
      ctx.fillStyle = '#c8cad6'; ctx.font = '500 17px system-ui, sans-serif'; ctx.fillText('Click or tap to play again', W / 2, H / 2 + 76);
    }
  }
}

let last = performance.now();
function loop(t) { const dt = Math.min((t - last) / 1000, 0.05); last = t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>

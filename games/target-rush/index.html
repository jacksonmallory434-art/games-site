<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Target Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Target Rush — a MathAdvice original.
const W = 640, H = 480;
const c = document.getElementById('c'), ctx = c.getContext('2d');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H); const d = devicePixelRatio || 1;
  c.style.width = W * scale + 'px'; c.style.height = H * scale + 'px';
  c.width = W * scale * d; c.height = H * scale * d;
  ctx.setTransform(scale * d, 0, 0, scale * d, 0, 0);
}
addEventListener('resize', fit); fit();

const KEY = 'ma-targetrush-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };

const ROUND = 30;
let state = 'ready', targets = [], pops = [], score = 0, hits = 0, shots = 0, timeLeft = ROUND, spawnIn = 0, best = getBest(), overAt = 0;

function start() {
  state = 'play'; targets = []; pops = []; score = 0; hits = 0; shots = 0; timeLeft = ROUND; spawnIn = 0;
}
function spawn() {
  const elapsed = ROUND - timeLeft;
  const life = Math.max(0.9, 1.9 - elapsed * 0.035); // targets fade faster as time goes on
  const r = 34 - Math.min(14, elapsed * 0.5);
  targets.push({ x: r + 10 + Math.random() * (W - 2 * r - 20), y: 70 + r + Math.random() * (H - 2 * r - 90), r, life, age: 0 });
}

c.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = c.getBoundingClientRect();
  const x = (e.clientX - rect.left) / scale, y = (e.clientY - rect.top) / scale;
  if (state !== 'play') { if (state === 'ready' || performance.now() - overAt > 600) start(); return; }
  shots++;
  for (let i = targets.length - 1; i >= 0; i--) {
    const t = targets[i], rr = t.r * (1 - t.age / t.life * 0.5);
    const d = Math.hypot(x - t.x, y - t.y);
    if (d <= rr) {
      // Closer to the center scores more.
      const pts = d < rr * 0.33 ? 3 : d < rr * 0.66 ? 2 : 1;
      score += pts; hits++;
      pops.push({ x: t.x, y: t.y, text: '+' + pts, age: 0 });
      targets.splice(i, 1);
      return;
    }
  }
  pops.push({ x, y, text: 'miss', age: 0, miss: true });
});
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') { e.preventDefault(); start(); } });

function update(dt) {
  pops.forEach(p => p.age += dt); pops = pops.filter(p => p.age < 0.6);
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; overAt = performance.now();
    if (score > best) { best = score; setBest(best); }
    return;
  }
  spawnIn -= dt;
  if (spawnIn <= 0) { spawn(); spawnIn = Math.max(0.35, 0.8 - (ROUND - timeLeft) * 0.015); }
  targets.forEach(t => t.age += dt);
  targets = targets.filter(t => t.age < t.life);
}

function drawTarget(t) {
  const rr = t.r * (1 - t.age / t.life * 0.5);
  const rings = ['#e8505b', '#ffffff', '#e8505b', '#ffffff', '#e8505b'];
  rings.forEach((col, i) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(t.x, t.y, rr * (1 - i / rings.length), 0, Math.PI * 2); ctx.fill();
  });
}
function draw() {
  ctx.fillStyle = '#f7f5ee'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#d6e4f0'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  targets.forEach(drawTarget);
  pops.forEach(p => {
    ctx.globalAlpha = 1 - p.age / 0.6; ctx.fillStyle = p.miss ? '#9a9db0' : '#2f6fd6';
    ctx.font = '800 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y - p.age * 40);
    ctx.globalAlpha = 1;
  });
  // HUD
  ctx.fillStyle = '#1c1e29'; ctx.fillRect(0, 0, W, 52);
  ctx.font = '800 24px system-ui, sans-serif'; ctx.fillStyle = '#ecedf3';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + score, 16, 35);
  ctx.textAlign = 'center'; ctx.fillStyle = timeLeft < 5 && state === 'play' ? '#ff6b6b' : '#ffcc33'; ctx.fillText(Math.ceil(timeLeft) + 's', W / 2, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9a9db0'; ctx.fillText('Best ' + best, W - 16, 35);

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(18,19,26,.72)'; ctx.fillRect(0, 52, W, H - 52);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffcc33'; ctx.font = '800 44px system-ui, sans-serif';
    ctx.fillText(state === 'ready' ? 'Target Rush' : 'Time!', W / 2, H / 2 - 30);
    ctx.fillStyle = '#fff'; ctx.font = '600 20px system-ui, sans-serif';
    if (state === 'ready') ctx.fillText('Hit as many targets as you can in 30 seconds.', W / 2, H / 2 + 10);
    else ctx.fillText(`Score ${score}  ·  Accuracy ${shots ? Math.round(hits / shots * 100) : 0}%  ·  Best ${best}`, W / 2, H / 2 + 10);
    ctx.fillStyle = '#c8cad6'; ctx.font = '500 17px system-ui, sans-serif';
    ctx.fillText(state === 'ready' ? 'Bullseyes are worth 3. Click or tap to start.' : 'Click or tap to play again', W / 2, H / 2 + 44);
  }
}

let last = performance.now();
function loop(t) { const dt = Math.min((t - last) / 1000, 0.05); last = t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>

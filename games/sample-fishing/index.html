<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Fishing</title>
<script src="../_kit/kit.js"></script>
</head>
<body>
<script>
(() => {
  const PX = 400, PY = 268, RX = 350, RY = 178, NET = 58, PONDS = 5, CASTS = 5;
  const KINDS = [
    { name: 'gold', color: '#ffd34d' },
    { name: 'blue', color: '#4fd1ff' },
    { name: 'pink', color: '#ff6bd6' },
  ];
  let pond, fish, casts, tally, nets, phase, guess, ask, total, results, dragging;
  const slider = { x: 160, y: 530, w: 380 };
  const lockBtn = { x: 570, y: 498, w: 170, h: 48, label: 'Lock it in', size: 18, color: '#ffd34d' };
  const nextBtn = { x: 570, y: 498, w: 170, h: 48, label: 'Next pond', size: 18, color: '#4fd1ff' };

  const K = window.K = MA.game({
    slug: 'sample-fishing', title: 'Sample Fishing', accent: '#4fd1ff', accent2: '#2ee6c5', bg: ['#061826', '#0b1030'],
    tagline: 'You can\'t count every fish in a murky pond. Net a sample and estimate the whole thing.',
    how: [
      'Tap the pond to cast a net. The fish you catch show their colors, then swim off.',
      'You get 5 casts per pond. Fish of the same color like to stick together, so spread your casts out!',
      'Then estimate what <b>percent</b> of the whole pond is one color.',
      'The closer your estimate, the more points. 5 ponds per game.',
    ],
    start, update, draw,
    down(x, y) {
      if (K.state !== 'play') return;
      if (phase === 'cast' && inPond(x, y)) return cast(x, y);
      if (phase === 'guess') {
        if (K.hit(lockBtn, x, y)) return lock();
        if (Math.abs(y - slider.y) < 30 && x > slider.x - 20 && x < slider.x + slider.w + 20) { dragging = true; setGuess(x); }
      }
      if (phase === 'reveal' && K.hit(nextBtn, x, y)) nextPond();
    },
    move(x) { if (dragging) setGuess(x); },
    up() { dragging = false; },
    key(k) {
      if (K.state !== 'play') return;
      if (phase === 'guess') {
        if (k === 'ArrowLeft') guess = Math.max(0, guess - 1);
        if (k === 'ArrowRight') guess = Math.min(100, guess + 1);
        if (k === 'Enter' || k === ' ') lock();
      } else if (phase === 'reveal' && (k === 'Enter' || k === ' ')) nextPond();
    },
  });

  const inPond = (x, y) => ((x - PX) / RX) ** 2 + ((y - PY) / RY) ** 2 < 1;
  function setGuess(x) { const g = Math.round(K.clamp((x - slider.x) / slider.w, 0, 1) * 100); if (g !== guess) K.sfx.tick(); guess = g; }

  function start() { pond = 0; results = []; nextPond(); }

  function nextPond() {
    pond++;
    if (pond > PONDS) {
      const score = results.reduce((a, r) => a + r.pts, 0);
      return K.gameOver(score, { msg: results.map((r, i) => `Pond ${i + 1}: guessed ${r.g}%, really ${r.a}%`).join('<br>') });
    }
    // random mix, with clustered schools
    total = K.ri(120, 180);
    const share = [K.rand(0.08, 0.45), K.rand(0.15, 0.5), 0];
    share[2] = Math.max(0.1, 1 - share[0] - share[1]);
    const sum = share.reduce((a, b) => a + b, 0);
    const counts = share.map(s => Math.round(s / sum * total));
    total = counts.reduce((a, b) => a + b, 0);
    fish = [];
    const spread = pond === 1 ? 0.9 : Math.max(0.35, 0.8 - pond * 0.1);
    counts.forEach((n, k) => {
      const homes = Array.from({ length: K.ri(1, 2) }, () => randomSpot(0.6));
      for (let i = 0; i < n; i++) {
        const h = K.pick(homes), [x, y] = randomSpot(1, h, spread);
        fish.push({ k, x, y, hx: h[0], hy: h[1], a: Math.random() * 7, sp: K.rand(18, 34), show: 0, seen: false, wig: Math.random() * 6, spread });
      }
    });
    ask = K.ri(0, 2);
    casts = CASTS; tally = [0, 0, 0]; nets = []; phase = 'cast'; guess = 50;
  }
  function randomSpot(scale = 1, around, spread = 1) {
    for (let i = 0; i < 200; i++) {
      let x, y;
      if (around) { x = around[0] + K.rand(-1, 1) * RX * spread; y = around[1] + K.rand(-1, 1) * RY * spread; }
      else { x = PX + K.rand(-1, 1) * RX * scale; y = PY + K.rand(-1, 1) * RY * scale; }
      if (((x - PX) / (RX - 20)) ** 2 + ((y - PY) / (RY - 16)) ** 2 < 1) return [x, y];
    }
    return [PX, PY];
  }

  function cast(x, y) {
    if (casts <= 0) return;
    casts--;
    nets.push({ x, y, t: 0 });
    let got = [0, 0, 0];
    for (const f of fish) if (Math.hypot(f.x - x, (f.y - y) * 1.15) < NET) { got[f.k]++; f.show = 1.8; }
    got.forEach((n, k) => tally[k] += n);
    K.sfx.whoosh();
    setTimeout(() => {
      K.sfx.note(500 + got.reduce((a, b) => a + b, 0) * 20, 0.15);
      K.burst(x, y, '#bfefff', 16, 180, 3);
      const parts = got.map((n, k) => n ? `${n} ${KINDS[k].name}` : '').filter(Boolean);
      K.float(x, y - NET - 10, parts.length ? parts.join(' · ') : 'nothing!', '#fff', 16);
      if (!casts) setTimeout(() => { if (K.state === 'play') phase = 'guess'; }, 900);
    }, 250);
  }

  function lock() {
    const actual = Math.round(fish.filter(f => f.k === ask).length / total * 100);
    const err = Math.abs(guess - actual);
    const pts = Math.max(0, 100 - err * 5);
    results.push({ g: guess, a: actual, pts });
    phase = 'reveal';
    fish.forEach(f => f.show = 99);
    K.float(400, 120, err <= 2 ? `Spot on! +${pts}` : err <= 6 ? `Close! +${pts}` : err <= 12 ? `Not bad +${pts}` : `Way off +${pts}`, err <= 6 ? '#7ee36b' : '#ffd34d', 32);
    pts >= 70 ? K.sfx.win() : K.sfx.note(300, 0.3);
    nextBtn.label = pond >= PONDS ? 'Final score' : 'Next pond';
  }

  function update(dt) {
    for (const f of fish) {
      f.a += K.rand(-2, 2) * dt;
      // gentle pull back toward its school's home
      const dx = f.hx - f.x, dy = f.hy - f.y, d = Math.hypot(dx, dy);
      const pull = d > RX * f.spread * 0.7 ? 1.6 : 0.15;
      const want = Math.atan2(dy, dx);
      f.a += Math.sin(want - f.a) * pull * dt;
      let nx = f.x + Math.cos(f.a) * f.sp * dt, ny = f.y + Math.sin(f.a) * f.sp * dt;
      if (((nx - PX) / (RX - 18)) ** 2 + ((ny - PY) / (RY - 14)) ** 2 >= 1) { f.a += Math.PI * 0.8; nx = f.x; ny = f.y; }
      f.x = nx; f.y = ny; f.wig += dt * 9;
      if (f.show < 90) f.show = Math.max(0, f.show - dt);
    }
    for (const n of nets) n.t += dt;
    nets = nets.filter(n => n.t < 1.2);
  }

  function drawFish(c, f) {
    const col = f.show > 0 ? KINDS[f.k].color : null;
    c.save(); c.translate(f.x, f.y); c.rotate(f.a);
    if (col) { c.shadowColor = col; c.shadowBlur = 12; c.fillStyle = col; c.globalAlpha = Math.min(1, f.show * 2); }
    else { c.fillStyle = 'rgba(4,14,30,.55)'; }
    c.beginPath(); c.ellipse(0, 0, 9, 4.5, 0, 0, 7); c.fill();
    const w = Math.sin(f.wig) * 3;
    c.beginPath(); c.moveTo(-7, 0); c.lineTo(-14, -5 + w); c.lineTo(-14, 5 + w); c.closePath(); c.fill();
    c.restore();
  }

  function drawPond(c, t) {
    c.save();
    c.shadowColor = '#2ee6c5'; c.shadowBlur = 30;
    c.beginPath(); c.ellipse(PX, PY, RX + 14, RY + 12, 0, 0, 7);
    c.fillStyle = '#3b5e3a'; c.fill();
    c.restore();
    const g = c.createRadialGradient(PX - 80, PY - 60, 20, PX, PY, RX);
    g.addColorStop(0, '#2a8f93'); g.addColorStop(0.6, '#1d5f78'); g.addColorStop(1, '#123a5a');
    c.beginPath(); c.ellipse(PX, PY, RX, RY, 0, 0, 7); c.fillStyle = g; c.fill();
    c.save(); c.clip();
    // caustics
    c.strokeStyle = 'rgba(190,245,255,.07)'; c.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      c.beginPath();
      for (let x = PX - RX; x <= PX + RX; x += 14) c.lineTo(x, PY - RY + i * 44 + Math.sin(x / 40 + t * 1.2 + i) * 8);
      c.stroke();
    }
  }

  function draw(c, t) {
    if (!fish) {
      drawPond(c, t);
      for (let i = 0; i < 40; i++) {
        const a = t * 0.3 + i * 0.6, f = { x: PX + Math.cos(a + i) * (60 + (i * 37) % 260), y: PY + Math.sin(a * 1.3 + i) * (30 + (i * 23) % 140), a: a + Math.PI / 2, show: i % 3 ? 0 : 1, k: i % 3, wig: t * 9 + i };
        drawFish(c, f);
      }
      c.restore();
      return;
    }
    drawPond(c, t);
    for (const f of fish) if (!(f.show > 0)) drawFish(c, f);
    // murk on top of hidden fish
    if (phase !== 'reveal') { c.fillStyle = 'rgba(20,70,90,.25)'; c.fillRect(PX - RX, PY - RY, RX * 2, RY * 2); }
    for (const f of fish) if (f.show > 0) drawFish(c, f);
    // nets
    for (const n of nets) {
      const k = Math.min(1, n.t / 0.25), a = n.t < 0.8 ? 1 : 1 - (n.t - 0.8) / 0.4;
      c.save(); c.globalAlpha = a;
      c.strokeStyle = '#e8fbff'; c.lineWidth = 2.5; c.shadowColor = '#bfefff'; c.shadowBlur = 12;
      c.beginPath(); c.ellipse(n.x, n.y, NET * k, NET * k / 1.15, 0, 0, 7); c.stroke();
      c.lineWidth = 1; c.globalAlpha = a * 0.4; c.shadowBlur = 0;
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(n.x + i * 16 * k, n.y - NET * k); c.lineTo(n.x + i * 16 * k, n.y + NET * k); c.moveTo(n.x - NET * k, n.y + i * 14 * k); c.lineTo(n.x + NET * k, n.y + i * 14 * k); c.stroke(); }
      c.restore();
    }
    c.restore(); // pond clip
    // net cursor
    if (phase === 'cast' && K.ptr.active && inPond(K.ptr.x, K.ptr.y)) {
      c.save(); c.setLineDash([6, 6]); c.strokeStyle = 'rgba(232,251,255,.6)'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(K.ptr.x, K.ptr.y, NET, NET / 1.15, 0, 0, 7); c.stroke(); c.restore();
    }

    // HUD
    K.chip(22, 14, 'Pond', `${pond} / ${PONDS}`, '#fff', { w: 90, h: 50 });
    K.chip(122, 14, 'Score', results.reduce((a, r) => a + r.pts, 0), '#ffd34d', { w: 100, h: 50 });
    K.chip(778, 14, 'Casts left', casts, '#4fd1ff', { w: 110, h: 50, align: 'right' });
    K.chip(656, 14, 'Fish in pond', total, '#2ee6c5', { w: 110, h: 50, align: 'right' });
    // tally
    const caught = tally.reduce((a, b) => a + b, 0);
    K.panel(c, 22, 462, 120, 122, { r: 14 });
    K.text('YOUR SAMPLE', 82, 478, 9, 'rgba(220,228,250,.6)');
    KINDS.forEach((kd, k) => {
      const y = 500 + k * 24;
      K.orb(c, 40, y, 7, kd.color, { glow: 6 });
      K.text(`${tally[k]}`, 60, y, 14, '#fff', { weight: 800, align: 'left' });
      K.text(caught ? Math.round(tally[k] / caught * 100) + '%' : '–', 132, y, 12, 'rgba(220,228,250,.7)', { align: 'right' });
    });
    K.text(`${caught} caught`, 82, 572, 10, 'rgba(220,228,250,.6)');

    if (phase === 'cast') {
      K.text(`Cast ${CASTS - casts + 1} of ${CASTS}: tap anywhere in the pond`, 470, 520, 15, 'rgba(220,228,250,.8)', { weight: 600 });
      K.text(`Then you'll estimate the % of ${KINDS[ask].name} fish.`, 470, 546, 13, KINDS[ask].color, { weight: 600 });
    } else {
      // slider
      const kd = KINDS[ask];
      K.text(`What percent of the pond is ${kd.name}?`, slider.x + slider.w / 2, 470, 15, kd.color, { weight: 700 });
      K.rr(c, slider.x, slider.y - 5, slider.w, 10, 5); c.fillStyle = 'rgba(255,255,255,.1)'; c.fill();
      K.rr(c, slider.x, slider.y - 5, slider.w * guess / 100, 10, 5); c.fillStyle = kd.color; c.fill();
      for (let p = 0; p <= 100; p += 25) K.text(p + '%', slider.x + slider.w * p / 100, slider.y + 24, 10, 'rgba(220,228,250,.5)');
      const hx = slider.x + slider.w * guess / 100;
      K.orb(c, hx, slider.y, 14, '#fff', { glow: 14 });
      K.text(guess + '%', hx, slider.y - 28, 16, '#fff', { weight: 800 });
      if (phase === 'reveal') {
        const r = results[results.length - 1], ax = slider.x + slider.w * r.a / 100;
        c.fillStyle = '#7ee36b'; c.fillRect(ax - 2, slider.y - 16, 4, 32);
        K.text('actual ' + r.a + '%', ax, slider.y + 40, 12, '#7ee36b', { weight: 800 });
        K.button(nextBtn);
      } else K.button(lockBtn);
    }
  }
})();
</script>
</body>
</html>

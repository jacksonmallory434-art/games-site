<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Make the Number</title>
<style>
  :root { --bg: #12131a; --panel: #1c1e29; --line: #2c2f3e; --text: #ecedf3; --muted: #9a9db0; --accent: #ffcc33; --good: #3ecf8e; --bad: #ff6b6b; --blue: #4a8cf0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: manipulation; }
  body { display: flex; align-items: center; justify-content: center; padding: 14px; user-select: none; -webkit-user-select: none; }
  .app { width: 100%; max-width: 440px; text-align: center; }
  .hud { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .hud b { color: var(--text); }
  .target {
    background: #f7f5ee; color: #2b2d3a; border-radius: 16px; padding: 14px 10px 10px;
    background-image: linear-gradient(#d6e4f0 1px, transparent 1px), linear-gradient(90deg, #d6e4f0 1px, transparent 1px); background-size: 22px 22px;
  }
  .target small { display: block; font-weight: 700; color: #6b6f85; }
  .target b { font-size: clamp(3rem, 14vw, 4.2rem); line-height: 1.1; }
  .target.win { box-shadow: 0 0 0 5px var(--good); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 12px; min-height: 76px; }
  .tile {
    font: inherit; font-weight: 800; font-size: clamp(1.4rem, 7vw, 2rem); aspect-ratio: 1; border-radius: 14px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 3px solid var(--line);
  }
  .tile.sel { border-color: var(--accent); background: #2a2a1c; }
  .tile.new { animation: pop .25s; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .op { font: inherit; font-weight: 800; font-size: 1.8rem; padding: 8px 0; border-radius: 12px; cursor: pointer; background: var(--bg); color: var(--blue); border: 2px solid var(--line); }
  .op.sel { border-color: var(--blue); background: #17233a; }
  .msg { min-height: 1.4em; margin: 12px 0 6px; font-weight: 700; color: var(--muted); }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .row button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 10px; cursor: pointer; background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .row button.next { background: var(--accent); color: #111; border: 0; font-weight: 800; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hud"><span>Solved <b id="solved">0</b></span><span>Streak <b id="streak">0</b></span><span>Best streak <b id="best">0</b></span></div>
  <div class="target" id="target"><small>Make this number</small><b id="goal">24</b></div>
  <div class="tiles" id="tiles"></div>
  <div class="ops" id="ops">
    <button class="op" data-op="+">+</button><button class="op" data-op="−">−</button><button class="op" data-op="×">×</button><button class="op" data-op="÷">÷</button>
  </div>
  <p class="msg" id="msg">Pick a number, an operation, then another number.</p>
  <div class="row">
    <button id="undo" type="button">Undo</button>
    <button id="reset" type="button">Restart</button>
    <button id="skip" type="button">Skip</button>
    <button id="next" class="next" type="button" hidden>Next puzzle</button>
  </div>
</div>
<script>
// Make the Number — a MathAdvice original.
const KEY = 'ma-makenumber-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

let start, goal, tiles, history, selTile = null, selOp = null, solved = 0, streak = 0, best = getBest(), done = false, uid = 0;

function apply(a, op, b) {
  if (op === '+') return a + b;
  if (op === '−') return a - b;
  if (op === '×') return a * b;
  if (op === '÷') return b !== 0 && a % b === 0 ? a / b : null;
}
// Build a puzzle by actually combining 4 numbers, so every puzzle has a solution.
function makePuzzle() {
  while (true) {
    const nums = Array.from({ length: 4 }, () => rnd(1, 9));
    let pool = nums.slice(), ok = true;
    while (pool.length > 1) {
      const i = rnd(0, pool.length - 1); let j; do { j = rnd(0, pool.length - 1); } while (j === i);
      const op = ['+', '−', '×', '÷'][rnd(0, 3)];
      const r = apply(pool[i], op, pool[j]);
      if (r === null || r < 0) { ok = false; break; }
      pool = pool.filter((_, k) => k !== i && k !== j); pool.push(r);
    }
    const t = pool[0];
    if (ok && t >= 10 && t <= 60 && !nums.includes(t)) return { nums, goal: t };
  }
}

function render(newId) {
  $('tiles').innerHTML = tiles.map(t => `<button class="tile${selTile === t.id ? ' sel' : ''}${newId === t.id ? ' new' : ''}" data-id="${t.id}">${t.v}</button>`).join('');
  document.querySelectorAll('.op').forEach(b => b.classList.toggle('sel', b.dataset.op === selOp));
}
function newPuzzle() {
  const p = makePuzzle();
  start = p.nums.map(v => ({ id: uid++, v })); goal = p.goal;
  $('goal').textContent = goal;
  restart();
}
function restart() {
  tiles = start.map(t => ({ ...t })); history = []; selTile = null; selOp = null; done = false;
  $('target').classList.remove('win'); $('next').hidden = true; $('skip').hidden = false;
  say('Pick a number, an operation, then another number.');
  render();
}
function say(t, cls = '') { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; }

$('tiles').addEventListener('click', e => {
  const b = e.target.closest('.tile'); if (!b || done) return;
  const id = +b.dataset.id;
  if (selTile === null || selOp === null) { selTile = selTile === id ? null : id; render(); return; }
  if (id === selTile) { selTile = null; render(); return; }
  const A = tiles.find(t => t.id === selTile), B = tiles.find(t => t.id === id);
  const r = apply(A.v, selOp, B.v);
  if (r === null) { say(`${A.v} ÷ ${B.v} doesn't come out even. Try something else.`, 'bad'); return; }
  if (r < 0) { say('No negative numbers allowed. Try the other order.', 'bad'); return; }
  history.push(tiles.map(t => ({ ...t })));
  const nt = { id: uid++, v: r };
  tiles = tiles.filter(t => t.id !== A.id && t.id !== B.id); tiles.push(nt);
  say(`${A.v} ${selOp} ${B.v} = ${r}`);
  selTile = tiles.length > 1 ? nt.id : null; selOp = null;
  render(nt.id);
  if (tiles.length === 1) check();
});
document.querySelectorAll('.op').forEach(b => b.onclick = () => { if (done) return; selOp = selOp === b.dataset.op ? null : b.dataset.op; render(); });
function check() {
  if (tiles[0].v === goal) {
    done = true; solved++; streak++;
    if (streak > best) { best = streak; setBest(best); }
    $('target').classList.add('win'); say('You made it! 🎉', 'good');
    $('next').hidden = false; $('skip').hidden = true;
  } else {
    say(`You got ${tiles[0].v}, not ${goal}. Undo or restart and try again.`, 'bad');
  }
  updateHud();
}
function updateHud() { $('solved').textContent = solved; $('streak').textContent = streak; $('best').textContent = best; }
$('undo').onclick = () => { if (done || !history.length) return; tiles = history.pop(); selTile = null; selOp = null; say('Undone.'); render(); };
$('reset').onclick = () => { if (!done) restart(); };
$('skip').onclick = () => { streak = 0; updateHud(); newPuzzle(); };
$('next').onclick = newPuzzle;
addEventListener('keydown', e => {
  const ops = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷' };
  if (ops[e.key] && !done) { selOp = ops[e.key]; render(); }
  else if (e.key === 'Enter' && done) newPuzzle();
  else if ((e.key === 'z' || e.key === 'Backspace') && !done) $('undo').click();
});

updateHud(); newPuzzle();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Function Machine</title>
</head>
<body>
<script src="../../js/mathquiz.js"></script>
<script>
// Function Machine — a MathAdvice original.
MathQuiz({ key: 'functionmachine', title: 'Function Machine',
  intro: ['Numbers go into the machine and come out changed.', 'Figure out the output, or crack the machine\'s rule.'],
  gen(level) {
    const { rnd, pick, choices } = MQ;
    const m = rnd(-4, 6) || 2, b = rnd(-9, 9);
    const rule = (mm, bb) => `${mm === 1 ? '' : mm === -1 ? '−' : mm}x${bb ? (bb > 0 ? ' + ' + bb : ' − ' + (-bb)) : ''}`.replace(/^(-)/, '−').replace(/-/g, '−');
    const f = x => m * x + b, neg = v => String(v).replace('-', '−');
    if (level < 1 || Math.random() < .5) {
      const x = rnd(-5, 9), ans = f(x);
      return { board: `<div class="mid">f(x) = ${rule(m, b)}</div>`, q: `What is <em>f(${neg(x)})</em>?`, answer: ans,
        options: choices(ans, [m + x + b, m * x - b, m * (x + b)], () => ans + rnd(-7, 7)).map(v => ({ value: v, label: neg(v) })),
        hint: `Replace x with ${neg(x)}: ${m} × (${neg(x)}) ${b >= 0 ? '+ ' + b : '− ' + (-b)}.` };
    }
    // Table of inputs and outputs: which rule made it?
    const xs = [0, 1, 2, 3];
    const rows = xs.map(x => `<tr><td>${x}</td><td>${neg(f(x))}</td></tr>`).join('');
    const ans = rule(m, b);
    return { board: `<table style="border-collapse:collapse;font-size:1.3rem;font-weight:800" cellpadding="6"><tr style="color:#6b6f85"><td>x</td><td>f(x)</td></tr>${rows}</table>`,
      q: 'Which rule makes this table?', answer: ans,
      options: choices(ans, [rule(b || 1, m), rule(m, b + m), rule(m + 1, b - 1)].filter(r => r !== ans), () => rule(rnd(-4, 6) || 3, rnd(-9, 9))),
      hint: 'The amount f(x) goes up each time x goes up by 1 is the number in front of x. f(0) is the number added at the end.' };
  } });
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Times Table Tower</title>
<style>
  :root { --bg: #12131a; --panel: #1c1e29; --line: #2c2f3e; --text: #ecedf3; --muted: #9a9db0; --accent: #ffcc33; --good: #3ecf8e; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: manipulation; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  .app { width: min(100vw, calc(100vh * 0.75)); height: min(100vh, calc(100vw / 0.75)); display: flex; flex-direction: column; }
  canvas { width: 100%; flex: 1; min-height: 0; display: block; }
  .panel { padding: 10px 12px 12px; background: var(--panel); }
  .q { text-align: center; font-weight: 800; font-size: clamp(1.6rem, 7vh, 2.4rem); margin: 0 0 8px; }
  .bar { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 100%; }
  .answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .answers button {
    font: inherit; font-weight: 800; font-size: clamp(1.1rem, 5vh, 1.6rem); padding: 12px 0; border-radius: 12px; cursor: pointer;
    background: var(--bg); color: var(--text); border: 2px solid var(--line); position: relative;
  }
  .answers button:hover { border-color: var(--accent); }
  .answers button small { position: absolute; top: 3px; left: 7px; font-size: .65rem; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <canvas id="c"></canvas>
  <div class="panel">
    <p class="q" id="q">Times Table Tower</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="answers" id="answers"></div>
  </div>
</div>
<script>
// Times Table Tower — a MathAdvice original.
const KEY = 'ma-tttower-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const $ = id => document.getElementById(id);

const c = $('c'), ctx = c.getContext('2d');
let W = 480, H = 400;
function fit() {
  const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  W = 480; H = Math.round(480 * r.height / r.width);
  c.width = r.width * d; c.height = r.height * d;
  ctx.setTransform(r.width * d / W, 0, 0, r.width * d / W, 0, 0);
}
addEventListener('resize', fit);

const COLORS = ['#e8505b', '#f5a04a', '#ffcc33', '#3ecf8e', '#4a8cf0', '#9b6cf0', '#e86bb8'];
const BH = 34;
let state = 'ready', blocks = [], falling = [], dropping = null, lives = 3, best = getBest(),
    answer = 0, qTime = 0, qLeft = 0, cam = 0, shake = 0, lastFeedback = null;

function newQuestion() {
  const h = blocks.length;
  const maxA = Math.min(12, 5 + Math.floor(h / 3));
  const a = rnd(2, maxA), b = rnd(2, 12);
  answer = a * b;
  $('q').textContent = `${a} × ${b}`;
  const opts = new Set([answer]);
  const near = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, answer + 1, answer - 1, answer + 10, answer - 10];
  for (const v of near.sort(() => Math.random() - 0.5)) { if (opts.size >= 4) break; if (v > 0) opts.add(v); }
  while (opts.size < 4) opts.add(answer + rnd(-15, 15) || 1);
  const list = [...opts].sort(() => Math.random() - 0.5);
  $('answers').innerHTML = list.map((v, i) => `<button data-v="${v}"><small>${i + 1}</small>${v}</button>`).join('');
  qTime = Math.max(2.5, 7 - h * 0.15); qLeft = qTime;
}

function start() {
  state = 'play'; blocks = []; falling = []; dropping = null; lives = 3; cam = 0;
  newQuestion();
}
function choose(v) {
  if (state !== 'play') { start(); return; }
  if (dropping) return;
  if (v === answer) {
    const w = 150 - Math.min(60, blocks.length * 2);
    dropping = { x: 240 + rnd(-14, 14) - w / 2, w, y: towerTop() - BH - 260, vy: 0, color: COLORS[blocks.length % COLORS.length], label: $('q').textContent + ' = ' + answer };
    lastFeedback = { good: true, t: 0.5 };
  } else miss();
}
function miss() {
  lives--; shake = 0.4; lastFeedback = { good: false, t: 0.5 };
  if (blocks.length) { const b = blocks.pop(); falling.push({ ...b, vx: (Math.random() < 0.5 ? -1 : 1) * 3, vy: -4, rot: 0 }); }
  if (lives <= 0) {
    state = 'over';
    const h = blocks.length; if (h > best) { best = h; setBest(best); }
    $('q').textContent = 'Tower complete!';
    $('answers').innerHTML = '<button data-v="-1" style="grid-column: span 4">Play again</button>';
    $('bar').style.width = '0%';
  } else newQuestion();
}
$('answers').addEventListener('click', e => { const b = e.target.closest('button'); if (b) choose(+b.dataset.v); });
addEventListener('keydown', e => {
  if (/^[1-4]$/.test(e.key) && state === 'play') { const b = $('answers').children[+e.key - 1]; if (b) choose(+b.dataset.v); }
  else if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') { e.preventDefault(); start(); }
});

function towerTop() { return H - 30 - blocks.length * BH; }
function update(dt) {
  shake = Math.max(0, shake - dt);
  if (lastFeedback) { lastFeedback.t -= dt; if (lastFeedback.t <= 0) lastFeedback = null; }
  falling.forEach(f => { f.vy += 0.5; f.x += f.vx; f.y += f.vy; f.rot += f.vx * 0.01; });
  falling = falling.filter(f => f.y < H + 200 + cam);
  // Keep the top of the tower in view.
  const target = Math.max(0, blocks.length * BH - H * 0.55);
  cam += (target - cam) * Math.min(1, dt * 4);
  if (state !== 'play') return;
  if (dropping) {
    dropping.vy += 1.1; dropping.y += dropping.vy;
    const land = towerTop() - BH;
    if (dropping.y >= land) {
      dropping.y = land; blocks.push(dropping); dropping = null;
      newQuestion();
    }
    return;
  }
  qLeft -= dt;
  $('bar').style.width = Math.max(0, qLeft / qTime * 100) + '%';
  if (qLeft <= 0) miss();
}

function draw() {
  const sx = shake > 0 ? Math.sin(shake * 60) * 6 : 0;
  ctx.save();
  ctx.fillStyle = '#f7f5ee'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#d6e4f0'; ctx.lineWidth = 1;
  const off = cam % 32;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = off - 32; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.translate(sx, cam);
  // ground
  ctx.fillStyle = '#3a3d4f'; ctx.fillRect(0, H - 30, W, 400);
  const drawBlock = b => {
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, BH - 3, 6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(b.x, b.y + BH - 10, b.w, 7);
    ctx.fillStyle = '#fff'; ctx.font = '800 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + 21);
  };
  blocks.forEach((b, i) => { b.y = H - 30 - (i + 1) * BH; drawBlock(b); });
  if (dropping) drawBlock(dropping);
  falling.forEach(f => { ctx.save(); ctx.translate(f.x + f.w / 2, f.y); ctx.rotate(f.rot); ctx.translate(-f.x - f.w / 2, -f.y); drawBlock(f); ctx.restore(); });
  ctx.restore();

  // HUD
  ctx.fillStyle = '#2b2d3a'; ctx.font = '800 26px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Height ' + blocks.length, 14, 34);
  ctx.textAlign = 'right'; ctx.fillStyle = '#e8505b'; ctx.fillText('♥'.repeat(Math.max(0, lives)) + '♡'.repeat(3 - Math.max(0, lives)), W - 14, 34);
  ctx.textAlign = 'right'; ctx.fillStyle = '#6b6f85'; ctx.font = '700 15px system-ui, sans-serif'; ctx.fillText('Best ' + best, W - 14, 56);
  if (lastFeedback) {
    ctx.globalAlpha = Math.min(1, lastFeedback.t * 2); ctx.textAlign = 'center';
    ctx.fillStyle = lastFeedback.good ? '#2ea36f' : '#e8505b'; ctx.font = '800 34px system-ui, sans-serif';
    ctx.fillText(lastFeedback.good ? 'Nice!' : 'Oops!', W / 2, 90); ctx.globalAlpha = 1;
  }
  if (state === 'ready') card('Times Table Tower', 'Answer right to stack a block.', 'Wrong or too slow? The top block falls.', 'You have 3 lives. Tap Start or press Space.');
  if (state === 'over') card('Tower height: ' + blocks.length, 'Best: ' + best, '', 'Tap Play again or press Space');
}
function card(a, b, c2, d) {
  ctx.fillStyle = 'rgba(18,19,26,.82)'; ctx.beginPath(); ctx.roundRect(30, H / 2 - 100, W - 60, 190, 16); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffcc33'; ctx.font = '800 30px system-ui, sans-serif'; ctx.fillText(a, W / 2, H / 2 - 50);
  ctx.fillStyle = '#fff'; ctx.font = '600 17px system-ui, sans-serif'; ctx.fillText(b, W / 2, H / 2 - 10);
  ctx.fillText(c2, W / 2, H / 2 + 18);
  ctx.fillStyle = '#c8cad6'; ctx.font = '500 15px system-ui, sans-serif'; ctx.fillText(d, W / 2, H / 2 + 60);
}

$('answers').innerHTML = '<button data-v="-1" style="grid-column: span 4">Start</button>';
fit();
let last = performance.now();
function loop(t) { const dt = Math.min((t - last) / 1000, 0.05); last = t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Table Tower</title>
<script src="../_kit/kit.js"></script>
</head>
<body>
<script>
(() => {
  const W = 480, H = 640, PANEL_Y = 446, GROUND = 404, BH = 34, LIVES = 3;
  const COLORS = ['#ff5d73', '#ff9f43', '#ffd34d', '#7ee36b', '#2ee6c5', '#4fd1ff', '#6b8cff', '#a66bff', '#ff6bd6'];
  const GOOD = '#7ee36b', BAD = '#ff5d73';
  let blocks, falling, dropping, lives, q, opts, qTime, qLeft, cam, pause, picked, right, tallest, over, btns;

  // Keep best scores saved before this game moved to the kit.
  try { const old = localStorage.getItem('ma-tttower-best'); if (old && localStorage.getItem('ma-times-table-tower-best') == null) localStorage.setItem('ma-times-table-tower-best', old); } catch (e) {}
  const K = window.K = MA.game({
    slug: 'times-table-tower', title: 'Times Table Tower', w: W, h: H,
    accent: '#ffd34d', accent2: '#ff9f43', bg: ['#141033', '#0a1a33'],
    tagline: 'Answer times-table questions to stack your tower as high as it will go.',
    how: [
      'Tap the right answer (or press <b>1</b>–<b>4</b>) to drop a new block on top.',
      'A wrong answer, or running out of time, knocks the top block off and costs a life.',
      'You have <b>3 lives</b>. The tables get bigger and the clock gets shorter as you climb.',
      'Your score is how tall the tower is when the last life is gone.',
    ],
    start, update, draw,
    down(x, y) {
      if (K.state !== 'play') return;
      const i = btns.findIndex(b => K.hit(b, x, y));
      if (i >= 0) choose(i);
    },
    key(k) { if (K.state === 'play' && /^[1-4]$/.test(k)) choose(+k - 1); },
  });

  // Four answer buttons in a row along the bottom panel.
  btns = [0, 1, 2, 3].map(i => ({ x: 24 + i * 110, y: 522, w: 102, h: 62, r: 14, label: '', size: 26 }));

  function newQuestion() {
    const h = blocks.length;
    const maxA = Math.min(12, 5 + Math.floor(h / 3));
    const a = K.ri(2, maxA), b = K.ri(2, 12), ans = a * b;
    q = { a, b, ans, born: 0 };
    // Wrong options are the classic slips: a neighbouring fact, off by one, off by ten.
    const set = new Set([ans]);
    for (const v of K.shuffle([a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 1, ans - 1, ans + 10, ans - 10])) {
      if (set.size >= 4) break;
      if (v > 0) set.add(v);
    }
    while (set.size < 4) { const v = ans + K.ri(-15, 15); if (v > 0) set.add(v); }
    opts = K.shuffle([...set]);
    qTime = Math.max(2.5, 7 - h * 0.15); qLeft = qTime;
    picked = null;
  }

  function start() {
    blocks = []; falling = []; dropping = null; lives = LIVES; cam = 0; pause = 0; right = 0; tallest = 0; over = false;
    newQuestion();
  }

  function choose(i) {
    if (dropping || pause || over || !opts[i]) return;
    const b = btns[i];
    if (opts[i] === q.ans) {
      right++;
      picked = { i, good: true };
      K.sfx.good();
      K.burst(b.x + b.w / 2, b.y + b.h / 2, GOOD, 12, 180, 3.5);
      const w = 150 - Math.min(60, blocks.length * 2);
      const top = GROUND - (blocks.length + 1) * BH;
      dropping = { x: W / 2 + K.ri(-14, 14) - w / 2, w, y: top - 280, vy: 0, color: COLORS[blocks.length % COLORS.length], label: `${q.a} × ${q.b} = ${q.ans}` };
    } else miss(i);
  }

  function miss(i) {
    lives--;
    picked = { i, good: false };
    pause = 1.2; // show the right answer for a moment
    K.sfx.bad(); K.shake(10); K.flash(BAD, 0.3);
    if (i != null) { const b = btns[i]; K.burst(b.x + b.w / 2, b.y + b.h / 2, BAD, 14, 200, 3.5); }
    if (blocks.length) {
      const b = blocks.pop();
      falling.push({ ...b, vx: (Math.random() < 0.5 ? -1 : 1) * 170, vy: -260, rot: 0 });
      K.sfx.whoosh();
    }
    K.float(W / 2, 170, i == null ? 'Too slow!' : 'Oops!', BAD, 32);
    if (lives <= 0) {
      over = true;
      K.gameOver(blocks.length, {
        title: 'Tower complete!', kicker: 'Final height', delay: 1300,
        msg: `You answered <b>${right}</b> right. Tallest the tower got: <b>${tallest}</b> block${tallest === 1 ? '' : 's'}.`,
      });
    }
  }

  function update(dt) {
    q.born = Math.min(1, q.born + dt * 5);
    for (const f of falling) { f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vx * 0.0006; }
    falling = falling.filter(f => f.y - cam < H + 100);
    // Keep the top of the tower in view.
    const target = Math.max(0, blocks.length * BH - (GROUND - 210));
    cam += (target - cam) * Math.min(1, dt * 4);
    if (over) return;
    if (pause) {
      pause = Math.max(0, pause - dt);
      if (!pause) newQuestion();
      return;
    }
    if (dropping) {
      dropping.vy += 1800 * dt; dropping.y += dropping.vy * dt;
      const land = GROUND - (blocks.length + 1) * BH;
      if (dropping.y >= land) {
        dropping.y = land; blocks.push(dropping);
        tallest = Math.max(tallest, blocks.length);
        const cx = dropping.x + dropping.w / 2, sy = land + cam + BH;
        K.burst(cx, sy, dropping.color, 16, 200, 3.5, false);
        K.float(cx, sy - BH - 10, '+1', '#fff', 26);
        K.shake(3); K.sfx.pop();
        if (blocks.length % 5 === 0) { K.sfx.coin(); K.float(W / 2, 150, blocks.length + ' high!', '#ffd34d', 32); }
        dropping = null;
        newQuestion();
      }
      return;
    }
    qLeft -= dt;
    if (qLeft <= 0) { qLeft = 0; miss(null); }
  }

  function fitText(ctx, s, max, size) {
    ctx.save(); ctx.font = K.font(size, 800);
    const w = ctx.measureText(s).width; ctx.restore();
    return Math.min(size, size * max / w);
  }

  function drawBlock(ctx, b) {
    K.tile(ctx, b.x, b.y, b.w, BH - 5, b.color, { r: 8, depth: 4 });
    K.text(b.label, b.x + b.w / 2, b.y + (BH - 5) / 2 + 1, fitText(ctx, b.label, b.w - 14, 15), '#fff', { weight: 800, stroke: 3, strokeColor: 'rgba(0,0,0,.3)', c: ctx });
  }

  function heart(ctx, x, y, s, on) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    ctx.beginPath();
    ctx.moveTo(0, 7);
    ctx.bezierCurveTo(-14, -2, -9, -14, 0, -6);
    ctx.bezierCurveTo(9, -14, 14, -2, 0, 7);
    ctx.fillStyle = on ? BAD : 'rgba(255,255,255,.12)';
    if (on) { ctx.shadowColor = BAD; ctx.shadowBlur = 10; }
    ctx.fill();
    ctx.restore();
  }

  function draw(ctx, t) {
    const n = blocks ? blocks.length : 0;
    // Tower area
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, PANEL_Y); ctx.clip();
    ctx.translate(0, cam || 0);
    // height markers every 5 blocks
    for (let i = 5; i <= n + 10; i += 5) {
      const y = GROUND - i * BH;
      if (y + (cam || 0) < 84) continue; // keep clear of the HUD chips
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(22, y, W - 44, 1);
      K.text(String(i), 30, y - 8, 11, 'rgba(210,218,245,.4)', { align: 'left', c: ctx });
    }
    // ground
    const g = ctx.createLinearGradient(0, GROUND, 0, GROUND + 60);
    g.addColorStop(0, '#3a3270'); g.addColorStop(1, '#151233');
    ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, 400);
    ctx.save(); ctx.shadowColor = K.accent; ctx.shadowBlur = 16; ctx.fillStyle = K.alpha(K.accent, 0.7); ctx.fillRect(0, GROUND, W, 2); ctx.restore();
    if (blocks) {
      blocks.forEach((b, i) => { b.y = GROUND - (i + 1) * BH; drawBlock(ctx, b); });
      if (dropping) drawBlock(ctx, dropping);
      for (const f of falling) {
        ctx.save(); ctx.translate(f.x + f.w / 2, f.y + BH / 2); ctx.rotate(f.rot); ctx.translate(-f.x - f.w / 2, -f.y - BH / 2);
        drawBlock(ctx, f); ctx.restore();
      }
    } else {
      // menu backdrop: a little tower
      ['3 × 4 = 12', '6 × 7 = 42', '8 × 9 = 72', '5 × 5 = 25'].forEach((s, i) =>
        drawBlock(ctx, { x: W / 2 - 75 + [0, 8, -6, 4][i] - i * 3, w: 150 - i * 6, y: GROUND - (i + 1) * BH + Math.sin(t * 2) * (i * 0.6), color: COLORS[i], label: s }));
    }
    ctx.restore();

    // HUD chips
    K.chip(16, 12, 'Height', n, '#ffd34d', { w: 112, h: 56, size: 26 });
    K.chip(W - 16, 12, 'Best', Math.max(K.best(), n), '#ff9f43', { w: 112, h: 56, size: 26, align: 'right' });
    K.panel(ctx, W / 2 - 60, 12, 120, 56, { r: 12 });
    K.text('LIVES', W / 2, 26, 10, 'rgba(210,218,245,.65)', { weight: 700 });
    const lv = blocks ? lives : LIVES;
    for (let i = 0; i < LIVES; i++) heart(ctx, W / 2 + (i - 1) * 30, 46, 24 * (i === lv && pause ? 1 + pause * 0.3 : 1), i < lv);

    // Question panel
    const rev = pause > 0 && picked && !picked.good;
    K.panel(ctx, 12, PANEL_Y + 2, W - 24, H - PANEL_Y - 44, { r: 18, fill: 'rgba(8,10,26,.82)', glow: 22, glowColor: K.alpha(rev ? BAD : K.accent, 0.35), stroke: K.alpha(rev ? BAD : K.accent, 0.3) });
    if (!q) {
      K.text('7 × 8 = ?', W / 2, PANEL_Y + 34, 36, '#fff', { weight: 800, glow: 14, glowColor: K.accent });
    } else {
      const s = rev ? `${q.a} × ${q.b} = ${q.ans}` : `${q.a} × ${q.b} = ?`;
      K.text(s, W / 2, PANEL_Y + 34, 36 * K.back(q.born), '#fff', { weight: 800, glow: 14, glowColor: rev ? BAD : K.accent });
    }
    // timer bar
    const f = q ? (pause || dropping ? (picked && picked.good ? qLeft / qTime : 0) : qLeft / qTime) : 1;
    const low = f < 0.3 && !pause && !dropping;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; K.rr(ctx, 30, PANEL_Y + 60, W - 60, 7, 4); ctx.fill();
    if (f > 0) {
      ctx.save(); ctx.shadowColor = low ? BAD : K.accent; ctx.shadowBlur = 10;
      ctx.fillStyle = low ? BAD : K.accent; K.rr(ctx, 30, PANEL_Y + 60, (W - 60) * K.clamp(f, 0, 1), 7, 4); ctx.fill(); ctx.restore();
    }
    // answer buttons
    btns.forEach((b, i) => {
      const v = opts ? opts[i] : [42, 48, 56, 63][i];
      b.label = String(v);
      b.color = '#3b4270'; b.textColor = '#fff'; b.glow = 0;
      if (q && picked) {
        if (v === q.ans) { b.color = GOOD; b.textColor = '#0b1c08'; b.glow = 18; }
        else if (i === picked.i) { b.color = BAD; b.textColor = '#2a0008'; }
      }
      b.disabled = false;
      K.button(b);
      K.text(String(i + 1), b.x + 12, b.y + 12, 10, b.color === '#3b4270' ? 'rgba(210,218,245,.5)' : 'rgba(0,0,0,.45)', { weight: 700 });
    });
  }

  // Test hook: read-only peek at the game state.
  K.peek = () => ({ blocks: blocks && blocks.length, lives, q, opts, qLeft, pause, dropping: !!dropping, right });
})();
</script>
</body>
</html>

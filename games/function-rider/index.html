<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Function Rider</title>
<script src="../_kit/kit.js"></script>
<style>
  .ma-lv { grid-template-columns: repeat(8, 1fr); max-width: 27em; gap: .45em; }
  @media (max-width: 600px), (max-height: 520px) { .ma-how { display: none; } }
  .fr-eq { position: absolute; left: 23.75%; top: 1.6667%; width: 51.25%; height: 8%; z-index: 3; display: flex; align-items: center; gap: .45em; padding: 0 .8em;
    border-radius: .75em; background: rgba(10,14,32,.78); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); cursor: text; transition: border-color .15s, box-shadow .15s; }
  .fr-eq:focus-within { border-color: #4fd1ff; box-shadow: 0 0 1.1em rgba(79,209,255,.4), inset 0 1px 0 rgba(255,255,255,.06); }
  .fr-eq.err { border-color: #ff5d73; }
  .fr-eq span { font-weight: 800; font-size: 1.3em; color: #8fdcff; white-space: nowrap; }
  .fr-eq input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: #fff; font: 700 1.35em Lexend, system-ui, sans-serif; padding: 0; -webkit-user-select: text; user-select: text; }
  .fr-eq input::placeholder { color: rgba(200,210,240,.4); font-weight: 500; font-size: .78em; }
</style>
</head>
<body>
<script>
// Function Rider — a MathAdvice original.
// Type an equation. A sled rides your graph from the start line to the flag, grabbing stars and dodging blocks.
(() => {
  const W = 800, H = 600, U = 40, XMIN = -10, YMAX = 6, GY = 64, GH = 480; // graph: 40 px per unit, drawn from y = GY
  const sx = x => (x - XMIN) * U, sy = y => GY + (YMAX - y) * U;
  const CYAN = '#4fd1ff', GOLD = '#ffcc33', GREEN = '#3ee6a0', RED = '#ff4d6a';

  // ---------- A small, safe math parser (no eval). Supports + − × ÷ ^, parentheses, |x|, implicit multiplication,
  // sin cos tan sqrt abs ln log, pi and e.
  const FUNCS = { sin: Math.sin, cos: Math.cos, tan: Math.tan, sqrt: Math.sqrt, abs: Math.abs, ln: Math.log, log: Math.log10, exp: Math.exp };
  function parse(src) {
    let s = src.toLowerCase().replace(/^\s*y\s*=/, '').replace(/[−–]/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/²/g, '^2').replace(/³/g, '^3').replace(/π/g, 'pi').replace(/√/g, 'sqrt');
    const toks = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const v = parseFloat(s.slice(i, j)); if (isNaN(v)) throw `"${s.slice(i, j)}" isn't a number`; toks.push({ t: 'n', v }); i = j; continue; }
      if (/[a-z]/.test(c)) {
        let j = i; while (j < s.length && /[a-z]/.test(s[j])) j++;
        let w = s.slice(i, j);
        // Split runs like "xsin" or "pix" into known pieces.
        while (w) {
          const m = ['sqrt', 'sin', 'cos', 'tan', 'abs', 'exp', 'log', 'ln', 'pi', 'x', 'e'].find(k => w.startsWith(k));
          if (!m) throw `I don't know "${w}". Use x, numbers, and things like sin, cos, sqrt, abs.`;
          toks.push(FUNCS[m] ? { t: 'f', v: m } : m === 'x' ? { t: 'x' } : { t: 'n', v: m === 'pi' ? Math.PI : Math.E });
          w = w.slice(m.length);
        }
        i = j; continue;
      }
      if ('+-*/^()|'.includes(c)) { toks.push({ t: c }); i++; continue; }
      throw `I don't understand "${c}".`;
    }
    let p = 0;
    const peek = () => toks[p], eat = t => { if (toks[p] && toks[p].t === t) { p++; return true; } return false; };
    const startsValue = k => k && (k.t === 'n' || k.t === 'x' || k.t === 'f' || k.t === '(');
    function expr() { let a = term(); for (;;) { if (eat('+')) { const l = a, r = term(); a = x => l(x) + r(x); } else if (eat('-')) { const l = a, r = term(); a = x => l(x) - r(x); } else return a; } }
    function term() {
      let a = unary();
      for (;;) {
        if (eat('*')) { const l = a, r = unary(); a = x => l(x) * r(x); }
        else if (eat('/')) { const l = a, r = unary(); a = x => l(x) / r(x); }
        else if (startsValue(peek())) { const l = a, r = power(); a = x => l(x) * r(x); } // 2x, 3(x+1), x sin(x)
        else return a;
      }
    }
    function unary() { if (eat('-')) { const a = unary(); return x => -a(x); } if (eat('+')) return unary(); return power(); }
    function power() { const b = atom(); if (eat('^')) { const e = unary(); return x => Math.pow(b(x), e(x)); } return b; }
    function atom() {
      const k = peek();
      if (!k) throw 'The equation ends too soon.';
      if (k.t === 'n') { p++; const v = k.v; return () => v; }
      if (k.t === 'x') { p++; return x => x; }
      if (k.t === 'f') { p++; const f = FUNCS[k.v]; const a = peek() && peek().t === '(' ? atom() : power(); return x => f(a(x)); }
      if (eat('(')) { const a = expr(); if (!eat(')')) throw 'Check your parentheses: one ( is never closed.'; return a; }
      if (eat('|')) { const a = expr(); if (!eat('|')) throw 'Check your absolute value bars | |.'; return x => Math.abs(a(x)); }
      if (k.t === ')') throw 'There\'s an extra ) or something missing before it.';
      throw `Something's missing before "${k.t}".`;
    }
    if (!toks.length) throw '';
    const f = expr();
    if (p < toks.length) throw toks[p].t === ')' ? 'There\'s an extra ).' : `Something's off near "${toks[p].v ?? toks[p].t}".`;
    return f;
  }


  const LEVELS = [
    { name: 'Flat out', x0: -9, flag: [9, 2], stars: [[-5, 2], [0, 2], [5, 2]], hint: 'All the stars are at the same height. A flat line looks like y = 3.' },
    { name: 'Uphill', x0: -6, flag: [5.5, 5.5], stars: [[-3, -3], [0, 0], [3, 3]], hint: 'Each star has the same x and y. What equation makes y equal x?' },
    { name: 'Downhill', x0: -5, flag: [6, -5], stars: [[-3, 4], [0, 1], [4, -3]], hint: 'Slope-intercept form: y = mx + b. It crosses the y-axis at 1 and goes down 1 for every 1 to the right.' },
    { name: 'Gentle slope', x0: -8, flag: [9, 2.5], stars: [[-6, -5], [0, -2], [6, 1]], hint: 'From one star to the next: right 6, up 3. So the slope is 3/6.' },
    { name: 'Over the block', x0: -9, flag: [9, 4], stars: [[-6, -1], [0, 1], [6, 3]], blocks: [[-2, -3, 2, 0]], hint: 'Find the slope between two stars, then where the line crosses the y-axis.' },
    { name: 'The valley', x0: -4.8, flag: [4.8, 5.76], stars: [[-4, 4], [0, 0], [4, 4]], blocks: [[-1.4, 2, 1.4, 6]], hint: 'A line can\'t do this one. Try a parabola, like y = a·x². Which a puts (4, 4) on it?' },
    { name: 'Shifted valley', x0: -0.4, flag: [4.4, 2.76], stars: [[0, 1], [2, -3], [4, 1]], hint: 'Vertex form: y = (x − h)² + k has its lowest point at (h, k).' },
    { name: 'The hill', x0: -4.4, flag: [2.4, -1.78], stars: [[-3, 2], [-1, 4], [1, 2]], hint: 'The top is at (−1, 4). A minus sign in front flips a parabola upside down. Try y = −a(x + 1)² + 4.' },
    { name: 'Sharp turn', x0: -6, flag: [7, 4], stars: [[-3, 2], [1, -2], [5, 2]], blocks: [[0, -0.5, 2, 6]], hint: 'A V shape is an absolute value graph: y = |x − h| + k has its point at (h, k).' },
    { name: 'Wave', x0: -9, flag: [9, 0.82], stars: [[-4.712, 2], [1.571, 2], [4.712, -2]], hint: 'Stars go up to 2 and down to −2. Try a sine wave with amplitude 2.' },
    { name: 'Long wave', x0: -9, flag: [9, -0.63], stars: [[-6.283, -3], [0, 3], [6.283, -3]], blocks: [[-3.6, -6, -2.6, -1.3], [2.6, -6, 3.6, -1.3]], hint: 'Starts at its top at x = 0, so think cosine. The wave is 3 tall and takes 4π to repeat: y = 3cos(x/2)?' },
    { name: 'Blast off', x0: -9, flag: [3, 5], stars: [[-2, -2.75], [1, -1], [2, 1]], blocks: [[-6, -1.6, 0, 0]], hint: 'Flat on the left, then it shoots up. Exponential! Try y = 2^x plus or minus something.' },
    { name: 'Twisty', x0: -4.9, flag: [4.9, 5.88], stars: [[-4, -3.2], [0, 0], [4, 3.2]], blocks: [[1.6, 1, 2.4, 2.6], [-2.4, -2.6, -1.6, -1]], hint: 'A straight line hits the blocks. A cubic, y = a·x³, bends around them.' },
    { name: 'Root route', x0: -9, flag: [7, 4], stars: [[-8, 1], [-5, 2], [0, 3]], blocks: [[-9, 1.8, -7, 6]], hint: 'Rises fast, then levels off: a square root. y = √(x + 9) starts at (−9, 0).' },
    { name: 'Grand finale', x0: -7, flag: [7, 5.17], stars: [[-6, 3], [0, -3], [6, 3]], blocks: [[-1, -1, 1, 6]], hint: 'More than one function works here. A parabola with its vertex at (0, −3) is one idea.' },
  ];

  const HOW = ['Type an equation for <b>y</b> in terms of <b>x</b>, then press <b>Ride!</b>', 'Your sled rides the graph from the start line to the flag.', 'Grab all 3 stars and steer around the red blocks.'];
  const rideBtn = { x: 608, y: 10, w: 92, h: 46, label: 'Ride!', size: 20, color: GOLD };
  const hintBtn = { x: 562, y: 551, w: 64, h: 40, label: 'Hint', size: 15, color: '#39405a', textColor: '#e6eaf8' };
  const levelsBtn = { x: 632, y: 551, w: 70, h: 40, label: 'Levels', size: 15, color: '#39405a', textColor: '#e6eaf8' };

  const K = window.K = MA.game({
    slug: 'function-rider', title: 'Function Rider', accent: CYAN, accent2: GOLD, bg: ['#0a1430', '#170b2e'], w: W, h: H,
    tagline: 'Type an equation and ride its graph to the flag.', how: HOW,
    noMenu: true, update: step, draw,
    down(x, y) {
      if (K.state !== 'play') return;
      if (K.hit(rideBtn, x, y)) go();
      else if (K.hit(hintBtn, x, y)) { K.sfx.click(); setMsg('Hint: ' + lvl.hint); }
      else if (K.hit(levelsBtn, x, y)) menu();
    },
    key(k, e) {
      // Typing anywhere goes to the equation box.
      if (K.state === 'play' && document.activeElement !== inp && (k.length === 1 || k === 'Backspace') && !e.ctrlKey && !e.metaKey) inp.focus();
      if (K.state === 'play' && k === 'Enter') go();
    },
  });

  // ---------- the equation box (a real input, so phone keyboards work)
  const box = document.createElement('label');
  box.className = 'fr-eq';
  box.innerHTML = '<span>y =</span><input id="eq" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="type an equation, like 2x + 1">';
  K.stage.appendChild(box);
  const inp = box.querySelector('input');
  const fitBox = () => { box.style.fontSize = parseFloat(K.stage.style.width) / W * 16 + 'px'; };
  addEventListener('resize', fitBox); fitBox();
  inp.addEventListener('input', () => { if (!ride || ride.done) { ride = null; compile(); } });
  // Keep keys typed into the box away from the game's own key handling (which would block spaces and arrows).
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); go(); } });

  // ---------- progress (older saves used a different key)
  let save = K.load('save', null);
  if (!save) { try { save = JSON.parse(localStorage.getItem('ma-functionrider')); } catch (e) {} }
  if (!save || !save.stars) save = { stars: {} };
  const store = () => K.save('save', save);
  const unlocked = () => { let n = 1; while (n < LEVELS.length && save.stars[n] !== undefined) n++; return n; };

  let li = 0, lvl = LEVELS[0], f = null, ride = null, got = [], eqs = {}, msg = '', msgErr = false;

  function load(i) {
    li = i; lvl = LEVELS[i]; ride = null; got = [];
    inp.value = eqs[i] || ''; compile();
    if (!inp.value.trim()) setMsg('Grab the 3 stars and reach the flag. Start x = ' + fmt(lvl.x0) + '.');
    K.state = 'play'; K.hideOverlay();
    if (matchMedia('(pointer: fine)').matches) inp.focus({ preventScroll: true });
  }
  const fmt = v => String(v).replace('-', '−');
  function setMsg(t, err) { msg = t; msgErr = !!err; box.classList.toggle('err', !!err && !ride); }
  function compile() {
    const src = inp.value; eqs[li] = src;
    if (!src.trim()) { f = null; setMsg('Grab the 3 stars and reach the flag. Start x = ' + fmt(lvl.x0) + '.'); return; }
    try { f = parse(src); setMsg('Press Ride! (or Enter) when you\'re ready.'); }
    catch (e) { f = null; if (e) setMsg(String(e), true); }
  }

  const val = x => { const y = f(x); return typeof y === 'number' ? y : NaN; };
  function go() {
    if (K.state !== 'play' || (ride && !ride.done)) return;
    compile();
    if (!f) { if (!inp.value.trim()) setMsg('Type an equation first.', true); K.sfx.bad(); return; }
    got = [];
    const y0 = val(lvl.x0);
    if (!isFinite(y0)) { setMsg(`Your graph doesn't exist at the start, x = ${fmt(lvl.x0)}.`, true); K.sfx.bad(); return; }
    ride = { x: lvl.x0, y: y0, done: false, trail: [] };
    if (!matchMedia('(pointer: fine)').matches) inp.blur(); // drop the phone keyboard so the ride is visible
    setMsg('Riding…'); K.sfx.whoosh();
  }
  function crash(m) {
    ride.done = true; ride.crashed = true;
    K.burst(sx(ride.x), K.clamp(sy(ride.y), GY + 10, GY + GH - 10), RED, 30, 280, 5); K.shake(10); K.sfx.boom();
    setMsg(m, true);
  }
  function finish() {
    ride.done = true;
    const n = got.length, prev = save.stars[li + 1] || 0;
    save.stars[li + 1] = Math.max(prev, n); store();
    const fx = sx(lvl.flag[0]), fy = sy(lvl.flag[1]);
    [GOLD, GREEN, CYAN, '#ff6bd6'].forEach(c => K.burst(fx, fy, c, 14, 300, 5));
    K.sfx.win(); K.state = 'over';
    const at = li;
    setTimeout(() => { if (K.state === 'over' && li === at) showWin(n); }, 800);
  }
  const inBlock = (x, y) => (lvl.blocks || []).some(([x1, y1, x2, y2]) => x > x1 - .08 && x < x2 + .08 && y > y1 - .08 && y < y2 + .08);

  function step(dt) {
    if (!ride || ride.done) return;
    const SPEED = 7.5; // units per second along the curve
    let left = SPEED * dt;
    for (let k = 0; k < 40 && left > 0; k++) {
      const h = 1e-3, slope = (val(ride.x + h) - val(ride.x - h)) / (2 * h);
      let dx = Math.min(left / Math.sqrt(1 + (isFinite(slope) ? slope * slope : 1e6)), .05);
      if (dx < 1e-4) dx = 1e-4;
      const nx = Math.min(ride.x + dx, lvl.flag[0]), ny = val(nx);
      left -= Math.hypot(nx - ride.x, ny - ride.y);
      ride.x = nx;
      if (!isFinite(ny)) return crash(`Your graph has a gap at x ≈ ${ride.x.toFixed(1)}. Watch out for square roots of negatives and dividing by zero.`);
      ride.y = ny;
      if (Math.abs(ny) > 6.6) return crash(`Your sled flew off the screen near x = ${fmt(+ride.x.toFixed(1))}. Your graph goes too ${ny > 0 ? 'high' : 'low'} there.`);
      if (inBlock(nx, ny)) return crash('Crash! Your graph runs into a block. Change your equation to go around it.');
      lvl.stars.forEach((s, i) => {
        if (!got.includes(i) && Math.hypot(s[0] - nx, s[1] - ny) < .5) {
          got.push(i); K.burst(sx(s[0]), sy(s[1]), GOLD, 20, 240, 4); K.float(sx(s[0]), sy(s[1]) - 26, `★ ${got.length}/3`, GOLD, 20); K.sfx.note(660 + got.length * 160, 0.18);
        }
      });
      if (nx >= lvl.flag[0]) {
        if (Math.abs(ny - lvl.flag[1]) < .55) return finish();
        return crash(`Missed the flag. At x = ${fmt(lvl.flag[0])} your graph is at y = ${fmt(+ny.toFixed(2))}, but the flag is at y = ${fmt(lvl.flag[1])}.`);
      }
    }
    ride.trail.push([sx(ride.x), sy(ride.y)]); if (ride.trail.length > 24) ride.trail.shift();
  }

  // ---------- drawing
  function drawGrid(c) {
    c.fillStyle = 'rgba(5,8,22,.72)'; c.fillRect(0, GY, W, GH);
    for (let x = -10; x <= 10; x++) { c.fillStyle = x % 2 ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.09)'; c.fillRect(sx(x), GY, 1, GH); }
    for (let y = -6; y <= 6; y++) { c.fillStyle = y % 2 ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.09)'; c.fillRect(0, sy(y), W, 1); }
    c.fillStyle = 'rgba(190,205,255,.5)'; c.fillRect(0, sy(0) - 1, W, 2); c.fillRect(sx(0) - 1, GY, 2, GH);
    for (let x = -8; x <= 8; x += 2) if (x) K.text(fmt(x), sx(x), sy(0) + 12, 11, 'rgba(200,212,245,.6)', { weight: 600, c });
    for (let y = -4; y <= 4; y += 2) if (y) K.text(fmt(y), sx(0) - 8, sy(y), 11, 'rgba(200,212,245,.6)', { weight: 600, c, align: 'right' });
    c.fillStyle = 'rgba(79,209,255,.35)'; c.fillRect(0, GY, W, 1); c.fillRect(0, GY + GH - 1, W, 1);
  }
  // Samples the graph between two x values; returns pieces split wherever it's undefined or way off screen.
  function pieces(x0, x1, dx) {
    const out = []; let cur = null;
    for (let x = x0; x <= x1 + 1e-9; x += dx) {
      const y = val(x);
      if (!isFinite(y) || Math.abs(y) > 50) { cur = null; continue; }
      if (!cur) out.push(cur = []);
      cur.push([sx(x), sy(y)]);
    }
    return out.filter(p => p.length > 1);
  }
  function drawCurve(c) {
    if (!f) return;
    c.save(); c.beginPath(); c.rect(0, GY, W, GH); c.clip();
    c.setLineDash([9, 8]); c.strokeStyle = 'rgba(79,209,255,.4)'; c.lineWidth = 2.5;
    for (const p of pieces(XMIN, XMIN + W / U, 2 / U)) { c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); }
    c.setLineDash([]);
    // The part the sled will ride, drawn solid and glowing.
    for (const p of pieces(lvl.x0, lvl.flag[0], .05)) K.glowLine(c, p, CYAN, 4, 16);
    c.restore();
  }
  function starPath(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    c.closePath();
  }
  function drawStar(c, x, y, r, on = true) {
    c.save();
    starPath(c, x, y, r);
    if (on) {
      c.shadowColor = GOLD; c.shadowBlur = r * 1.3;
      const g = c.createRadialGradient(x - r * .3, y - r * .4, r * .1, x, y, r);
      g.addColorStop(0, '#fff6c8'); g.addColorStop(.5, GOLD); g.addColorStop(1, '#d98a00');
      c.fillStyle = g;
    } else c.fillStyle = 'rgba(255,255,255,.14)';
    c.fill(); c.restore();
  }
  function drawSled(c) {
    const h = 1e-3, sl = (val(ride.x + h) - val(ride.x - h)) / (2 * h), a = -Math.atan(isFinite(sl) ? sl : 0);
    c.save(); c.translate(sx(ride.x), sy(ride.y)); c.rotate(a);
    c.shadowColor = RED; c.shadowBlur = 14;
    const g = c.createLinearGradient(0, -10, 0, -2); g.addColorStop(0, '#ff8aa0'); g.addColorStop(1, '#d92b4a');
    c.fillStyle = g; K.rr(c, -16, -10, 32, 8, 3); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#e6eaf8'; c.lineWidth = 2.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-17, -1); c.lineTo(14, -1); c.quadraticCurveTo(20, -1, 19, -8); c.stroke();
    const b = c.createLinearGradient(0, -23, 0, -10); b.addColorStop(0, '#8fe4ff'); b.addColorStop(1, '#2a8fd6');
    c.fillStyle = b; K.rr(c, -6, -23, 12, 14, 4); c.fill();
    K.orb(c, 0, -28, 6, '#ffd7a8', { glow: 0 });
    c.fillStyle = GOLD; K.rr(c, -6.5, -36, 13, 5, 2.5); c.fill();
    c.restore();
  }
  function wrap(c, s, maxW) {
    for (const size of [15, 13.5, 12]) {
      c.font = K.font(size, 600);
      const lines = []; let line = '';
      for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
      lines.push(line);
      if (lines.length <= 2 || size === 12) return { lines: lines.slice(0, 3), size };
    }
  }

  function draw(c, t) {
    drawGrid(c);
    // blocks
    for (const [x1, y1, x2, y2] of (lvl.blocks || [])) {
      const X = sx(x1), Y = sy(y2), w = (x2 - x1) * U, h = (y2 - y1) * U;
      K.tile(c, X, Y, w, h, RED, { r: 6, depth: 3, glow: 14 });
      c.save(); K.rr(c, X, Y, w, h, 6); c.clip(); c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 6;
      for (let k = -h; k < w; k += 18) { c.beginPath(); c.moveTo(X + k, Y + h); c.lineTo(X + k + h, Y); c.stroke(); }
      c.restore();
    }
    // start line
    c.save(); c.setLineDash([6, 6]); c.strokeStyle = 'rgba(62,230,160,.7)'; c.shadowColor = GREEN; c.shadowBlur = 8; c.lineWidth = 2;
    c.beginPath(); c.moveTo(sx(lvl.x0), GY); c.lineTo(sx(lvl.x0), GY + GH); c.stroke(); c.restore();
    K.text('START', sx(lvl.x0) + 6, GY + 12, 11, GREEN, { weight: 800, align: 'left', glow: 8 });
    drawCurve(c);
    // stars
    lvl.stars.forEach((s, i) => { if (!got.includes(i)) drawStar(c, sx(s[0]), sy(s[1]), 14 + Math.sin(t * 4 + i) * 1.5); });
    // flag (near the top, it hangs below its point)
    const fx = sx(lvl.flag[0]), fy = sy(lvl.flag[1]), d = fy < GY + 48 ? 1 : -1;
    c.strokeStyle = 'rgba(230,236,255,.85)'; c.lineWidth = 3; c.beginPath(); c.moveTo(fx, fy - 10 * d); c.lineTo(fx, fy + 34 * d); c.stroke();
    c.save(); c.shadowColor = GREEN; c.shadowBlur = 14; c.fillStyle = GREEN;
    c.beginPath(); c.moveTo(fx, fy + 34 * d); c.lineTo(fx + 24 + Math.sin(t * 6) * 2, fy + 26 * d); c.lineTo(fx, fy + 18 * d); c.fill(); c.restore();
    K.orb(c, fx, fy, 6, GREEN, { glow: 12 });
    // sled
    if (ride && !ride.crashed) {
      c.save(); c.shadowColor = GOLD; c.shadowBlur = 10;
      ride.trail.forEach(([x, y], i) => { c.globalAlpha = i / ride.trail.length * .7; c.fillStyle = GOLD; c.beginPath(); c.arc(x, y, 2 + i / ride.trail.length * 2.5, 0, 7); c.fill(); });
      c.restore();
      drawSled(c);
    }

    // top HUD
    K.chip(10, 9, `Level ${li + 1} / ${LEVELS.length}`, lvl.name, '#fff', { w: 172, h: 48, size: 17 });
    rideBtn.disabled = !!(ride && !ride.done);
    K.button(rideBtn);
    K.panel(c, 708, 9, 82, 48, { r: 12 });
    K.text('STARS', 749, 22, 10, 'rgba(210,218,245,.65)', { weight: 700 });
    for (let i = 0; i < 3; i++) drawStar(c, 727 + i * 22, 41, 8.5, i < got.length);
    // bottom bar: messages and hints
    K.panel(c, 10, 551, 544, 40, { r: 12, stroke: msgErr ? 'rgba(255,93,115,.55)' : undefined });
    const m = wrap(c, msg, 516);
    const lh = m.size + 3, top = 571 - (m.lines.length - 1) * lh / 2;
    m.lines.forEach((l, i) => K.text(l, 24, top + i * lh, m.size, msgErr ? '#ff9aa8' : '#c9d0ea', { weight: 600, align: 'left' }));
    K.button(hintBtn); K.button(levelsBtn);
  }

  // ---------- menus
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  function menu() {
    K.state = 'menu'; inp.blur();
    const n = unlocked(), stars = LEVELS.map((L, i) => save.stars[i + 1] || 0), total = stars.reduce((a, b) => a + b, 0);
    K.overlay({
      kicker: 'MathAdvice', title: 'Function Rider',
      sub: 'Type an equation and ride its graph to the flag.',
      how: HOW,
      html: `<p class="ma-best">★ ${total} / ${LEVELS.length * 3} stars</p>`,
      levels: { n: LEVELS.length, unlocked: n - 1, stars, on: load },
      buttons: [{ label: n > 1 ? 'Continue: level ' + n : 'Start', on: () => load(n - 1) }],
    });
  }
  function showWin(n) {
    const lastLevel = li === LEVELS.length - 1, b = [];
    if (!lastLevel) b.push({ label: 'Next level', on: () => load(li + 1) });
    if (n < 3) b.push({ label: 'Try for 3 stars', ghost: !lastLevel, on: () => load(li) });
    b.push({ label: lastLevel ? 'All levels' : 'Levels', ghost: true, on: menu });
    K.overlay({
      kicker: `Level ${li + 1}`, title: lastLevel ? 'You did them all!' : 'Level complete!',
      sub: `Your equation: <b>y = ${esc(inp.value.trim())}</b>${n < 3 ? '<br>Can you find one that grabs all 3 stars?' : ''}`,
      html: `<div style="font-size:2.4em;letter-spacing:.15em;color:${GOLD};text-shadow:0 0 .4em rgba(255,204,51,.6)">${'★'.repeat(n)}<span style="opacity:.2">${'★'.repeat(3 - n)}</span></div>`,
      buttons: b,
    });
  }

  load(Math.min(unlocked() - 1, LEVELS.length - 1)); K.state = 'menu';
  const ready = () => menu();
  document.fonts ? document.fonts.load('700 16px Lexend').then(ready, ready) : ready();
  // For automated testing.
  window.__fr = { parse, LEVELS, load, go, get ride() { return ride; }, get got() { return got; }, get msg() { return msg; }, setEq: s => { inp.value = s; compile(); }, sim: () => { let k = 0; while (ride && !ride.done && k++ < 20000) step(1 / 60); return { done: ride && ride.done, crashed: ride && !!ride.crashed, got: got.length, msg }; } };
})();
</script>
</body>
</html>

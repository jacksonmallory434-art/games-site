<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Grid Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Grid Snake — a MathAdvice original.
const N = 20, CELL = 24, HUD = 60, W = N * CELL, H = N * CELL + HUD;
const c = document.getElementById('c'), ctx = c.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), d = devicePixelRatio || 1;
  c.style.width = W * s + 'px'; c.style.height = H * s + 'px';
  c.width = W * s * d; c.height = H * s * d;
  ctx.setTransform(s * d, 0, 0, s * d, 0, 0);
}
addEventListener('resize', fit); fit();

const KEY = 'ma-gridsnake-best';
const getBest = () => { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } };
const setBest = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };

let snake, dir, queue, food, bonus, score, best = getBest(), state, tickMs, acc, eaten;
function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 }; queue = []; score = 0; tickMs = 140; acc = 0; eaten = 0;
  bonus = null; placeFood(); state = 'ready';
}
function freeCell() {
  while (true) {
    const p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    if (!snake.some(s => s.x === p.x && s.y === p.y) && !(food && food.x === p.x && food.y === p.y)) return p;
  }
}
function placeFood() { food = null; food = freeCell(); }
reset();

const DIRS = {
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0]
};
function turn(dx, dy) {
  if (state === 'over') return;
  if (state === 'ready') state = 'play';
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (dx === -lastDir.x && dy === -lastDir.y) return; // no reversing into yourself
  if (dx === lastDir.x && dy === lastDir.y) return;
  if (queue.length < 3) queue.push({ x: dx, y: dy });
}
addEventListener('keydown', e => {
  if (DIRS[e.code]) { e.preventDefault(); turn(...DIRS[e.code]); }
  else if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') { e.preventDefault(); if (state === 'over') reset(); else state = 'play'; }
});
let touchStart = null;
c.addEventListener('pointerdown', e => {
  touchStart = { x: e.clientX, y: e.clientY };
  if (state === 'over') reset();
});
c.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state === 'ready') state = 'play'; return; }
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});

function step() {
  if (queue.length) dir = queue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  // Walls end the game.
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
  // Hitting yourself ends the game (the tail moves out of the way first).
  const willGrow = (head.x === food.x && head.y === food.y) || (bonus && head.x === bonus.x && head.y === bonus.y);
  const body = willGrow ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return die();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 1; eaten++;
    tickMs = Math.max(65, 140 - eaten * 3);
    placeFood();
    if (!bonus && eaten % 5 === 0) bonus = { ...freeCell(), life: 40 };
  } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
    score += 5; bonus = null;
  } else {
    snake.pop();
  }
  if (bonus && --bonus.life <= 0) bonus = null;
}
function die() {
  state = 'over';
  if (score > best) { best = score; setBest(best); }
}

function draw() {
  ctx.fillStyle = '#1c1e29'; ctx.fillRect(0, 0, W, H);
  // HUD
  ctx.fillStyle = '#ecedf3'; ctx.font = '800 26px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Score ' + score, 16, 40);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9a9db0'; ctx.fillText('Best ' + best, W - 16, 40);
  // Graph paper board
  ctx.save(); ctx.translate(0, HUD);
  ctx.fillStyle = '#f7f5ee'; ctx.fillRect(0, 0, W, W);
  ctx.strokeStyle = '#d6e4f0'; ctx.lineWidth = 1;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, W); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
  }
  // Food: a little "+1"
  ctx.fillStyle = '#e8505b';
  ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('+1', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 4);
  // Bonus: a blinking "+5" star
  if (bonus && (bonus.life > 12 || bonus.life % 2)) {
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath(); ctx.arc(bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2, CELL * 0.46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b2d3a'; ctx.fillText('+5', bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2 + 4);
  }
  // Snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2f6fd6' : (i % 2 ? '#4a8cf0' : '#5b98f2');
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath(); ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6); ctx.fill();
  });
  // Eyes
  const h = snake[0], ex = h.x * CELL + CELL / 2, ey = h.y * CELL + CELL / 2;
  ctx.fillStyle = '#fff';
  const px = dir.y !== 0 ? 5 : 0, py = dir.x !== 0 ? 5 : 0;
  ctx.beginPath(); ctx.arc(ex + dir.x * 5 + px, ey + dir.y * 5 + py, 3, 0, 7); ctx.arc(ex + dir.x * 5 - px, ey + dir.y * 5 - py, 3, 0, 7); ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  if (state === 'ready') overlay('Grid Snake', 'Arrow keys / WASD, or swipe', 'Press any arrow to start');
  if (state === 'over') overlay('Game over', 'Score ' + score + '   Best ' + best, 'Tap or press Space to play again');
}
function overlay(a, b, cText) {
  ctx.fillStyle = 'rgba(18,19,26,.72)'; ctx.fillRect(0, HUD, W, W);
  ctx.fillStyle = '#ffcc33'; ctx.font = '800 40px system-ui, sans-serif'; ctx.fillText(a, W / 2, HUD + W / 2 - 30);
  ctx.fillStyle = '#fff'; ctx.font = '600 20px system-ui, sans-serif'; ctx.fillText(b, W / 2, HUD + W / 2 + 12);
  ctx.fillStyle = '#c8cad6'; ctx.font = '500 17px system-ui, sans-serif'; ctx.fillText(cText, W / 2, HUD + W / 2 + 46);
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(t - last, 250); last = t;
  if (state === 'play') { acc += dt; while (acc >= tickMs && state === 'play') { acc -= tickMs; step(); } }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

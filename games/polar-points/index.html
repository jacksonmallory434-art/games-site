<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Polar Points</title>
</head>
<body>
<script src="../../js/mathquiz.js"></script>
<script>
// Polar Points — a MathAdvice original. AP Precalculus topics 3.13–3.14.
MathQuiz({ key: 'polarpoints', title: 'Polar Points',
  intro: ['Points in polar form: (r, θ) means go out r at angle θ.', 'Read the polar grid, then convert between polar and rectangular coordinates.'],
  css: '.mq-board svg { max-width: 250px; } .mq-answers button { font-size: 1.15rem; }',
  gen(level) {
    const { rnd, pick, choices, neg, pi } = MQ;
    const STD = [0, 2, 3, 4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 21, 22]; // twelfths of π
    const norm = k => ((k % 24) + 24) % 24;
    const P = (r, k) => `(${neg(r)}, ${pi(k, 12)})`;
    const xy = (r, k) => [r * Math.cos(k * Math.PI / 12), r * Math.sin(k * Math.PI / 12)];
    const same = (a, b) => { const [x1, y1] = xy(...a), [x2, y2] = xy(...b); return Math.abs(x1 - x2) < 1e-9 && Math.abs(y1 - y2) < 1e-9; };
    // An exact coordinate like 2√3 or −3.
    const exact = v => {
      if (Math.abs(v) < 1e-9) return '0';
      for (const s of [1, 2, 3]) { const c = v / Math.sqrt(s); if (Math.abs(c - Math.round(c)) < 1e-9) { const n = Math.round(c); return s === 1 ? neg(n) : (n < 0 ? '−' : '') + (Math.abs(n) === 1 ? '' : Math.abs(n)) + '√' + s; } }
      return v.toFixed(2);
    };
    const R = (r, k) => { const [x, y] = xy(r, k); return `(${exact(x)}, ${exact(y)})`; };

    const types = ['graph'];
    if (level >= 1) types.push('toRect', 'graph', 'toRect');
    if (level >= 2) types.push('toPolar', 'toPolar');
    if (level >= 3) types.push('same', 'same');
    const type = pick(types);

    if (type === 'graph') {
      const ks = level === 0 ? [0, 3, 6, 9, 12, 15, 18, 21] : STD;
      const r = rnd(1, 4), k = pick(ks);
      const C = 120, S = 26;
      let g = '';
      for (let i = 1; i <= 4; i++) g += `<circle cx="${C}" cy="${C}" r="${i * S}" fill="none" stroke="${i === 4 ? '#b9c6dd' : '#d6e4f0'}" stroke-width="1.2"/>`;
      for (const a of ks) { const t = a * Math.PI / 12; g += `<line x1="${C}" y1="${C}" x2="${C + 4.4 * S * Math.cos(t)}" y2="${C - 4.4 * S * Math.sin(t)}" stroke="#d6e4f0" stroke-width="1.2"/>`; }
      g += `<line x1="6" y1="${C}" x2="234" y2="${C}" stroke="#6b6f85" stroke-width="1.5"/><line x1="${C}" y1="6" x2="${C}" y2="234" stroke="#6b6f85" stroke-width="1.5"/>`;
      for (let i = 1; i <= 4; i++) g += `<text x="${C + i * S - 3}" y="${C + 13}" font-size="11" text-anchor="end" fill="#2b2d3a">${i}</text>`;
      const [x, y] = xy(r, k);
      g += `<circle cx="${C + x * S}" cy="${C - y * S}" r="7" fill="#e8505b" stroke="#fff" stroke-width="2"/>`;
      const key = (rr, kk) => rr + '|' + norm(kk);
      const ans = key(r, k);
      const wrong = [[r, 24 - k], [r + 1, k], [r, k + (level ? 2 : 3)], [r - 1, k], [r, 12 - k], [r, k + 6]].filter(([rr]) => rr > 0 && rr <= 5).map(w => key(...w));
      return { board: `<svg viewBox="0 0 240 240">${g}</svg>`, q: 'What are the <em>polar coordinates</em> of the point?', answer: ans,
        options: choices(ans, wrong, () => key(rnd(1, 4), pick(ks))).map(v => { const [rr, kk] = v.split('|').map(Number); return { value: v, label: P(rr, kk) }; }),
        hint: 'r is how many rings out the point is. θ is the angle measured counterclockwise from the positive x-axis. Rays are every ' + (level ? 'π/6 and π/4.' : 'π/4.') };
    }
    if (type === 'toRect') {
      const r = pick([2, 4, 6]), k = pick(STD.filter(k => level >= 2 || k <= 12));
      const ans = R(r, k), [x, y] = xy(r, k);
      const wrong = [`(${exact(y)}, ${exact(x)})`, `(${exact(-x)}, ${exact(y)})`, `(${exact(x)}, ${exact(-y)})`, R(r, k + 2), R(r, k - 2), `(${r}, ${exact(y)})`];
      return { board: `<div class="big">${P(r, k)}</div>`, q: 'Which <em>rectangular</em> point (x, y) is this?', answer: ans,
        options: choices(ans, wrong, () => R(r, pick(STD))).map(v => ({ value: v, label: v })),
        hint: 'x = r·cos θ and y = r·sin θ.' };
    }
    if (type === 'toPolar') {
      const r = pick([2, 4, 6]), k = pick(STD);
      const key = (rr, kk) => rr + '|' + norm(kk), ans = key(r, k);
      const wrong = [[r, k + 12], [r, 12 - k], [r, 6 - k], [r, k + 6], [r * r, k], [r, -k]].map(w => key(...w)).filter(w => w !== ans);
      return { board: `<div class="big">${R(r, k)}</div>`, q: 'Which <em>polar</em> point (r, θ) is this, with r &gt; 0 and 0 ≤ θ &lt; 2π?', answer: ans,
        options: choices(ans, wrong).map(v => { const [rr, kk] = v.split('|').map(Number); return { value: v, label: P(rr, kk) }; }),
        hint: 'r = √(x² + y²). For θ, find the reference angle, then check which quadrant (x, y) is in.' };
    }
    // Same point, different name
    const r = rnd(1, 5), k = pick(STD), target = [r, k];
    const right = pick([[-r, norm(k + 12)], [r, k - 24], [r, k + 24], [-r, k - 12]]);
    const wrong = [[-r, k], [r, k + 12], [-r, 24 - k], [r, -k], [-r, k + 6], [r, k + 6]].filter(w => !same(w, target));
    const key = ([rr, kk]) => rr + '|' + kk, ans = key(right);
    return { board: `<div class="big">${P(r, k)}</div>`, q: 'Which polar point is the <em>same point</em>?', answer: ans,
      options: choices(ans, wrong.map(key)).map(v => { const [rr, kk] = v.split('|').map(Number); return { value: v, label: P(rr, kk) }; }),
      hint: 'Adding 2π to θ lands in the same spot. A negative r means go the opposite direction, so (−r, θ + π) is the same point as (r, θ).' };
  } });
</script>
<script src="../../js/skin.js"></script>
</body>
</html>

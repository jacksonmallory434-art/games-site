<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle Shot</title>
<script src="../_kit/kit.js"></script>
<style>
.ma-lv { grid-template-columns: repeat(7, 1fr); max-width: 24em; gap: .4em; margin-top: .6em; }
.ma-lv button { aspect-ratio: auto; padding: .4em 0 .15em; }
.ma-card { padding-top: 1.2em; padding-bottom: 1.1em; }
.ma-card h1 { font-size: 2.2em; }
.ma-best { margin: .5em 0 0; }
@media (max-width: 600px), (max-height: 480px) { .ma-how { display: none; } }
</style>
</head>
<body>
<script>
// Angle Shot — a MathAdvice original.
// Set the launch angle and power to hit every target. Walls, wind, and moving targets come later.
(() => {
  const W = 800, H = 450, GROUND = 400, CX = 70, CY = 382, G = 520, BALL = 7;
  const GOLD = '#ffcc33', CYAN = '#4fd1ff', RED = '#ff4d6a';

  // Levels: targets {x, y, r, bob}, walls [x, y, w, h], wind (px/s² to the right), and a tip.
  const LEVELS = [
    { t: [{ x: 430, y: GROUND - 18 }], tip: 'Drag to aim. The angle and power show at the top. Let go to fire.' },
    { t: [{ x: 660, y: GROUND - 18 }], tip: 'Farther away: more power, or an angle closer to 45°.' },
    { t: [{ x: 540, y: GROUND - 18 }], w: [[300, 280, 34, 120]], tip: 'Go over the wall.' },
    { t: [{ x: 400, y: GROUND - 18 }], w: [[230, 170, 34, 230]], tip: 'A tall wall up close needs a steep angle, maybe 70° or more.' },
    { t: [{ x: 600, y: 222 }], w: [[560, 240, 80, 160]], tip: 'The target is on top of a tower.' },
    { t: [{ x: 360, y: GROUND - 18 }, { x: 690, y: GROUND - 18 }], tip: 'Two targets. Fun fact: with the same power, 30° and 60° land in almost the same spot. So do any two angles that add up to 90°.' },
    { t: [{ x: 700, y: GROUND - 18 }], w: [[260, 0, 420, 200]], tip: 'A ceiling! Keep it low.' },
    { t: [{ x: 600, y: GROUND - 18 }], wind: -90, tip: 'Wind is blowing against you. Watch the flag.' },
    { t: [{ x: 620, y: 230, bob: 70 }], tip: 'This target moves up and down. Time your shot.' },
    { t: [{ x: 520, y: 170 }, { x: 700, y: GROUND - 18 }], w: [[480, 190, 80, 210]], wind: 60, tip: 'A tailwind pushes your shots farther.' },
    { t: [{ x: 300, y: GROUND - 18 }, { x: 470, y: 140, bob: 40 }, { x: 720, y: GROUND - 18 }], w: [[380, 250, 30, 150]], tip: 'Three targets, one moving.' },
    { t: [{ x: 680, y: GROUND - 18 }], w: [[420, 0, 36, 210], [420, 290, 36, 110]], tip: 'Thread the gap in the wall.' },
    { t: [{ x: 360, y: 110 }, { x: 660, y: 255, bob: 45 }], w: [[300, 130, 120, 24], [600, 330, 120, 70]], wind: -50, tip: 'Hard mode: wind, a high target, and a moving one.' },
    { t: [{ x: 740, y: GROUND - 18 }, { x: 560, y: 90 }], w: [[200, 140, 30, 260], [470, 0, 30, 120], [470, 220, 30, 180]], wind: 40, tip: 'The final challenge.' },
  ];

  let lv = 0, L = LEVELS[0], targets = [], walls = [], wind = 0, angle = 45, power = 60, shots = 0, maxShots = 3;
  let ball = null, trail = [], lastTrail = [], aiming = false;
  const HOW = ['Drag anywhere: direction sets the <b>angle</b>, distance the <b>power</b>.', 'Let go to fire. Hit every target; fewer shots earn more stars.', 'Keys: ↑ ↓ angle, ← → power, Space fires.'];
  const levelsBtn = { x: 712, y: 10, w: 76, h: 44, label: 'Levels', size: 15, color: '#39405a', textColor: '#e6eaf8' };

  const K = window.K = MA.game({
    slug: 'angle-shot', title: 'Angle Shot', accent: GOLD, accent2: RED, bg: ['#0c1638', '#1d0f36'], w: W, h: H,
    tagline: 'Set the angle and power, then fire. Hit every target before your shots run out.',
    how: HOW,
    noMenu: true, update, draw,
    down(x, y) {
      if (K.state !== 'play') return;
      if (K.hit(levelsBtn, x, y)) { aiming = false; return menu(); }
      if (ball) return;
      aiming = true; aimAt(x, y);
    },
    move(x, y) { if (aiming) aimAt(x, y); },
    up() { if (aiming) { aiming = false; fire(); } },
    key(k) { if (K.state === 'play' && (k === ' ' || k === 'Enter')) fire(); },
  });

  // Progress: stars per level. Older saves only kept the highest level reached.
  const saved = K.load('stars', []);
  let oldLevel = 1;
  try { oldLevel = +localStorage.getItem('ma-angleshot-level') || 1; } catch (e) {}
  const unlocked = () => Math.min(LEVELS.length - 1, Math.max(saved.filter(Boolean).length, oldLevel - 1));

  function menu() {
    K.state = 'menu';
    const n = unlocked(), total = saved.reduce((a, s) => a + (s || 0), 0);
    K.overlay({
      kicker: 'MathAdvice', title: 'Angle Shot',
      how: HOW,
      html: `<p class="ma-best">★ ${total} / ${LEVELS.length * 3} stars</p>`,
      levels: { n: LEVELS.length, unlocked: n, stars: saved, on: startLevel },
      buttons: [{ label: n > 0 ? `Continue: level ${n + 1}` : 'Play', on: () => startLevel(n) }],
    });
  }
  const ready = () => menu();
  document.fonts ? document.fonts.load('700 16px Lexend').then(ready, ready) : ready();

  function startLevel(n) {
    lv = n; L = LEVELS[n];
    targets = L.t.map(t => ({ ...t, r: t.r || 18, hit: false, by: t.y }));
    walls = (L.w || []).map(w => ({ x: w[0], y: w[1], w: w[2], h: w[3] }));
    wind = L.wind || 0; shots = 0; maxShots = targets.length + 2; ball = null; trail = []; lastTrail = []; aiming = false;
    K.state = 'play';
  }
  const speed = () => 230 + power * 6.2;
  function aimAt(x, y) {
    const dx = x - CX, dy = CY - y;
    angle = K.clamp(Math.atan2(Math.max(dy, 0.01), Math.max(dx, 0.01)) * 180 / Math.PI, 1, 89);
    power = K.clamp(Math.hypot(dx, dy) / 5.2, 5, 100);
  }
  function fire() {
    if (K.state !== 'play' || ball || shots >= maxShots) return;
    const a = angle * Math.PI / 180, v = speed();
    ball = { x: CX + Math.cos(a) * 48, y: CY - Math.sin(a) * 48, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, ang: angle };
    shots++; trail = [];
    K.burst(ball.x, ball.y, '#ffd27a', 14, 180, 3, false);
    K.sfx.whoosh(); K.sfx.pop(); K.shake(3);
  }

  function endShot(x, y) {
    lastTrail = trail; ball = null;
    if (!targets.every(t => t.hit)) trail = [];
    if (targets.every(t => t.hit)) return win();
    if (shots >= maxShots) return lose();
    const left = maxShots - shots;
    K.float(K.clamp(x, 60, W - 60), K.clamp(y - 24, 90, GROUND - 20), `Miss · ${left} left`, '#ff8aa0', 18);
  }
  function win() {
    ball = null; K.state = 'over';
    const st = shots <= targets.length ? 3 : shots === targets.length + 1 ? 2 : 1;
    saved[lv] = Math.max(saved[lv] || 0, st); K.save('stars', saved);
    K.sfx.win();
    const last = lv === LEVELS.length - 1;
    setTimeout(() => {
      const b = [];
      if (!last) b.push({ label: 'Next level', on: () => startLevel(lv + 1) });
      b.push({ label: 'Replay', ghost: !last, on: () => startLevel(lv) }, { label: 'Levels', ghost: true, on: menu });
      K.overlay({
        kicker: `Level ${lv + 1}`, title: last ? 'You beat them all!' : 'Level cleared!',
        sub: `${shots} shot${shots > 1 ? 's' : ''} for ${targets.length} target${targets.length > 1 ? 's' : ''}.`,
        html: `<div style="font-size:2.4em;letter-spacing:.15em;color:${GOLD};text-shadow:0 0 .4em rgba(255,204,51,.6)">${'★'.repeat(st)}<span style="opacity:.2">${'★'.repeat(3 - st)}</span></div>`,
        buttons: b,
      });
    }, 900);
  }
  function lose() {
    K.state = 'over';
    setTimeout(() => {
      K.sfx.lose();
      K.overlay({ kicker: `Level ${lv + 1}`, title: 'Out of shots', sub: 'Tip: ' + L.tip, buttons: [{ label: 'Try again', on: () => startLevel(lv) }, { label: 'Levels', ghost: true, on: menu }] });
    }, 700);
  }
  const hitsWall = (x, y) => walls.some(w => x > w.x - BALL && x < w.x + w.w + BALL && y > w.y - BALL && y < w.y + w.h + BALL);
  const bobY = t => t.bob ? t.by + Math.sin(K.t * 1.6) * t.bob : t.by;

  function update(dt) {
    for (const t of targets) t.y = bobY(t);
    const ka = (K.keys.ArrowUp || K.keys.w || K.keys.W ? 1 : 0) - (K.keys.ArrowDown || K.keys.s || K.keys.S ? 1 : 0);
    const kp = (K.keys.ArrowRight || K.keys.d || K.keys.D ? 1 : 0) - (K.keys.ArrowLeft || K.keys.a || K.keys.A ? 1 : 0);
    if (ka) angle = K.clamp(angle + ka * 30 * dt, 1, 89);
    if (kp) power = K.clamp(power + kp * 40 * dt, 5, 100);
    if (!ball) return;
    // Small steps so fast shots don't skip through walls.
    const steps = 6;
    for (let i = 0; i < steps && ball; i++) {
      const h = dt / steps;
      ball.vx += wind * h; ball.vy += G * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
      for (const t of targets) if (!t.hit && Math.hypot(ball.x - t.x, ball.y - t.y) < t.r + BALL) {
        t.hit = true;
        K.burst(t.x, t.y, GOLD, 26, 280, 5); K.burst(t.x, t.y, RED, 14, 200, 4, false);
        K.float(t.x, t.y - 34, `Hit at ${Math.round(ball.ang)}°!`, GOLD, 22); K.sfx.coin(); K.shake(5);
      }
      if (hitsWall(ball.x, ball.y)) { K.burst(ball.x, ball.y, '#b9a7ff', 10, 160, 3, false); K.sfx.note(170, 0.12); return endShot(ball.x, ball.y); }
      if (ball.y > GROUND - BALL) { K.burst(ball.x, GROUND - 4, '#5ee0a0', 10, 150, 3, false); K.sfx.note(140, 0.12); return endShot(ball.x, GROUND); }
      if (ball.x > W + 40 || ball.x < -40) return endShot(ball.x, ball.y);
      if (targets.every(t => t.hit)) { lastTrail = trail; return win(); }
    }
    const lt = trail[trail.length - 1];
    if (!lt || Math.hypot(ball.x - lt[0], ball.y - lt[1]) > 6) trail.push([ball.x, ball.y]);
  }

  // ---------- drawing ----------
  function drawScene(c, t) {
    // twinkling stars
    for (let i = 0; i < 60; i++) {
      const x = (i * 173) % W, y = (i * 61) % 300;
      c.fillStyle = `rgba(255,255,255,${0.15 + 0.4 * Math.abs(Math.sin(t * 0.8 + i))})`; c.fillRect(x, y, 1.5, 1.5);
    }
    // hills, two layers
    [[0.16, 70, 110, '#2a2160', 0], [0.3, 40, 80, '#1b2c52', 2]].forEach(([a, base, amp, col, ph]) => {
      c.beginPath(); c.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 16) c.lineTo(x, GROUND - base - Math.sin(x / 120 + ph) * amp * 0.3 - Math.sin(x / 47 + ph) * 8);
      c.lineTo(W, GROUND); c.closePath();
      const g = c.createLinearGradient(0, GROUND - base - amp, 0, GROUND);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(10,14,30,.9)');
      c.fillStyle = g; c.globalAlpha = 0.9; c.fill(); c.globalAlpha = 1;
    });
    // ground
    const g = c.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#16403f'); g.addColorStop(1, '#081620');
    c.fillStyle = g; c.fillRect(0, GROUND, W, H - GROUND);
    K.glowLine(c, [[0, GROUND], [W, GROUND]], '#5ee0a0', 2, 12);
    // wind flag
    const fx = 24, dir = Math.sign(wind);
    c.strokeStyle = 'rgba(230,236,255,.75)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(fx, GROUND); c.lineTo(fx, GROUND - 62); c.stroke();
    c.save(); c.translate(fx, GROUND - 60);
    const flap = Math.sin(t * (wind ? 9 : 2)) * (wind ? 3 : 1), len = wind ? (Math.abs(wind) >= 80 ? 30 : 22) : 6;
    c.fillStyle = wind ? CYAN : 'rgba(79,209,255,.5)'; c.shadowColor = CYAN; c.shadowBlur = wind ? 10 : 0;
    c.beginPath(); c.moveTo(0, 0);
    if (wind) { c.lineTo(dir * len, 5 + flap); c.lineTo(0, 13); } else { c.lineTo(len, 18 + flap); c.lineTo(0, 22); }
    c.fill(); c.restore();
  }
  function drawWall(c, w) {
    K.tile(c, w.x, w.y, w.w, w.h, '#6c5ce7', { r: 6, depth: 4 });
    c.save(); K.rr(c, w.x, w.y, w.w, w.h, 6); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 1;
    for (let y = w.y + 14; y < w.y + w.h; y += 14) {
      c.beginPath(); c.moveTo(w.x, y); c.lineTo(w.x + w.w, y); c.stroke();
      for (let x = w.x + (((y - w.y) / 14) % 2 ? 9 : 18); x < w.x + w.w; x += 18) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 14); c.stroke(); }
    }
    c.restore();
    c.strokeStyle = 'rgba(185,167,255,.5)'; c.lineWidth = 1; K.rr(c, w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1, 6); c.stroke();
  }
  function drawTarget(c, t, time) {
    if (t.bob) { c.save(); c.strokeStyle = 'rgba(255,255,255,.18)'; c.setLineDash([4, 6]); c.beginPath(); c.moveTo(t.x, t.by - t.bob); c.lineTo(t.x, t.by + t.bob); c.stroke(); c.restore(); }
    const pulse = 1 + Math.sin(time * 4 + t.x) * 0.04, r = t.r * pulse;
    K.orb(c, t.x, t.y, r, RED, { glow: 20 });
    c.fillStyle = 'rgba(255,255,255,.92)'; c.beginPath(); c.arc(t.x, t.y, r * 0.7, 0, 7); c.fill();
    K.orb(c, t.x, t.y, r * 0.45, RED, { glow: 0 });
    c.fillStyle = '#fff'; c.beginPath(); c.arc(t.x, t.y, r * 0.17, 0, 7); c.fill();
  }
  function drawDots(c, pts, a, r) {
    c.save(); c.fillStyle = `rgba(255,214,120,${a})`; c.shadowColor = GOLD; c.shadowBlur = a > 0.4 ? 8 : 0;
    for (const [x, y] of pts) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
    c.restore();
  }
  function drawProtractor(c) {
    const a = angle * Math.PI / 180;
    c.save();
    c.fillStyle = 'rgba(255,204,51,.10)'; c.beginPath(); c.moveTo(CX, CY); c.arc(CX, CY, 92, -a, 0); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(220,228,255,.3)'; c.lineWidth = 1.5; c.beginPath(); c.arc(CX, CY, 92, -Math.PI / 2, 0); c.stroke();
    for (let d = 0; d <= 90; d += 5) {
      const q = d * Math.PI / 180, r1 = d % 15 === 0 ? 80 : 86;
      c.beginPath(); c.moveTo(CX + Math.cos(q) * r1, CY - Math.sin(q) * r1); c.lineTo(CX + Math.cos(q) * 92, CY - Math.sin(q) * 92); c.stroke();
      if (d % 15 === 0) K.text(d + '°', CX + Math.cos(q) * 106, CY - Math.sin(q) * 106, 11, 'rgba(220,228,250,.7)', { weight: 600, c });
    }
    c.restore();
    K.glowLine(c, [[CX + Math.cos(a) * 60, CY - Math.sin(a) * 60], [CX + Math.cos(a) * 96, CY - Math.sin(a) * 96]], GOLD, 2, 10);
  }
  function drawCannon(c) {
    c.save(); c.translate(CX, CY); c.rotate(-angle * Math.PI / 180);
    const g = c.createLinearGradient(0, -12, 0, 12);
    g.addColorStop(0, '#8b9bd6'); g.addColorStop(0.5, '#47548a'); g.addColorStop(1, '#232a4d');
    c.shadowColor = 'rgba(79,209,255,.5)'; c.shadowBlur = 12;
    c.fillStyle = g; K.rr(c, -6, -11, 56, 22, 8); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,255,255,.25)'; K.rr(c, -2, -9, 48, 6, 3); c.fill();
    const m = c.createLinearGradient(0, -13, 0, 13);
    m.addColorStop(0, '#ffe08a'); m.addColorStop(1, '#c98a1a');
    c.fillStyle = m; K.rr(c, 38, -13, 14, 26, 5); c.fill();
    c.restore();
    K.orb(c, CX, CY + 2, 17, '#3a2e6c', { glow: 8 });
    K.orb(c, CX, CY + 2, 6, GOLD, { glow: 8 });
  }

  function draw(c, t) {
    drawScene(c, t);
    for (const w of walls) drawWall(c, w);
    for (const tg of targets) { if (K.state !== 'play') tg.y = bobY(tg); if (!tg.hit) drawTarget(c, tg, t); }
    drawDots(c, lastTrail, 0.35, 2.2);
    if (trail.length > 1) K.glowLine(c, ball ? [...trail, [ball.x, ball.y]] : trail, 'rgba(255,214,120,.8)', 2.5, 10);
    drawProtractor(c);
    // short aiming guide: just the start of the path
    if (K.state === 'play' && !ball) {
      const a = angle * Math.PI / 180, v = speed(), pts = [];
      for (let i = 1; i <= 6; i++) {
        const s = i * 0.035;
        pts.push([CX + Math.cos(a) * 48 + Math.cos(a) * v * s + 0.5 * wind * s * s, CY - Math.sin(a) * 48 - Math.sin(a) * v * s + 0.5 * G * s * s]);
      }
      c.save(); c.shadowColor = '#fff'; c.shadowBlur = 8;
      pts.forEach(([x, y], i) => { c.fillStyle = `rgba(255,255,255,${0.95 - i * 0.1})`; c.beginPath(); c.arc(x, y, 3.4 - i * 0.2, 0, 7); c.fill(); });
      c.restore();
    }
    drawCannon(c);
    if (ball) K.orb(c, ball.x, ball.y, BALL, '#ffe6a0', { glow: 18 });

    // HUD
    K.chip(12, 10, 'Level', `${lv + 1}/${LEVELS.length}`, '#fff', { w: 84, h: 46 });
    K.chip(104, 10, 'Angle', `${Math.round(angle)}°`, GOLD, { w: 92, h: 46, size: 21 });
    K.chip(204, 10, 'Power', Math.round(power), CYAN, { w: 92, h: 46, size: 21 });
    c.fillStyle = 'rgba(79,209,255,.18)'; K.rr(c, 214, 49, 72, 3, 1.5); c.fill();
    c.fillStyle = CYAN; K.rr(c, 214, 49, 72 * power / 100, 3, 1.5); c.fill();
    const sw = 40 + maxShots * 18;
    K.panel(c, 702 - sw, 10, sw, 46, { r: 12 });
    K.text('SHOTS', 702 - sw / 2, 24, 10, 'rgba(210,218,245,.65)', { weight: 700 });
    for (let i = 0; i < maxShots; i++) {
      const x = 702 - sw / 2 + (i - (maxShots - 1) / 2) * 18;
      if (i < maxShots - shots) K.orb(c, x, 41, 6, '#ffe6a0', { glow: 8 });
      else { c.fillStyle = 'rgba(255,255,255,.15)'; c.beginPath(); c.arc(x, 41, 5, 0, 7); c.fill(); }
    }
    K.button(levelsBtn);
    if (wind) K.chip(788, 62, 'Wind', `${wind > 0 ? '→' : '←'} ${Math.abs(wind) >= 80 ? 'strong' : 'light'}`, CYAN, { align: 'right', w: 112, h: 44, size: 16 });
    // level tip on the ground strip, before the first shot
    if (K.state === 'play' && shots === 0 && !ball) {
      c.font = K.font(13, 600);
      const lines = []; let line = '';
      for (const w of L.tip.split(' ')) { const s = line ? line + ' ' + w : w; if (c.measureText(s).width > 500 && line) { lines.push(line); line = w; } else line = s; }
      lines.push(line);
      const bw = Math.max(...lines.map(l => c.measureText(l).width)) + 28, bh = 12 + lines.length * 16, cx = 420;
      K.panel(c, cx - bw / 2, H - 4 - bh, bw, bh, { r: 10, fill: 'rgba(8,12,28,.78)' });
      lines.forEach((l, i) => K.text(l, cx, H - 4 - bh + 14 + i * 16, 13, '#e6eaf8', { weight: 600 }));
    }
  }

  // For automated testing.
  window.__as = { get state() { return K.state; }, get ball() { return ball; }, get targets() { return targets; }, get level() { return lv + 1; }, startLevel: n => startLevel(n - 1), set: (a, p) => { angle = a; power = p; }, fire, LEVELS };
})();
</script>
</body>
</html>
